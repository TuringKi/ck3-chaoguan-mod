l_english:
 guanzhi_court.1001.o0:0 "朕当虚怀纳谏，即日改正"
 guanzhi_court.1001.o1:0 "留中不发，姑且置之"
 guanzhi_court.1001.o2:0 "大胆！当廷申斥，罚俸半年"
 guanzhi_court.1001.t:0 "犯颜直谏"
 guanzhi_court.1001.desc:0 "早朝方散，[guanzhi_official.GetTitledFirstName]捧疏直趋御前。疏中历数朕近来之失：营缮频兴、游幸无度、听言不终。字字切直，毫不假借。左右皆为之变色，[guanzhi_official.GetTitledFirstName]却昂首而立，静候裁决。"
 guanzhi_court.1002.o0:0 "I see."
 guanzhi_court.1002.t:0 "君臣相得"
 guanzhi_court.1002.desc:0 "朕纳谏之事传遍朝野。[guanzhi_official.GetTitledFirstName]感佩君恩，办事愈发勤勉，朝中直臣亦颇受鼓舞，奏章日切，政事日清。"
 guanzhi_court.1003.o0:0 "忠言逆耳，再忍他一回"
 guanzhi_court.1003.o1:0 "沽名钓誉之徒，外放离京"
 guanzhi_court.1003.t:0 "得寸进尺"
 guanzhi_court.1003.desc:0 "自朕纳谏之后，[guanzhi_official.GetTitledFirstName]声名鹊起，奏疏却愈发尖刻，几至于指斥乘舆。朝中已有私语：此人是卖直取名，还是真心为国？"
 guanzhi_court.1004.o0:0 "I see."
 guanzhi_court.1004.t:0 "石沉大海"
 guanzhi_court.1004.desc:0 "奏疏留中已逾半月，[guanzhi_official.GetTitledFirstName]见圣心难测，渐生退意，近日衙署理事也懒散了些。"
 guanzhi_court.1005.o0:0 "罢了，准其所奏"
 guanzhi_court.1005.o1:0 "将其削职，以儆效尤"
 guanzhi_court.1005.t:0 "再度上书"
 guanzhi_court.1005.desc:0 "前疏未复，[guanzhi_official.GetTitledFirstName]竟再上一疏，言辞比前次更为峻切，且抄示同僚，朝野哄传。朕若再不理会，恐失天下之望。"
 guanzhi_court.1006.o0:0 "朕知错了，召还抚慰"
 guanzhi_court.1006.o1:0 "朕意已决，不必多言"
 guanzhi_court.1006.t:0 "朝野清议"
 guanzhi_court.1006.desc:0 "朕申斥言官之事已在朝中传开。清议纷纷，有人谓朕不能容直臣，亦有老臣上表为[guanzhi_official.GetTitledFirstName]缓颊。"
 guanzhi_court.1007.o0:0 "I see."
 guanzhi_court.1007.t:0 "从谏如流"
 guanzhi_court.1007.desc:0 "几番往复，朕终纳其言。[guanzhi_official.GetTitledFirstName]顿首谢恩，朝中正气为之一振。史臣援笔记下：主圣臣直，一时佳话。"
 guanzhi_court.1008.o0:0 "I see."
 guanzhi_court.1008.t:0 "言路受挫"
 guanzhi_court.1008.desc:0 "[guanzhi_official.GetTitledFirstName]去职之日，朝中一片寂然。自此上书言事者渐少，朝堂之上，唯闻颂圣之声。"
 guanzhi_court.1011.o0:0 "朝臣结党，岂可纵之？下诏切责"
 guanzhi_court.1011.o1:0 "不动声色，暗察其党羽"
 guanzhi_court.1011.o2:0 "群臣和睦，亦是美事，不必深究"
 guanzhi_court.1011.t:0 "朋党之迹"
 guanzhi_court.1011.desc:0 "御史台密奏：近日[guanzhi_official.GetTitledFirstName]门下宾客往来不绝，同升同黜，互为羽翼。朝中除授，每先闻于其私第，而后乃下诏旨。朋党之迹，已非一日。"
 guanzhi_court.1012.o0:0 "I see."
 guanzhi_court.1012.t:0 "奉命敛迹"
 guanzhi_court.1012.desc:0 "切责之诏既下，[guanzhi_official.GetTitledFirstName]闭门谢客，其党羽亦纷纷散去。朝局一时清肃。"
 guanzhi_court.1013.o0:0 "夺其官职，逐出朝廷"
 guanzhi_court.1013.o1:0 "再观其变，不可逼之太甚"
 guanzhi_court.1013.t:0 "阳奉阴违"
 guanzhi_court.1013.desc:0 "诏书切责之后，[guanzhi_official.GetTitledFirstName]表面敛迹，暗里却以文会雅集为名，党援愈固。其门生故吏，已遍布诸曹。"
 guanzhi_court.1014.o0:0 "一网打尽，以正朝纲"
 guanzhi_court.1014.o1:0 "分化瓦解，徐徐图之"
 guanzhi_court.1014.t:0 "党谱在握"
 guanzhi_court.1014.desc:0 "数月暗察，其党之渠魁羽翼、联络脉络，朕已了然于胸。何时动手、先剪何人，尽在朕一念之间。"
 guanzhi_court.1015.o0:0 "先下手为强，即刻收捕"
 guanzhi_court.1015.o1:0 "示之以宽，使其自安"
 guanzhi_court.1015.t:0 "打草惊蛇"
 guanzhi_court.1015.desc:0 "朕遣人暗察之事竟已走漏。[guanzhi_official.GetTitledFirstName]一党人人自危，近日频频聚会，不知在谋划些什么。"
 guanzhi_court.1016.o0:0 "两党的首脑都给我外放"
 guanzhi_court.1016.o1:0 "各打五十大板，申饬双方"
 guanzhi_court.1016.t:0 "两党互讦"
 guanzhi_court.1016.desc:0 "朕未加裁抑，朝中遂成两党：一党附[guanzhi_official.GetTitledFirstName]，一党攻之。今日甲弹乙贪墨，明日乙讦甲交通，章奏交驰，是非蜂起。"
 guanzhi_court.1017.o0:0 "忍无可忍，断然除之"
 guanzhi_court.1017.o1:0 "且容一时，徐图良策"
 guanzhi_court.1017.t:0 "尾大不掉"
 guanzhi_court.1017.desc:0 "日积月累，其党盘根错节。如今六部除吏、台谏迁转，皆须先过[guanzhi_official.GetTitledFirstName]之门。朕的旨意，竟有出不了宫门之势。"
 guanzhi_court.1018.o0:0 "I see."
 guanzhi_court.1018.t:0 "剪除朋党"
 guanzhi_court.1018.desc:0 "诏下之日，[guanzhi_official.GetTitledFirstName]解印去职，党羽或贬或逐，一时朝堂为之一空。道路相传，有快之者，亦有惴惴者。"
 guanzhi_court.1019.o0:0 "I see."
 guanzhi_court.1019.t:0 "党争渐息"
 guanzhi_court.1019.desc:0 "几番软硬兼施，两党之势渐衰，廷臣各归其职。朝堂之上，总算恢复了几分清净。"
 guanzhi_court.1021.o0:0 "付之一炬，朕不究此书"
 guanzhi_court.1021.o1:0 "下诏狱，务必查出主使"
 guanzhi_court.1021.o2:0 "密令台谏留意可疑之人"
 guanzhi_court.1021.t:0 "谤书盈箧"
 guanzhi_court.1021.desc:0 "黄门拾得一卷匿名谤书，献于御前。书中讪谤朝政，语及宫闱，甚至暗指朕德不配位。笔迹似曾相识，字里行间，隐约有朝臣手笔。"
 guanzhi_court.1022.o0:0 "I see."
 guanzhi_court.1022.t:0 "焚书安众"
 guanzhi_court.1022.desc:0 "朕当着百官的面，将谤书投入火盆。火光起处，群臣先是愕然，继而山呼万岁。那些心中惴惴之人，自此安堵如故。"
 guanzhi_court.1023.o0:0 "此番非查个水落石出不可"
 guanzhi_court.1023.o1:0 "清者自清，由他去罢"
 guanzhi_court.1023.t:0 "谤声复起"
 guanzhi_court.1023.desc:0 "焚书之举并未止谤。坊间又传出新作，言辞更为放肆，且讥讽朕'焚书心虚'。看来，是有人存心要与朝廷作对。"
 guanzhi_court.1024.o0:0 "谤讪君上，罪在不赦，赐死"
 guanzhi_court.1024.o1:0 "削职夺爵，永不叙用"
 guanzhi_court.1024.o2:0 "其言虽狂，其才可用，恕之"
 guanzhi_court.1024.t:0 "主使现形"
 guanzhi_court.1024.desc:0 "诏狱穷治月余，终于有了眉目——谤书竟出自[guanzhi_official.GetTitledFirstName]之手！其人对朕的用人行政怀怨已久，遂作此书泄愤。"
 guanzhi_court.1025.o0:0 "就此止狱，释放无辜"
 guanzhi_court.1025.o1:0 "继续查！朕不信揪不出来"
 guanzhi_court.1025.t:0 "罗织未成"
 guanzhi_court.1025.desc:0 "狱吏拷掠多日，牵连数十人，却始终坐实不了主使。朝中人人自危，见面不敢交谈，道路以目。"
 guanzhi_court.1026.o0:0 "传他对质，看他如何辩白"
 guanzhi_court.1026.o1:0 "无凭无据，不可造次"
 guanzhi_court.1026.t:0 "蛛丝可寻"
 guanzhi_court.1026.desc:0 "台谏暗察多日，回报谤书纸墨出自内库，能取用者不过寥寥数人，[guanzhi_official.GetTitledFirstName]恰在其中。"
 guanzhi_court.1027.o0:0 "召集百官，当众明志止谤"
 guanzhi_court.1027.o1:0 "朕行朕志，何恤人言"
 guanzhi_court.1027.t:0 "事机不密"
 guanzhi_court.1027.desc:0 "密察之事竟被察觉。如今朝中人人自危，相互提防，皆有唇亡齿寒之惧，视台谏如虎狼。"
 guanzhi_court.1028.o0:0 "I see."
 guanzhi_court.1028.t:0 "风波渐平"
 guanzhi_court.1028.desc:0 "谤书之事，终究查无实据。朕下诏宽慰群臣，此事不再提起。朝堂之上，风波暂息。"
 guanzhi_court.1029.o0:0 "I see."
 guanzhi_court.1029.t:0 "以刑止谤"
 guanzhi_court.1029.desc:0 "[guanzhi_official.GetTitledFirstName]伏法之日，谤议顿息。然群臣自此缄口，朝堂之上，再无人敢议朝政得失了。"
 guanzhi_court.1030.o0:0 "I see."
 guanzhi_court.1030.t:0 "铸成深狱"
 guanzhi_court.1030.desc:0 "诏狱一拖数月，株连愈广。朝臣噤若寒蝉，有识者已开始暗中叹息：朝廷防民之口，甚于防川。"
 guanzhi_court.1031.o0:0 "民为邦本，准奏蠲免"
 guanzhi_court.1031.o1:0 "减半蠲免，兼顾国用"
 guanzhi_court.1031.o2:0 "军国所需，不能减免"
 guanzhi_court.1031.t:0 "旱岁请蠲"
 guanzhi_court.1031.desc:0 "大旱，赤地千里，流民相望于道。[guanzhi_official.GetTitledFirstName]上疏请蠲免今年租赋，以苏民困。户部却奏：军费俸禄，皆仰租赋，一蠲则国用立绌。两厢争执，皆待朕一言而决。"
 guanzhi_court.1032.o0:0 "I see."
 guanzhi_court.1032.t:0 "民歌其德"
 guanzhi_court.1032.desc:0 "蠲免之诏一下，旱区之民扶老携幼，望阙叩谢。虽天灾未解，而人心已安。史臣记曰：岁饥而民不怨者，君有德也。"
 guanzhi_court.1033.o0:0 "发朕内帑，以充边饷"
 guanzhi_court.1033.o1:0 "复征所蠲之赋，以应急需"
 guanzhi_court.1033.t:0 "边饷告急"
 guanzhi_court.1033.desc:0 "租赋既蠲，国用骤绌。边军粮饷拖欠两月，边将羽书告急。户部束手，朕须另筹。"
 guanzhi_court.1034.o0:0 "I see."
 guanzhi_court.1034.t:0 "官民两便"
 guanzhi_court.1034.desc:0 "减半之议既行，灾民得缓须臾，国库亦未大伤。[guanzhi_official.GetTitledFirstName]亦上表称善，谓朕恩威并济，处置得宜。"
 guanzhi_court.1035.o0:0 "开仓赈济，所蠲全免"
 guanzhi_court.1035.o1:0 "命有司就地抚绥，不必再蠲"
 guanzhi_court.1035.t:0 "旱魃为虐"
 guanzhi_court.1035.desc:0 "入秋滴雨未降，灾情更甚。减半之赋仍催缴于门，灾民拆屋卖子，流亡者日众。[guanzhi_official.GetTitledFirstName]再疏请大开仓廪。"
 guanzhi_court.1036.o0:0 "发兵弹压，以儆效尤"
 guanzhi_court.1036.o1:0 "遣使赈抚，追蠲租赋"
 guanzhi_court.1036.t:0 "饥民啸聚"
 guanzhi_court.1036.desc:0 "租赋催科如故，饥民忍无可忍，啸聚山林，攻劫粮仓。地方官告急文书，雪片般飞入京师。"
 guanzhi_court.1037.o0:0 "I see."
 guanzhi_court.1037.t:0 "转危为安"
 guanzhi_court.1037.desc:0 "赈粮所至，流民渐归故里，啸聚者不战自散。一场风波，消弭于无形。朝野皆谓朕能改过恤民。"
 guanzhi_court.1038.o0:0 "I see."
 guanzhi_court.1038.t:0 "怨声载道"
 guanzhi_court.1038.desc:0 "旱灾未息，政令先失民心。坊间童谣讽刺朝政，清议亦多有微词。[guanzhi_official.GetTitledFirstName]默然退朝，自此言事者稀。"
 guanzhi_court.1041.o0:0 "卿言是也，封禅之议即罢"
 guanzhi_court.1041.o1:0 "告成天地，乃人主之荣，朕意已决"
 guanzhi_court.1041.o2:0 "沮议大典，罚俸思过"
 guanzhi_court.1041.t:0 "封禅之议"
 guanzhi_court.1041.desc:0 "连年丰稔，祥瑞屡奏，群臣上表请朕东巡封禅，告成功于天地。[guanzhi_official.GetTitledFirstName]独抗疏谏阻：封禅之礼，劳民伤财，虚费巨万，古之明主犹慎之。"
 guanzhi_court.1042.o0:0 "I see."
 guanzhi_court.1042.t:0 "罢议称德"
 guanzhi_court.1042.desc:0 "朕罢封禅之议，省费巨万。诏书传布四方，士民皆颂朕俭德，谓此胜于登封告成多矣。"
 guanzhi_court.1043.o0:0 "祥瑞虚名，终不许也"
 guanzhi_court.1043.o1:0 "顺其意，以俭礼行之"
 guanzhi_court.1043.t:0 "祥瑞复奏"
 guanzhi_court.1043.desc:0 "罢议之后，四方祥瑞奏报反而愈勤：甘露降、嘉禾生、白雉见。群臣复联名上表，谓天贶如此，不封禅是无以答天心。"
 guanzhi_court.1044.o0:0 "I see."
 guanzhi_court.1044.t:0 "礼成东岳"
 guanzhi_court.1044.desc:0 "车驾东巡，千官扈从，旌旗蔽野。登封之礼，极一时之盛。然沿途供顿，州县为之疲敝，库藏为之一空。"
 guanzhi_court.1045.o0:0 "下诏谢过，减膳撤乐，回銮"
 guanzhi_court.1045.o1:0 "天象无常，礼成而返，毋得妄言"
 guanzhi_court.1045.t:0 "风雨阻驾"
 guanzhi_court.1045.desc:0 "车驾将至山下，忽风雨大作，从官狼狈，仪仗尽湿。清议私相谓曰：此天戒也，封禅非其时也。"
 guanzhi_court.1046.o0:0 "朕为其诚所动，封禅作罢"
 guanzhi_court.1046.o1:0 "狂悖如此，贬出朝廷"
 guanzhi_court.1046.t:0 "伏阙再谏"
 guanzhi_court.1046.desc:0 "[guanzhi_official.GetTitledFirstName]虽罚不悔，竟伏阙再谏，叩首于地曰：陛下必欲劳民以逞虚名，臣请先死阙下。血渍丹墀，左右动容。"
 guanzhi_court.1047.o0:0 "I see."
 guanzhi_court.1047.t:0 "俭礼告成"
 guanzhi_court.1047.desc:0 "朕从简行之：减仪仗、省供顿，礼成而民不知劳。议者谓此举兼得告成之荣与恤民之实。"
 guanzhi_court.1048.o0:0 "I see."
 guanzhi_court.1048.t:0 "劳民伤财"
 guanzhi_court.1048.desc:0 "封禅既毕，府库空虚，百姓疲于供役。四方虽有颂声，而闾阎之间，叹息相闻。"
 guanzhi_court.1051.o0:0 "天变可畏，下诏罪己"
 guanzhi_court.1051.o1:0 "避正殿、素服，而不罪己"
 guanzhi_court.1051.o2:0 "天变何预人事？斥其妄言"
 guanzhi_court.1051.t:0 "日食天戒"
 guanzhi_court.1051.desc:0 "朔日，日有食之，白昼如晦。占者曰：阴侵阳，臣蔽君之象。[guanzhi_official.GetTitledFirstName]应诏上书，极言时政阙失，请朕侧身修行，以答天戒。"
 guanzhi_court.1052.o0:0 "I see."
 guanzhi_court.1052.t:0 "罪己求言"
 guanzhi_court.1052.desc:0 "罪己之诏既下，朕素服避殿，减膳彻乐，广开言路。群臣上封事者日以十数，朝政阙失，多所厘正。天人之际，若有感通。"
 guanzhi_court.1053.o0:0 "咎在朕躬，不累大臣，悉慰留之"
 guanzhi_court.1053.o1:0 "罢数人以塞天戒，平息物议"
 guanzhi_court.1053.t:0 "借机攻讦"
 guanzhi_court.1053.desc:0 "罪己诏下，有官员借天变之说，奏请罢黜宰执数人，谓'三公燮理无状，宜策免以应天变'。朝中人心浮动，宰执皆待罪于家。"
 guanzhi_court.1054.o0:0 "I see."
 guanzhi_court.1054.t:0 "礼敬天变"
 guanzhi_court.1054.desc:0 "朕避正殿、服素、减膳，礼敬天变而不轻议己过。清议谓朕处变得礼，既敬天威，亦全君体。[guanzhi_official.GetTitledFirstName]亦不复言。"
 guanzhi_court.1055.o0:0 "深自刻责，大赦天下"
 guanzhi_court.1055.o1:0 "灾异岁岁有之，岂皆朕过"
 guanzhi_court.1055.t:0 "京师地震"
 guanzhi_court.1055.desc:0 "日食未几，京师又震，官舍民居多有倾圮。[guanzhi_official.GetTitledFirstName]再上一疏，言修省未至，天戒屡申，词气切直。"
 guanzhi_court.1056.o0:0 "I see."
 guanzhi_court.1056.t:0 "言路渐塞"
 guanzhi_court.1056.desc:0 "朕斥妄言天戒者，群臣自此相戒不言灾异。太史奏报天象，亦多隐饰。朝中但闻称颂，不复闻箴规。"
 guanzhi_court.1057.o0:0 "I see."
 guanzhi_court.1057.t:0 "修省答天"
 guanzhi_court.1057.desc:0 "几番灾异，几番修省。朕亲录囚徒、宽减赋役、求直言阙政。天意虽远，而人事既修，朝野之气为之一新。"
 guanzhi_court.1061.o0:0 "纳其谏，即日罢猎还宫"
 guanzhi_court.1061.o1:0 "畋猎讲武，古之制也，照出"
 guanzhi_court.1061.o2:0 "败朕兴致，廷杖二十"
 guanzhi_court.1061.t:0 "谏止畋猎"
 guanzhi_court.1061.desc:0 "秋高马肥，朕数出畋猎，驰骋终日，旬日不返。[guanzhi_official.GetTitledFirstName]上疏切谏：驰逐之乐，危身荒政，非人主所宜耽。疏入之日，朕正整装欲出。"
 guanzhi_court.1062.o0:0 "I see."
 guanzhi_court.1062.t:0 "罢猎称颂"
 guanzhi_court.1062.desc:0 "朕即日罢猎，还宫视朝。消息传出，士大夫交口称颂，谓朕闻过即改，有古明君之风。"
 guanzhi_court.1063.o0:0 "忠言可喜，悉从其请"
 guanzhi_court.1063.o1:0 "事事饶舌，渐疏此人"
 guanzhi_court.1063.t:0 "得陇望蜀"
 guanzhi_court.1063.desc:0 "朕既罢猎，[guanzhi_official.GetTitledFirstName]乘势再上一疏：厩马蕃息太盛，岁费刍豆巨万，请大加裁减。句句有理，而朕听之颇觉刺耳。"
 guanzhi_court.1064.o0:0 "险哉！自此戒猎"
 guanzhi_court.1064.o1:0 "皮肉小伤，何碍再猎"
 guanzhi_court.1064.t:0 "驰逐坠马"
 guanzhi_court.1064.desc:0 "围场之中，朕纵马逐鹿，马失前蹄，朕坠于草间，幸伤不甚。随驾群臣面无人色。[guanzhi_official.GetTitledFirstName]抚膺长叹：臣疏中之言，不幸验矣。"
 guanzhi_court.1065.o0:0 "偿其稼直，猎事自此有节"
 guanzhi_court.1065.o1:0 "驱民避道，猎事不废"
 guanzhi_court.1065.t:0 "猎骑践田"
 guanzhi_court.1065.desc:0 "猎骑所过，践民田禾数十顷。有老农拦马号诉，卫士呵之不去，声闻于朕。左右请治其罪，朕心亦为之不宁。"
 guanzhi_court.1066.o0:0 "朕悔之，亲抚其伤，赐金帛"
 guanzhi_court.1066.o1:0 "君威不可屈，任其议论"
 guanzhi_court.1066.t:0 "杖谏余波"
 guanzhi_court.1066.desc:0 "杖责谏臣之事传于外，清议沸腾。太学生伏阙上书，为[guanzhi_official.GetTitledFirstName]讼冤。老臣相继称病，不肯视事。"
 guanzhi_court.1067.o0:0 "I see."
 guanzhi_court.1067.t:0 "从谏息猎"
 guanzhi_court.1067.desc:0 "经此一番，朕畋猎之兴顿减，旬月不出。[guanzhi_official.GetTitledFirstName]名重朝野，而朕亦收纳谏之名。史官秉笔：主明臣直。"
 guanzhi_court.1068.o0:0 "I see."
 guanzhi_court.1068.t:0 "游猎如故"
 guanzhi_court.1068.desc:0 "谏疏虽数上，畋猎卒不废。苑囿之中，鹰犬之声相闻；朝堂之上，言及游猎者皆缄口矣。"
 guanzhi_court.1071.o0:0 "朕早有此意，即册嫡长为储"
 guanzhi_court.1071.o1:0 "朕春秋鼎盛，何急之有"
 guanzhi_court.1071.o2:0 "妄议国本，斥退！"
 guanzhi_court.1071.t:0 "国本之请"
 guanzhi_court.1071.desc:0 "朕在位既久，而储位虚悬。是日大朝，[guanzhi_official.GetTitledFirstName]出班执笏，率群臣顿首，请早建太子以定国本。殿上鸦雀无声，皆俟朕一言。"
 guanzhi_court.1072.o0:0 "I see."
 guanzhi_court.1072.t:0 "国本既定"
 guanzhi_court.1072.desc:0 "册立之礼成，天下悬心始安。四方上表称贺，边将亦遣使入贡。朝野翕然，谓社稷有托。"
 guanzhi_court.1073.o0:0 "早定名分，遣诸王就国"
 guanzhi_court.1073.o1:0 "朕当并爱之，勿使相疑"
 guanzhi_court.1073.t:0 "诸王怏怏"
 guanzhi_court.1073.desc:0 "储位既定，诸子之不得立者怏怏不乐，外戚近侍各附其主，私相结托。东宫与诸王府之间，渐生嫌隙。"
 guanzhi_court.1074.o0:0 "众意如此，择吉册立"
 guanzhi_court.1074.o1:0 "愈催愈缓，朕自有主张"
 guanzhi_court.1074.t:0 "请者日众"
 guanzhi_court.1074.desc:0 "朕既不置可否，请立储君之疏日益繁多，中外汹汹。有司至以立储为首务，章疏堆积，几不可理。"
 guanzhi_court.1075.o0:0 "感其忠悃，遂立储君"
 guanzhi_court.1075.o1:0 "忠诚可嘉，然朕自有主张"
 guanzhi_court.1075.t:0 "免冠死谏"
 guanzhi_court.1075.desc:0 "[guanzhi_official.GetTitledFirstName]免冠顿首于殿，血流被面，言：国本不定，臣不忍见社稷之危。愿陛下察臣愚忠。举朝恻然。"
 guanzhi_court.1076.o0:0 "惧其树党，速立储以绝其望"
 guanzhi_court.1076.o1:0 "敢言立储者贬！朕倒要看看"
 guanzhi_court.1076.t:0 "私相结托"
 guanzhi_court.1076.desc:0 "朕斥退言者之后，群臣不敢明言，转而私相结托：或附长子之母党，或攀爱子之近侍。立储之望不绝，而祸机潜滋。"
 guanzhi_court.1077.o0:0 "I see."
 guanzhi_court.1077.t:0 "册立储君"
 guanzhi_court.1077.desc:0 "册礼终行，储副既定。百官奉觞称贺，宫省肃然。数年悬而未决之局，一朝而定，朕亦释然。"
 guanzhi_court.1078.o0:0 "I see."
 guanzhi_court.1078.t:0 "储位久虚"
 guanzhi_court.1078.desc:0 "储位虚悬如故，而朝臣之心各异。今日之缄默，未必不是他日之隐忧。朕每念及此，寝不能安。"
 guanzhi_court.1081.o0:0 "老臣恳切，准其致仕还乡"
 guanzhi_court.1081.o1:0 "朝廷正倚老成，温诏慰留"
 guanzhi_court.1081.t:0 "乞骸骨"
 guanzhi_court.1081.desc:0 "[guanzhi_official.GetTitledFirstName]年逾七十，齿发凋落，入朝需人扶掖。近日连上二表，恳请致仕，归老田里。表文凄恻，言犬马之齿已尽，唯乞骸骨以归。"
 guanzhi_court.1082.o0:0 "I see."
 guanzhi_court.1082.t:0 "优诏允归"
 guanzhi_court.1082.desc:0 "朕览表恻然，优诏允之：赐金百斤、安车驷马，百官祖饯于都门之外。[guanzhi_official.GetTitledFirstName]衣锦还乡之日，乡人扶老携幼而观，咸以为荣。"
 guanzhi_court.1083.o0:0 "再加慰勉，望其勉出视事"
 guanzhi_court.1083.o1:0 "若再三恳辞，便遂其归志"
 guanzhi_court.1083.t:0 "温诏慰留"
 guanzhi_court.1083.desc:0 "朕不允所请，温诏慰留：加官进秩，赐几杖，特许入朝不趋。诏曰：朝廷方倚老成，卿何忍弃朕而去。[guanzhi_official.GetTitledFirstName]何去何从，朕尚须观其后效。"
 guanzhi_court.1084.o0:0 "感朕恩德，复起视事"
 guanzhi_court.1084.o1:0 "以老病固辞，终乞归田"
 guanzhi_court.1084.t:0 "中使存问"
 guanzhi_court.1084.desc:0 "朕遣中使存问再三，赐药饵、问起居，圣眷优渥，举朝皆知。同僚或劝[guanzhi_official.GetTitledFirstName]：主上眷眷如此，宜少留以全君臣之义。"
 guanzhi_court.1085.o0:0 "召其入朝，慰勉留任"
 guanzhi_court.1085.o1:0 "疑则勿用，听其挂冠"
 guanzhi_court.1085.t:0 "君心见疑"
 guanzhi_court.1085.desc:0 "[guanzhi_official.GetTitledFirstName]久不视事，朕心中渐疑：其心怀怨望、以退为进乎？左右近臣亦有进谗者，谓其矫饰邀名。君心难测，处置宜慎。"
 guanzhi_court.1086.o0:0 "I see."
 guanzhi_court.1086.t:0 "留任尽瘁"
 guanzhi_court.1086.desc:0 "[guanzhi_official.GetTitledFirstName]留任之后，虽体力日衰，犹每日视事，遇大政则延问顾问。朕尝谓左右：老臣在朝，如国之有蓍龟。"
 guanzhi_court.1087.o0:0 "I see."
 guanzhi_court.1087.t:0 "得请归田"
 guanzhi_court.1087.desc:0 "[guanzhi_official.GetTitledFirstName]恳请数四，朕终许之。临别陛辞，执手慰劳，良久乃退。归田之后，课孙灌园，优游卒岁，朝野皆羡其知止。"
 guanzhi_court.1088.o0:0 "I see."
 guanzhi_court.1088.t:0 "辞官失欢"
 guanzhi_court.1088.desc:0 "[guanzhi_official.GetTitledFirstName]固辞不已，终忤圣意。朕夺其加秩，放归田里，礼遇大减。离京之日，送者寥寥。君臣之义，至此而衰。"
 guanzhi_court.1091.o0:0 "体国忠言，即日罢役"
 guanzhi_court.1091.o1:0 "规模减半，务从俭约"
 guanzhi_court.1091.o2:0 "宫室壮丽，所以重威，不必听"
 guanzhi_court.1091.t:0 "谏止营宫"
 guanzhi_court.1091.desc:0 "朕以旧宫湫隘，命将作监图营新宫，取材于山，征夫数万。[guanzhi_official.GetTitledFirstName]上疏谏曰：宫室之营，劳民伤财，百姓方苏，未堪此役。图样就摆在御案之上。"
 guanzhi_court.1092.o0:0 "I see."
 guanzhi_court.1092.t:0 "罢役颂德"
 guanzhi_court.1092.desc:0 "罢役之诏既下，数万役夫得归农亩，欢声动地。清议谓朕能屈己从谏，省不急之务以养民力，是真社稷之福。"
 guanzhi_court.1093.o0:0 "以之修缮太庙，亦合礼制"
 guanzhi_court.1093.o1:0 "尽散还民，示朕无意营建"
 guanzhi_court.1093.t:0 "材木山积"
 guanzhi_court.1093.desc:0 "新宫虽罢，而先期采办之材木已堆积如山，露积于野，日就朽腐。有司奏请处置之方：或云弃之可惜，不如改营别项。"
 guanzhi_court.1094.o0:0 "I see."
 guanzhi_court.1094.t:0 "俭约宫成"
 guanzhi_court.1094.desc:0 "新宫规模减半，不施丹雘，不尚雕镂，期年而成。朕移居之日，谓左右曰：宫室足以避燥湿寒暑而已，何必壮丽。"
 guanzhi_court.1095.o0:0 "宁可缓作，勿用腐材"
 guanzhi_court.1095.o1:0 "姑用之，且成之再说"
 guanzhi_court.1095.t:0 "工料不继"
 guanzhi_court.1095.desc:0 "规模既减，拨款亦薄。将作监来报：栋梁之材以次充好，已有数处糟朽；工匠疲于催督，逃亡者众。工期恐将大误。"
 guanzhi_court.1096.o0:0 "竟敢直斥！罢其官，宫室照营"
 guanzhi_court.1096.o1:0 "其言虽逆，其忠可悯，罢役"
 guanzhi_court.1096.t:0 "役兴再谏"
 guanzhi_court.1096.desc:0 "大役既兴，征发日广，民有怨言。[guanzhi_official.GetTitledFirstName]再上疏，直斥朕以土木之功疲天下之力，言辞激切，几于犯颜。"
 guanzhi_court.1097.o0:0 "I see."
 guanzhi_court.1097.t:0 "幡然罢役"
 guanzhi_court.1097.desc:0 "朕读其再疏，终有所悟，下诏停役。已役之夫遣散归农，未竟之工封存以待。朝野相庆，谓朕改过不吝，社稷之幸。"
 guanzhi_court.1098.o0:0 "I see."
 guanzhi_court.1098.t:0 "宫成民怨"
 guanzhi_court.1098.desc:0 "新宫告成，飞檐耸翠，壮丽甲于天下。然民力为之疲敝，府库为之空虚。壮丽之观日新，而闾阎之怨日深。"
 guanzhi_court.1101.o0:0 "既有人才，朕自当破格用之"
 guanzhi_court.1101.o1:0 "此人底细不明，先暗中察访"
 guanzhi_court.1101.o2:0 "无名寒士，岂可骤登朝堂？不准"
 guanzhi_court.1101.t:0 "荐贤举能"
 guanzhi_court.1101.desc:0 "[guanzhi_official.GetTitledFirstName]上疏，力荐一寒门之士，称其有王佐之才，久困草野，愿朝廷破格擢用。疏中援引古今，辞意恳切。然朝中有私语：举主与被举者素不相识，何来如此知遇？"
 guanzhi_court.1102.o0:0 "I see."
 guanzhi_court.1102.t:0 "寒士展才"
 guanzhi_court.1102.desc:0 "那寒士入仕以来，夙夜在公，所理政务井井有条，同僚无不叹服。[guanzhi_official.GetTitledFirstName]荐贤之名，亦随之远播。"
 guanzhi_court.1103.o0:0 "念其举荐之功，薄责而已"
 guanzhi_court.1103.o1:0 "荐贤市恩，此风不可长，贬之"
 guanzhi_court.1103.t:0 "荐主之私"
 guanzhi_court.1103.desc:0 "谏官密奏：那寒士得官之后，与[guanzhi_official.GetTitledFirstName]往来过密，每逢除授，二人进退如一。荐贤之举，恐是豫植党羽之计。"
 guanzhi_court.1104.o0:0 "I see."
 guanzhi_court.1104.t:0 "冰心可鉴"
 guanzhi_court.1104.desc:0 "察访月余，回报二人素无瓜葛，[guanzhi_official.GetTitledFirstName]荐贤，纯出于公心。朕以小人之心度君子之腹，反觉汗颜。"
 guanzhi_court.1105.o0:0 "欺君罔上，拿问治罪"
 guanzhi_court.1105.o1:0 "人才难得，姑恕这一回"
 guanzhi_court.1105.t:0 "察得端倪"
 guanzhi_court.1105.desc:0 "察访有了结果：那寒士竟是[guanzhi_official.GetTitledFirstName]的妻族远亲，两家早有书信往来，相约同升。所谓荐贤，实为援引私党。"
 guanzhi_court.1106.o0:0 "I see."
 guanzhi_court.1106.t:0 "遗贤于野"
 guanzhi_court.1106.desc:0 "朕不准所奏，那寒士自此绝意仕进，归隐山林。乡间传语：朝廷之门虽高，不及草庐之安。[guanzhi_official.GetTitledFirstName]亦怏怏不乐。"
 guanzhi_court.1107.o0:0 "I see."
 guanzhi_court.1107.t:0 "网开一面"
 guanzhi_court.1107.desc:0 "朕终究没有深究。[guanzhi_official.GetTitledFirstName]感念圣恩，自此谨言慎行，再不敢私相援引。只是朝中已有人私下效仿，荐贤渐渐变了味道。"
 guanzhi_court.1108.o0:0 "I see."
 guanzhi_court.1108.t:0 "市恩之戒"
 guanzhi_court.1108.desc:0 "诏下之日，[guanzhi_official.GetTitledFirstName]解印出京，那寒士亦被黜落。百官见之，各自收敛，此后举荐者，无不先自避嫌。"
 guanzhi_court.1111.o0:0 "事涉边将，不可不查，下诏狱"
 guanzhi_court.1111.o1:0 "召其入对，听他当面自辩"
 guanzhi_court.1111.o2:0 "匿名之书，掷还不问"
 guanzhi_court.1111.t:0 "封事告讦"
 guanzhi_court.1111.desc:0 "自朕开密奏之制，四方封事日达御前。今有一封匿名封事，劾[guanzhi_official.GetTitledFirstName]阴结边将、交通外臣，语甚危切。无署名，无实证，唯字里行间杀气逼人。"
 guanzhi_court.1112.o0:0 "构陷大臣，反坐其罪，彻查投书者"
 guanzhi_court.1112.o1:0 "既无实据，释之复职，不再追问"
 guanzhi_court.1112.t:0 "查无实据"
 guanzhi_court.1112.desc:0 "诏狱穷治月余，翻遍文书、问遍仆从，[guanzhi_official.GetTitledFirstName]结交边将之罪，竟无一丝实据。这封封事，多半是仇家构陷。"
 guanzhi_court.1113.o0:0 "既已画供，依律问罪"
 guanzhi_court.1113.o1:0 "供状可疑，发回覆审"
 guanzhi_court.1113.t:0 "狱词已成"
 guanzhi_court.1113.desc:0 "狱吏日夜拷掠，[guanzhi_official.GetTitledFirstName]不胜其痛，已自诬服。狱词呈上，罪名俱全，只待御笔勾决。然朕细读供状，前后矛盾之处颇多。"
 guanzhi_court.1114.o0:0 "下诏禁匿名封事，杜构陷之门"
 guanzhi_court.1114.o1:0 "无风不起浪，外放出京避嫌"
 guanzhi_court.1114.t:0 "对质自明"
 guanzhi_court.1114.desc:0 "[guanzhi_official.GetTitledFirstName]入对之日，从容陈辩，将封事所列罪状逐条驳倒，言毕免冠顿首，涕泪横流。朕观其神色坦荡，不似作伪。"
 guanzhi_court.1115.o0:0 "心虚至此，先夺其职再查"
 guanzhi_court.1115.o1:0 "单凭神色不能定罪，且置之"
 guanzhi_court.1115.t:0 "神色可疑"
 guanzhi_court.1115.desc:0 "[guanzhi_official.GetTitledFirstName]奉召入对，答对之际言辞闪烁，屡称'臣愚，实不知陛下所指'。朕愈听愈疑，殿上气氛冷得像结了霜。"
 guanzhi_court.1116.o0:0 "I see."
 guanzhi_court.1116.t:0 "告讦成风"
 guanzhi_court.1116.desc:0 "朕既不究，投书者愈发胆大。旬月之间，弹劾大臣的匿名封事接二连三，今日攻某甲，明日讦某乙。群臣相见，先自提防三分。"
 guanzhi_court.1117.o0:0 "I see."
 guanzhi_court.1117.t:0 "反坐其罪"
 guanzhi_court.1117.desc:0 "朕命有司比对笔迹纸墨，终将投书构陷者揪出，依律反坐。诏告百官之日，朝野称快，此后匿名告讦之风，为之一息。"
 guanzhi_court.1118.o0:0 "I see."
 guanzhi_court.1118.t:0 "君臣释然"
 guanzhi_court.1118.desc:0 "[guanzhi_official.GetTitledFirstName]官复原职，朕当面抚慰，焚其狱词。他叩谢而出，逢人便道陛下圣明。一封构陷之书，反倒成就了一段君臣知遇。"
 guanzhi_court.1119.o0:0 "I see."
 guanzhi_court.1119.t:0 "冤狱铸成"
 guanzhi_court.1119.desc:0 "[guanzhi_official.GetTitledFirstName]弃市之日，观者塞途。未几，真正的投书者酒后失言，事情泄露。朕追悔无及，然死者已不可复生。"
 guanzhi_court.1120.o0:0 "I see."
 guanzhi_court.1120.t:0 "含冤出京"
 guanzhi_court.1120.desc:0 "[guanzhi_official.GetTitledFirstName]离京那日，无人敢送。构陷者躲在暗处窃笑，而朕心中那点疑影，始终没有散去。"
 guanzhi_court.1121.o0:0 "言之有理，下诏班师"
 guanzhi_court.1121.o1:0 "边事正紧，留中不发"
 guanzhi_court.1121.o2:0 "腐儒安知兵事！当廷斥之"
 guanzhi_court.1121.t:0 "请罢边功"
 guanzhi_court.1121.desc:0 "边塞用兵经年，捷报与告急文书交替而至。这日[guanzhi_official.GetTitledFirstName]上疏，极言师疲于外、财竭于内，壮者尽于行伍、老弱困于转输，请陛下罢边功、休养民力。"
 guanzhi_court.1122.o0:0 "I see."
 guanzhi_court.1122.t:0 "偃武息民"
 guanzhi_court.1122.desc:0 "班师诏下，戍卒解甲归田，转输之苦顿减。府库渐渐充实，流民复业者日以千计。[guanzhi_official.GetTitledFirstName]之疏，竟成了救时良策。"
 guanzhi_court.1123.o0:0 "再遣良将，复镇边塞"
 guanzhi_court.1123.o1:0 "固守坚壁，遣使谕之，不再轻动"
 guanzhi_court.1123.t:0 "边患复炽"
 guanzhi_court.1123.desc:0 "大军既撤，敌骑探知边防空虚，连犯三郡，烽燧又举。朝中议者蜂起，皆归咎于[guanzhi_official.GetTitledFirstName]那一纸罢兵之疏。"
 guanzhi_court.1124.o0:0 "I see."
 guanzhi_court.1124.t:0 "捷报雪片"
 guanzhi_court.1124.desc:0 "前疏留中未几，前线捷报飞驰而至：大军破敌于塞外，斩首数千，诸部遣使请和。[guanzhi_official.GetTitledFirstName]见疏不报，自此缄口。"
 guanzhi_court.1125.o0:0 "悔不听其言，急诏罢兵抚民"
 guanzhi_court.1125.o1:0 "骑虎难下，严令诸军死战"
 guanzhi_court.1125.t:0 "师老兵疲"
 guanzhi_court.1125.desc:0 "战事旷日持久，前线军报愈发难看：粮运不继，士卒逃亡，溃卒啸聚为盗，边郡骚然。当初[guanzhi_official.GetTitledFirstName]疏中所言，竟一一应验。"
 guanzhi_court.1126.o0:0 "拖下去廷杖，逐出朝廷"
 guanzhi_court.1126.o1:0 "……其言虽逆耳，其心可悯，容朕再思"
 guanzhi_court.1126.t:0 "廷争愈烈"
 guanzhi_court.1126.desc:0 "朕当廷申斥，[guanzhi_official.GetTitledFirstName]非但不惧，反而伏地固争：'边功一成，白骨蔽野，臣不忍见陛下以万民易一将之名。'满朝文武，噤不敢言。"
 guanzhi_court.1127.o0:0 "I see."
 guanzhi_court.1127.t:0 "再举之役"
 guanzhi_court.1127.desc:0 "朕复遣大军出塞，战事迁延一年，总算击退敌骑，然府库为之一空。凯旋之日，朕望着班师的疲卒，竟不知这一仗是胜是负。"
 guanzhi_court.1128.o0:0 "I see."
 guanzhi_court.1128.t:0 "与民休息"
 guanzhi_court.1128.desc:0 "边塞罢兵，烽燧渐稀。数年之间，仓廪复实，户口滋息。史臣援笔：知进退存亡而不失其正者，其惟圣人乎。"
 guanzhi_court.1129.o0:0 "I see."
 guanzhi_court.1129.t:0 "海内虚耗"
 guanzhi_court.1129.desc:0 "战事终了，边患未除，而国库已空、壮丁已竭。田间地头，多见白发老妇荷锄而耕。朕夜半翻阅军籍，见那一个个朱笔勾去的名字，久久不能成寐。"
 guanzhi_court.1130.o0:0 "I see."
 guanzhi_court.1130.t:0 "从谏班师"
 guanzhi_court.1130.desc:0 "朕思之再三，终下罪己之诏，罢兵班师，且擢[guanzhi_official.GetTitledFirstName]以示褒直。诏书颁布之日，天下传诵，谓陛下能改过者，社稷之福也。"
 guanzhi_court.1131.o0:0 "科场重地，朕要亲自鞫问"
 guanzhi_court.1131.o1:0 "委有司依律勘审"
 guanzhi_court.1131.o2:0 "群议汹汹，未必是实，且压一压"
 guanzhi_court.1131.t:0 "贡院案发"
 guanzhi_court.1131.desc:0 "放榜未久，落第士子群聚阙下，击鼓喊冤：今科考题考前已泄，关节暗通，富贵子弟榜上有名，寒士才高者反落孙山。有司勘问，主考[guanzhi_official.GetTitledFirstName]难脱干系。"
 guanzhi_court.1132.o0:0 "考官弃市，夤缘者永不许应试"
 guanzhi_court.1132.o1:0 "考官罢黜，考生黜落，重开此科"
 guanzhi_court.1132.t:0 "水落石出"
 guanzhi_court.1132.desc:0 "朕调阅卷宗、隔别研讯，关节暗号一一勘破：[guanzhi_official.GetTitledFirstName]受贿鬻题，涉事考生夤缘中式，证据凿凿。满朝文武，皆在观望朕如何发落。"
 guanzhi_court.1133.o0:0 "还考官清白，治首告者诬告之罪"
 guanzhi_court.1133.o1:0 "瓜田李下，此科姑且作废"
 guanzhi_court.1133.t:0 "事出蹊跷"
 guanzhi_court.1133.desc:0 "亲鞫旬日，所谓泄题关节，竟查无实据。倒是有落第士子的座师与[guanzhi_official.GetTitledFirstName]素不相能，这场喊冤，多半是有人在背后鼓噪。"
 guanzhi_court.1134.o0:0 "依律处置，考官罢黜，考生黜落"
 guanzhi_court.1134.o1:0 "念其多年辛劳，从宽发落"
 guanzhi_court.1134.t:0 "勘审得实"
 guanzhi_court.1134.desc:0 "有司勘审两月，案卷齐备：受贿之数、过付之人、改卷之迹，桩桩坐实，[guanzhi_official.GetTitledFirstName]无可抵赖，当堂画供。"
 guanzhi_court.1135.o0:0 "另委铁面之人重审"
 guanzhi_court.1135.o1:0 "水至清则无鱼，到此为止"
 guanzhi_court.1135.t:0 "审官回护"
 guanzhi_court.1135.desc:0 "承办官员与[guanzhi_official.GetTitledFirstName]有同年之谊，审了旬月，竟以'查无实据'结案。士子舆论哗然，皆言官官相护，科场已成私器。"
 guanzhi_court.1136.o0:0 "I see."
 guanzhi_court.1136.t:0 "科场蒙尘"
 guanzhi_court.1136.desc:0 "此案终究不了了之。自此科场关节公行，寒门士子赴试者渐少。坊间童谣传唱：'贡院门前无青草，朱衣堂上尽铜臭。'"
 guanzhi_court.1137.o0:0 "I see."
 guanzhi_court.1137.t:0 "弃市立威"
 guanzhi_court.1137.desc:0 "[guanzhi_official.GetTitledFirstName]弃市之日，观者如堵。十余名夤缘士子披枷示众，永不叙用。科场为之一肃，然亦有老臣私议：用法未免太峻。"
 guanzhi_court.1138.o0:0 "I see."
 guanzhi_court.1138.t:0 "科场一清"
 guanzhi_court.1138.desc:0 "考官罢黜，弊卷尽黜，朕复下诏重开此科，糊名誊录之制愈加严密。重试放榜之日，寒门俊彦列名者过半，天下士子额手称庆。"
 guanzhi_court.1139.o0:0 "I see."
 guanzhi_court.1139.t:0 "法外之恩"
 guanzhi_court.1139.desc:0 "朕终从宽典。[guanzhi_official.GetTitledFirstName]保全了性命与残名，感激涕零。只是朝中清议颇有微词，谓此法外之恩，恐开侥幸之门。"
 guanzhi_court.1140.o0:0 "I see."
 guanzhi_court.1140.t:0 "一科尽废"
 guanzhi_court.1140.desc:0 "此科举人尽数追夺，一科尽废。千余名士子寒窗十年，一朝成空。放榜墙下，有人焚书痛哭。朕虽非始作俑者，亦觉心中沉沉。"
 guanzhi_court.1141.o0:0 "谕其自敛，勿使人言可畏"
 guanzhi_court.1141.o1:0 "下诏禁座主门生谢恩私谒之礼"
 guanzhi_court.1141.o2:0 "尊师重道，古之常理，不必深究"
 guanzhi_court.1141.t:0 "座主门生"
 guanzhi_court.1141.desc:0 "[guanzhi_official.GetTitledFirstName]数典文衡，门生遍及内外。每逢座主寿辰，门生执礼甚恭，馈遗不绝；每逢除授，同榜之士援引如一。御史弹劾：师生之恩，渐成朋党之私。"
 guanzhi_court.1142.o0:0 "I see."
 guanzhi_court.1142.t:0 "奉命敛迹"
 guanzhi_court.1142.desc:0 "得朕谕旨，[guanzhi_official.GetTitledFirstName]杜门谢客，门生馈遗一概不受，私谒尽绝。朝中议论渐平，一场风波消弭于无形。"
 guanzhi_court.1143.o0:0 "尽逐其党，勿使滋蔓"
 guanzhi_court.1143.o1:0 "但黜座主一人，门生不问"
 guanzhi_court.1143.t:0 "阴结一党"
 guanzhi_court.1143.desc:0 "表面敛迹之后，[guanzhi_official.GetTitledFirstName]的门生故吏却以文会、同年宴为名，联络愈密。六部要津，渐多其门下之人，除授消息，私第先闻。"
 guanzhi_court.1144.o0:0 "视诏令为儿戏，从严究治"
 guanzhi_court.1144.o1:0 "堵不如疏，弛禁而以礼制之"
 guanzhi_court.1144.t:0 "禁而不绝"
 guanzhi_court.1144.desc:0 "禁令既下，谢恩私谒之礼明面上绝了，暗地里师生却改称'知遇''旧谊'，书信往还以隐语相通。禁令徒具空文，反逼他们抱得更紧。"
 guanzhi_court.1145.o0:0 "I see."
 guanzhi_court.1145.t:0 "风俗一清"
 guanzhi_court.1145.desc:0 "禁令颁行之后，新科进士不再奔走私门，廷试谢恩止于朝堂。座主之名虽存，朋党之实渐去。士大夫相见，但论公事，不及私恩。"
 guanzhi_court.1146.o0:0 "养痈成患，断然裁抑"
 guanzhi_court.1146.o1:0 "树大根深，且作壁上观"
 guanzhi_court.1146.t:0 "桃李满朝"
 guanzhi_court.1146.desc:0 "朕既不问，[guanzhi_official.GetTitledFirstName]门生故吏布满朝廷。今岁考课，其门下迁转者竟逾二十人。吏部除目，须先经其首肯。朕的朝廷，渐渐成了他的门墙。"
 guanzhi_court.1147.o0:0 "I see."
 guanzhi_court.1147.t:0 "门墙尽撤"
 guanzhi_court.1147.desc:0 "诏下之日，[guanzhi_official.GetTitledFirstName]解印，门生要津者尽数外调。经营十年的门墙，一朝撤去。朝中干净了许多，也空落了许多。"
 guanzhi_court.1148.o0:0 "I see."
 guanzhi_court.1148.t:0 "罪止一人"
 guanzhi_court.1148.desc:0 "朕只黜[guanzhi_official.GetTitledFirstName]一人，门生概不株连。离京之日，数十门生相送于郊，执礼痛哭。朕闻之，倒觉此人并非全无德行。"
 guanzhi_court.1149.o0:0 "I see."
 guanzhi_court.1149.t:0 "恩义两全"
 guanzhi_court.1149.desc:0 "朕改定谢恩之制：放榜之日，天子亲临，新进士先谢君恩，后谒座主，礼有等差。君臣之义明，师生之情亦不废。朝野称善。"
 guanzhi_court.1150.o0:0 "I see."
 guanzhi_court.1150.t:0 "门生之朝"
 guanzhi_court.1150.desc:0 "数年之后，[guanzhi_official.GetTitledFirstName]一党盘根错节，弹劾之者反先遭贬黜。朕每有除授，廷议未起，其党已先扬言可否。朝廷之上，隐隐有两个声音。"
 guanzhi_court.1151.o0:0 "朕观其疏甚公，准其所举"
 guanzhi_court.1151.o1:0 "先送有司考课，凭本事说话"
 guanzhi_court.1151.o2:0 "朝廷官缺，岂是你家私物？切责之"
 guanzhi_court.1151.t:0 "举贤不避亲"
 guanzhi_court.1151.desc:0 "[guanzhi_official.GetTitledFirstName]上疏，举己子堪任一职，疏中自言'举贤不避亲，臣不敢以私嫌而废公义'。疏一传出，举朝哗然：是坦荡无私，还是明目张胆地营私？"
 guanzhi_court.1152.o0:0 "I see."
 guanzhi_court.1152.t:0 "内举得贤"
 guanzhi_court.1152.desc:0 "其子到任以来，处理政务精当老练，连最挑剔的御史也寻不出错处。当初哗然者渐渐噤声，反有人翻检古书，称此乃祁奚内举之遗风。"
 guanzhi_court.1153.o0:0 "父子并黜，以谢天下"
 guanzhi_court.1153.o1:0 "罪在其子，其父留任戴罪"
 guanzhi_court.1153.t:0 "纨绔败官"
 guanzhi_court.1153.desc:0 "谁料其子到任未久，便闹出贪墨渎职之事，苦主告到京师。举朝目光齐聚[guanzhi_official.GetTitledFirstName]身上：好一个'举贤不避亲'！"
 guanzhi_court.1154.o0:0 "I see."
 guanzhi_court.1154.t:0 "名副其实"
 guanzhi_court.1154.desc:0 "有司公开考课，其子对策称旨、理剧称能，成绩赫然列于上等。朕依考课之果授官，满朝无可指摘。这一场风波，倒成全了一段公心佳话。"
 guanzhi_court.1155.o0:0 "I see."
 guanzhi_court.1155.t:0 "才不堪任"
 guanzhi_court.1155.desc:0 "考课结果呈上：其子文理平庸，遇事无断，才具只堪末僚。朕将考卷掷还，未予授官。[guanzhi_official.GetTitledFirstName]面有惭色，数日称病不朝。"
 guanzhi_court.1156.o0:0 "I see."
 guanzhi_court.1156.t:0 "避嫌成风"
 guanzhi_court.1156.desc:0 "切责之诏既下，[guanzhi_official.GetTitledFirstName]灰头土脸。自此大臣举荐，唯恐避嫌不及，明知亲故有才也不敢开口。荐贤之路，倒是清静了，也冷清了。"
 guanzhi_court.1157.o0:0 "I see."
 guanzhi_court.1157.t:0 "并黜谢众"
 guanzhi_court.1157.desc:0 "父子并黜之诏颁布，举朝称快。[guanzhi_official.GetTitledFirstName]父子同日出京，当初那篇'举贤不避亲'的奏疏，成了坊间笑谈。"
 guanzhi_court.1158.o0:0 "I see."
 guanzhi_court.1158.t:0 "留父责子"
 guanzhi_court.1158.desc:0 "其子削职问罪，[guanzhi_official.GetTitledFirstName]留任戴罪。他从此办事愈发小心，再不敢提半个'举'字。朕保全了一位老臣，也悬起了一面镜子。"
 guanzhi_court.1161.o0:0 "兼收并蓄，各用其长"
 guanzhi_court.1161.o1:0 "旧族乃国之柱石，稍抑寒门"
 guanzhi_court.1161.o2:0 "门第何足恃？朕正要破格用人"
 guanzhi_court.1161.t:0 "寒门之争"
 guanzhi_court.1161.desc:0 "近年寒门新进渐多，与世族旧臣分庭抗礼。这日老臣[guanzhi_official.GetTitledFirstName]上疏，痛陈新进之士侥幸骤贵、轻视旧章，请朝廷抑寒门、重门第，以正仕进之序。寒门一派闻之，群情激愤。"
 guanzhi_court.1162.o0:0 "I see."
 guanzhi_court.1162.t:0 "新旧并立"
 guanzhi_court.1162.desc:0 "朕两边皆用：世族掌礼法典故，寒士理繁剧实务。日久两造各得其所，旧臣寒士竟渐渐相互敬重。朝堂之上，难得的一团和气。"
 guanzhi_court.1163.o0:0 "各打五十大板，都给我回去闭门思过"
 guanzhi_court.1163.o1:0 "逐其为首者，杀鸡儆猴"
 guanzhi_court.1163.t:0 "水火难容"
 guanzhi_court.1163.desc:0 "朕虽两用之，两党却攻讦不休：世族讥寒士'骤贵无行'，寒士讥世族'尸位素餐'。[guanzhi_official.GetTitledFirstName]与寒门领袖数次廷争，几乎当庭失仪。"
 guanzhi_court.1164.o0:0 "I see."
 guanzhi_court.1164.t:0 "旧族弹冠"
 guanzhi_court.1164.desc:0 "诏令既下，世族旧臣弹冠相庆，要职重归甲第之门。[guanzhi_official.GetTitledFirstName]一党声势复振。只是寒门士子赴京应试者，一年少似一年。"
 guanzhi_court.1165.o0:0 "稍开仕路，以安其心"
 guanzhi_court.1165.o1:0 "狂生谤讪，拿下弹压"
 guanzhi_court.1165.t:0 "道路谤言"
 guanzhi_court.1165.desc:0 "仕途壅塞，寒门之士聚于酒肆书坊，怨声载道。坊间渐有谤言流传，谓朝廷'上品无寒门'。有几个狂生竟在宫墙题诗，讥讽当轴诸公。"
 guanzhi_court.1166.o0:0 "遣使抚慰挽留，不可寒了老臣之心"
 guanzhi_court.1166.o1:0 "想走就走，朕的朝廷不缺老朽"
 guanzhi_court.1166.t:0 "旧臣乞退"
 guanzhi_court.1166.desc:0 "朕连擢寒士，旧臣自感失势，旬月之间，告老乞退的表章堆满案头。[guanzhi_official.GetTitledFirstName]亦称病不朝，府中连日闭门谢客。"
 guanzhi_court.1167.o0:0 "I see."
 guanzhi_court.1167.t:0 "各安其分"
 guanzhi_court.1167.desc:0 "两党首脑各受申饬，闭门思过旬月。复出之日，皆敛了锋芒。世族掌故、寒士任事，虽有龃龉，总算各安其分。"
 guanzhi_court.1168.o0:0 "I see."
 guanzhi_court.1168.t:0 "失其领袖"
 guanzhi_court.1168.desc:0 "[guanzhi_official.GetTitledFirstName]被逐出京，世族一党失其领袖，气焰顿消。寒门新进额手相庆，只是望向朕的目光里，也添了几分惧意。"
 guanzhi_court.1169.o0:0 "I see."
 guanzhi_court.1169.t:0 "调停得中"
 guanzhi_court.1169.desc:0 "朕几番折冲：开制科以待寒士，存旧族之体面以安其心。一年之后，新旧两途皆有进身之阶，朝堂风波渐息。史臣谓之'刚柔相济'。"
 guanzhi_court.1170.o0:0 "I see."
 guanzhi_court.1170.t:0 "朝堂失色"
 guanzhi_court.1170.desc:0 "一番裁抑，败者敛手，胜者亦未必得意。离朝者背影萧索，留任者噤若寒蝉。朕赢了这一局，朝堂却空出了好几张椅子。"
 guanzhi_court.1171.o0:0 "下诏申饬，戒其私援"
 guanzhi_court.1171.o1:0 "召他入宫，当面问个明白"
 guanzhi_court.1171.o2:0 "用人不疑，姑且置之"
 guanzhi_court.1171.t:0 "同年之谊"
 guanzhi_court.1171.desc:0 "吏部考功司密奏：今科除授，同年进士互相援引，援引者皆以[guanzhi_official.GetTitledFirstName]为魁首。凡其同年，不问贤否，皆得美缺。朝野已有'同年即同党'之讥。"
 guanzhi_court.1172.o0:0 "I see."
 guanzhi_court.1172.t:0 "闻风敛迹"
 guanzhi_court.1172.desc:0 "申饬之旨既下，[guanzhi_official.GetTitledFirstName]上表谢罪，诸同年亦各安其职，不敢复相往来。铨选之途，一时为之一清。"
 guanzhi_court.1173.o0:0 "革其官职，同年尽数外调"
 guanzhi_court.1173.o1:0 "不必逼人太甚，徐徐分化"
 guanzhi_court.1173.t:0 "同年之会"
 guanzhi_court.1173.desc:0 "申饬之后，诸同年表面疏远，暗里却以'同年之会'为名，岁岁相聚于城南别业，杯酒之间，升降之谋已定。[guanzhi_official.GetTitledFirstName]俨然党魁。"
 guanzhi_court.1174.o0:0 "举贤不避亲，朕信你"
 guanzhi_court.1174.o1:0 "纵然无私，也当避嫌"
 guanzhi_court.1174.t:0 "廷前坦对"
 guanzhi_court.1174.desc:0 "[guanzhi_official.GetTitledFirstName]奉召入对，不隐不饰：'臣与诸君同榜登科，知其才否最详，所举皆当。若陛下以私嫌责臣，臣请避位。'言毕伏地，神态坦荡。"
 guanzhi_court.1175.o0:0 "交御史台勘问其私"
 guanzhi_court.1175.o1:0 "无凭无据，再观后效"
 guanzhi_court.1175.t:0 "言辞闪烁"
 guanzhi_court.1175.desc:0 "御前召对，[guanzhi_official.GetTitledFirstName]额上见汗，答非所问，只反复称'同年之情，人皆有之'。退朝时步履踉跄，显是心中有鬼。"
 guanzhi_court.1176.o0:0 "是可忍孰不可忍，断然裁抑"
 guanzhi_court.1176.o1:0 "木已成舟，只好多加笼络"
 guanzhi_court.1176.t:0 "要津尽据"
 guanzhi_court.1176.desc:0 "朕未加过问，数年之后，六部郎署、四方藩臬，半出其同年之门。近日京中童谣有云：'不识尚书面，但拜同年帖。'"
 guanzhi_court.1177.o0:0 "既见其效，下诏褒之"
 guanzhi_court.1177.o1:0 "功归朝廷，不可使臣下专美"
 guanzhi_court.1177.t:0 "同年多贤"
 guanzhi_court.1177.desc:0 "出乎意料，诸同年居官多能称职，河堤、漕运、边储诸事皆有起色。原来[guanzhi_official.GetTitledFirstName]所援引者，确是一时之选。"
 guanzhi_court.1178.o0:0 "I see."
 guanzhi_court.1178.t:0 "同年星散"
 guanzhi_court.1178.desc:0 "[guanzhi_official.GetTitledFirstName]解职出京之日，诸同年或贬或调，星散四方。榜上有名的读书人，从此言谈之间，再不敢提'同年'二字。"
 guanzhi_court.1179.o0:0 "I see."
 guanzhi_court.1179.t:0 "化党为用"
 guanzhi_court.1179.desc:0 "几番裁处，同年之谊终归为朝廷所用。[guanzhi_official.GetTitledFirstName]感念圣恩，愈发尽心国事。朝中议论渐息，皆谓朕驭下有方。"
 guanzhi_court.1181.o0:0 "命其开列门生名册，报朕备案"
 guanzhi_court.1181.o1:0 "老臣勋旧，优容不问"
 guanzhi_court.1181.o2:0 "夺其差遣，收归京城闲住"
 guanzhi_court.1181.t:0 "门生故吏"
 guanzhi_court.1181.desc:0 "密探奏报：[guanzhi_official.GetTitledFirstName]三掌文衡、两镇方面，门生故吏遍布天下。其寿辰之日，四方馈遗络绎不绝，州县长吏争相依附，隐隐有山头之势。"
 guanzhi_court.1182.o0:0 "嘉其坦荡，册留朕处"
 guanzhi_court.1182.o1:0 "册中之人，分调远省，以散其势"
 guanzhi_court.1182.t:0 "名册具呈"
 guanzhi_court.1182.desc:0 "[guanzhi_official.GetTitledFirstName]不日呈上门生故吏名册，洋洋数百人，仕隐存亡，一一注明，并附表自陈：'臣之知交，皆陛下之臣子，不敢有所隐。'"
 guanzhi_court.1183.o0:0 "罢其官爵，勒令致仕"
 guanzhi_court.1183.o1:0 "念其老迈，不再追究"
 guanzhi_court.1183.t:0 "匿册不报"
 guanzhi_court.1183.desc:0 "催了三次，名册始终未上。[guanzhi_official.GetTitledFirstName]只回奏'门墙桃李，久而难稽'。御史弹劾其'意存私匿，目中无君'。"
 guanzhi_court.1184.o0:0 "既然如此，用人不疑"
 guanzhi_court.1184.o1:0 "今日无二心，他日难保，趁早削之"
 guanzhi_court.1184.t:0 "桃李报春"
 guanzhi_court.1184.desc:0 "朕未加裁抑，其门生故吏感念师恩与皇恩，散在四方者各尽职守，劝农、治狱、备边皆有实绩。其势虽大，竟无异志。"
 guanzhi_court.1185.o0:0 "治家不严，罪及其师"
 guanzhi_court.1185.o1:0 "只办犯法之门生，不累其师"
 guanzhi_court.1185.t:0 "借势横行"
 guanzhi_court.1185.desc:0 "诉状如雪片飞来：其门生在外倚仗师门，夺民田、纵奴仆、凌郡县，地方官莫敢问。民间谚云：'宁触雷霆怒，莫犯某家门。'"
 guanzhi_court.1186.o0:0 "众怒难犯，从轻发落"
 guanzhi_court.1186.o1:0 "愈多愈要办！一体斥逐"
 guanzhi_court.1186.t:0 "群起营救"
 guanzhi_court.1186.desc:0 "问责之旨才下，营救的奏章便堆满御案——三省台谏、四方牧守，为其说话者竟有数十人之多。门生故吏之众，朕今日才算看清。"
 guanzhi_court.1187.o0:0 "下狱勘问，以绝后患"
 guanzhi_court.1187.o1:0 "释其官复原职，收揽其心"
 guanzhi_court.1187.t:0 "闲居蓄怨"
 guanzhi_court.1187.desc:0 "[guanzhi_official.GetTitledFirstName]收归京城闲住后，门下宾客依旧盈门，门上常夜间车马往来。密探报：其门生故吏正暗中串联，欲为其师翻案。"
 guanzhi_court.1188.o0:0 "I see."
 guanzhi_court.1188.t:0 "主臣两全"
 guanzhi_court.1188.desc:0 "几番裁处，恩威并施，[guanzhi_official.GetTitledFirstName]的门生故吏各归本份，其本人也愈加恭谨。一场风波，消弭于无形。"
 guanzhi_court.1189.o0:0 "I see."
 guanzhi_court.1189.t:0 "门庭冷落"
 guanzhi_court.1189.desc:0 "诏下之后，[guanzhi_official.GetTitledFirstName]府前车马顿稀。昔日争相依附者，如今过其门而不入。世态炎凉，一至如此。"
 guanzhi_court.1190.o0:0 "I see."
 guanzhi_court.1190.t:0 "桃李之狱"
 guanzhi_court.1190.desc:0 "狱事既兴，株连蔓引，门生故吏罢黜者以百计。朝中元气大伤，士大夫谈起此案，无不掩口而叹。"
 guanzhi_court.1191.o0:0 "告诫国舅，不得交通朝臣"
 guanzhi_court.1191.o1:0 "召[guanzhi_official.GetTitledFirstName]试探之"
 guanzhi_court.1191.o2:0 "不动声色，密察其往来"
 guanzhi_court.1191.t:0 "椒房之客"
 guanzhi_court.1191.desc:0 "宫中密报：近来国舅府上夜宴频开，[guanzhi_official.GetTitledFirstName]屡屡在座，往来馈赠，珍玩不绝。外戚与朝臣相结，历朝皆为大忌，不可不防。"
 guanzhi_court.1192.o0:0 "I see."
 guanzhi_court.1192.t:0 "戚里敛手"
 guanzhi_court.1192.desc:0 "朕借赏花为名召国舅入宫，轻描淡写点了几句。国舅汗透重衣，回去便闭门谢客，连府上的戏班子都遣散了。"
 guanzhi_court.1193.o0:0 "谋及兵权，事不寻常，收监勘问"
 guanzhi_court.1193.o1:0 "再探虚实，勿使打草惊蛇"
 guanzhi_court.1193.t:0 "暗结愈深"
 guanzhi_court.1193.desc:0 "告诫之后，国舅府上明面清净了，暗里却以佛堂香火为掩护，往来更密。听闻[guanzhi_official.GetTitledFirstName]已替国舅谋了京营兵权的差遣。"
 guanzhi_court.1194.o0:0 "好一个清慎之臣，朕记下了"
 guanzhi_court.1194.o1:0 "礼单可以是假，仍须防他"
 guanzhi_court.1194.t:0 "拒贿自明"
 guanzhi_court.1194.desc:0 "御前试探，[guanzhi_official.GetTitledFirstName]闻言变色，即刻取出怀中礼单一册呈上：'国舅所赠，臣一物未启，礼单在此，原拟今日奏闻。'"
 guanzhi_court.1195.o0:0 "拿下勘问，务必穷其本末"
 guanzhi_court.1195.o1:0 "吓他一吓便罢，留中不发"
 guanzhi_court.1195.t:0 "心堕气体"
 guanzhi_court.1195.desc:0 "朕不过闲闲问起国舅府上的牡丹开得如何，[guanzhi_official.GetTitledFirstName]竟面如土色，伏地请罪，语无伦次。其中隐情，不问可知。"
 guanzhi_court.1196.o0:0 "悖逆至此，即刻收捕，明正典刑"
 guanzhi_court.1196.o1:0 "外戚干碍宫闱，只办朝臣，斥退国舅"
 guanzhi_court.1196.t:0 "逆迹昭然"
 guanzhi_court.1196.desc:0 "密察两月，往来书札尽入朕手：国舅许诺[guanzhi_official.GetTitledFirstName]'大事成日，当以太师相酬'，书中竟有'宫车晏驾'之语。"
 guanzhi_court.1197.o0:0 "家宅和睦要紧，收手不查了"
 guanzhi_court.1197.o1:0 "后宫不得干政！查照旧查"
 guanzhi_court.1197.t:0 "事机走漏"
 guanzhi_court.1197.desc:0 "密察之事竟传入国舅耳中。次日国舅入宫，在皇后面前伏地哭诉，称朝中有人离间天家骨肉。皇后面色不豫，已有数日未与朕言语。"
 guanzhi_court.1198.o0:0 "I see."
 guanzhi_court.1198.t:0 "戚臣俱黜"
 guanzhi_court.1198.desc:0 "诏下，[guanzhi_official.GetTitledFirstName]褫职下狱，国舅闭门思过，府中宾客鸟兽散。宫中为此冷清了许久，皇后到底没再说什么。"
 guanzhi_court.1199.o0:0 "I see."
 guanzhi_court.1199.t:0 "内外相安"
 guanzhi_court.1199.desc:0 "此事处置得体，外戚知所警戒，朝臣知所避嫌。后宫与前朝各安其位，一场祸端消于未萌。"
 guanzhi_court.1200.o0:0 "I see."
 guanzhi_court.1200.t:0 "逆书之狱"
 guanzhi_court.1200.desc:0 "[guanzhi_official.GetTitledFirstName]弃市之日，观者塞途。国舅虽念在骨肉免于显戮，亦被夺爵幽禁。宫闱内外，自此无人敢提此事。"
 guanzhi_court.1201.o0:0 "设个局，截一封书信看看"
 guanzhi_court.1201.o1:0 "直接拿问那名宦官"
 guanzhi_court.1201.o2:0 "宫闱之事，恐伤大体，再等等"
 guanzhi_court.1201.t:0 "夜传尺素"
 guanzhi_court.1201.desc:0 "宫中小黄门密告：内侍省一名得宠宦官，常于夜深以细绢小字传出宫门，送入[guanzhi_official.GetTitledFirstName]府中。宫禁与外朝暗通款曲，所传何事，不得而知。"
 guanzhi_court.1202.o0:0 "人赃并获，宦者与外臣一体拿下"
 guanzhi_court.1202.o1:0 "留下此书，反向喂些假消息"
 guanzhi_court.1202.t:0 "帛书入彀"
 guanzhi_court.1202.desc:0 "局中截得帛书一封，字迹细密：朝中人事进退、朕的起居喜怒，皆一一在列，末尾嘱[guanzhi_official.GetTitledFirstName]'相机行事，勿负所托'。"
 guanzhi_court.1203.o0:0 "索性明旨查问，看他们还怎么藏"
 guanzhi_court.1203.o1:0 "既然惊了，暂且按兵不动"
 guanzhi_court.1203.t:0 "机事不密"
 guanzhi_court.1203.desc:0 "设局之事竟被察觉。此后宫门出入盘查森严，那宦官称病不出，[guanzhi_official.GetTitledFirstName]府上也闭门谢客。线，就这么断了。"
 guanzhi_court.1204.o0:0 "搜府取证，铁案如山再定罪"
 guanzhi_court.1204.o1:0 "阉人之口不足凭，吓退了事"
 guanzhi_court.1204.t:0 "供出同谋"
 guanzhi_court.1204.desc:0 "那宦官受不得拷问，当夜便招：与[guanzhi_official.GetTitledFirstName]往来已逾一年，传递消息，收受谢仪，皆有底账藏于佛龛之中。"
 guanzhi_court.1205.o0:0 "舆论汹汹，必是有鬼，彻查其府"
 guanzhi_court.1205.o1:0 "无据而治罪，何以服众？放人"
 guanzhi_court.1205.t:0 "死不认账"
 guanzhi_court.1205.desc:0 "那宦官咬紧牙关，宁可杖死也不吐一字。反倒是外头风言风语起来，说朕'轻信谗言，拷打宫奴'，话里话外，竟是指向[guanzhi_official.GetTitledFirstName]一党在造舆论。"
 guanzhi_court.1206.o0:0 "事到如今，不能再容，动手"
 guanzhi_court.1206.o1:0 "且捏着这条线，看他们还要做什么"
 guanzhi_court.1206.t:0 "表里为奸"
 guanzhi_court.1206.desc:0 "朕按兵不动，那一内一外胆子愈大。近来朕的旨意未出宫门，[guanzhi_official.GetTitledFirstName]已在朝房抢先议论得失，满朝文武，皆以为异。"
 guanzhi_court.1207.o0:0 "虽非奸谋，私相传递亦不可恕，申饬二人"
 guanzhi_court.1207.o1:0 "虚惊一场，就此揭过"
 guanzhi_court.1207.t:0 "事出有因"
 guanzhi_court.1207.desc:0 "再行密查，真相竟出人意料：那帛书所传，多为宫中采买、匠作物料之数，是[guanzhi_official.GetTitledFirstName]分内当核对之事。只是不经正途，瓜田李下，迹近暧昧。"
 guanzhi_court.1208.o0:0 "I see."
 guanzhi_court.1208.t:0 "宫府同清"
 guanzhi_court.1208.desc:0 "缇骑四出之日，[guanzhi_official.GetTitledFirstName]下狱，涉事宦官杖毙于内廷。宫禁与外朝之间那道暗渠，总算被朕亲手填平。"
 guanzhi_court.1209.o0:0 "I see."
 guanzhi_court.1209.t:0 "引而不发"
 guanzhi_court.1209.desc:0 "朕终究没有掀开幕布。那两人还不知道，他们传递的每一个字，如今都要先过朕的眼睛。棋子在枰，何时落子，只在朕心。"
 guanzhi_court.1211.o0:0 "查！度支旧账全部调来"
 guanzhi_court.1211.o1:0 "召[guanzhi_official.GetTitledFirstName]当面质对"
 guanzhi_court.1211.o2:0 "边镇势大，投鼠忌器，先忍一手"
 guanzhi_court.1211.t:0 "方镇之馈"
 guanzhi_court.1211.desc:0 "度支司密奏：某道节度使岁贡之外，另以'土仪'为名，连年向京中输送重金珍宝，其中泰半落入[guanzhi_official.GetTitledFirstName]府第。方镇结交朝臣，所图必非小事。"
 guanzhi_court.1212.o0:0 "受贿卖言，罪在不贷，下狱追赃"
 guanzhi_court.1212.o1:0 "赃可追，人暂留，叫他戴罪立功"
 guanzhi_court.1212.t:0 "赃证俱在"
 guanzhi_court.1212.desc:0 "旧账调齐，逐年勾稽，入京的金银与[guanzhi_official.GetTitledFirstName]府上的进项严丝合缝。更有账房书手出首：每次收礼之后，朝中便有替那节帅说话的章奏。"
 guanzhi_court.1213.o0:0 "毁账灭迹，与反何异？连节帅一并勘问"
 guanzhi_court.1213.o1:0 "无证无据，奈何不得，暂且记下"
 guanzhi_court.1213.t:0 "账册成灰"
 guanzhi_court.1213.desc:0 "查账的旨意才下，节度府连夜'走水'，往来账册烧了个干净。灰烬未冷，那节帅的谢罪表已到京师，言辞恭顺得滴水不漏。"
 guanzhi_court.1214.o0:0 "念其坦白，贬官赎罪，所请一概驳回"
 guanzhi_court.1214.o1:0 "坦白也救不了你，下狱论罪"
 guanzhi_court.1214.t:0 "当庭吐实"
 guanzhi_court.1214.desc:0 "御前质对，[guanzhi_official.GetTitledFirstName]叩头出血，尽数招认：节帅所求，乃是旌节世袭、兼领数州。'臣一时利令智昏，为其游扬，罪该万死。'"
 guanzhi_court.1215.o0:0 "挟边自重，罪加一等，拿下"
 guanzhi_court.1215.o1:0 "他说的也有三分道理……先退朝"
 guanzhi_court.1215.t:0 "强词夺理"
 guanzhi_court.1215.desc:0 "质对之下，[guanzhi_official.GetTitledFirstName]竟振振有词：'方镇输诚，朝廷示恩，古之常道。陛下若以馈赠为罪，恐寒了边将之心。'言下之意，竟是以藩镇自重。"
 guanzhi_court.1216.o0:0 "当断不断，反受其乱，动手削之"
 guanzhi_court.1216.o1:0 "边患要紧，所请酌准一半，羁縻为先"
 guanzhi_court.1216.t:0 "得寸进尺"
 guanzhi_court.1216.desc:0 "朕隐忍不发，那节帅请托愈频：今日求增兵额，明日求盐铁之利，[guanzhi_official.GetTitledFirstName]在朝中一一为之关说。边镇之势，隐然已成。"
 guanzhi_court.1217.o0:0 "顺水推舟，收其节钺，另择良将"
 guanzhi_court.1217.o1:0 "温言慰留，示以不疑"
 guanzhi_court.1217.t:0 "闻风自危"
 guanzhi_court.1217.desc:0 "查账之事虽不了了之，风声却传到了藩镇。那节帅惊疑不定，主动入朝请罪，献上缴还节钺的表章以探朕意——是留是放，反倒成了朕的难题。"
 guanzhi_court.1218.o0:0 "I see."
 guanzhi_court.1218.t:0 "贿通之狱"
 guanzhi_court.1218.desc:0 "[guanzhi_official.GetTitledFirstName]锒铛入狱，追赃之使络绎不绝于道。朝中受此震慑，再无人敢替方镇关说半句。"
 guanzhi_court.1219.o0:0 "I see."
 guanzhi_court.1219.t:0 "恩威并济"
 guanzhi_court.1219.desc:0 "一场风波，朝廷既得了实惠，又收回了权柄。方镇知朝廷耳目之灵，朝臣知贿赂之不可通。朕这一局，走得不算坏。"
 guanzhi_court.1220.o0:0 "I see."
 guanzhi_court.1220.t:0 "姑息养患"
 guanzhi_court.1220.desc:0 "所请既准，藩镇愈骄，岁币愈薄。史臣秉笔，欲书又止——后世若问起今日之事，朕又该如何作答？"
 guanzhi_court.1221.o0:0 "召太子来，朕亲自问他"
 guanzhi_court.1221.o1:0 "召[guanzhi_official.GetTitledFirstName]，敲山震虎"
 guanzhi_court.1221.o2:0 "太子读书有人辅佐，也是好事，再看看"
 guanzhi_court.1221.t:0 "东宫之客"
 guanzhi_court.1221.desc:0 "密探奏报：[guanzhi_official.GetTitledFirstName]近来屡入东宫，与太子讲经论史，馈赠书籍珍玩，东宫僚属皆呼之为'座上宾'。臣子结纳储君，自古以来，便是帝王心头的一根刺。"
 guanzhi_court.1222.o0:0 "起来吧，朕信你，是那臣子逾矩"
 guanzhi_court.1222.o1:0 "父子之间，何须如此？倒叫朕更疑了"
 guanzhi_court.1222.t:0 "储君惶惧"
 guanzhi_court.1222.desc:0 "太子奉召而来，未语先跪，战栗不能成言。半晌才道：'儿臣但闻其学识，不知其他。父皇若疑，儿臣从此不见外臣。'看着儿子煞白的脸，朕心中五味杂陈。"
 guanzhi_court.1223.o0:0 "好孩子，是朕多心了"
 guanzhi_court.1223.o1:0 "越是滴水不漏，越要防"
 guanzhi_court.1223.t:0 "坦坦储贰"
 guanzhi_court.1223.desc:0 "太子入对，神色坦荡，将东宫往来人等、所讲书目一一列明，末了又道：'儿臣所学，皆父皇所赐之师；所交，皆朝廷命官。儿臣心中，只有君父。'"
 guanzhi_court.1224.o0:0 "准奏，让他走"
 guanzhi_court.1224.o1:0 "留他原地，朕还看他做事"
 guanzhi_court.1224.t:0 "引嫌求去"
 guanzhi_court.1224.desc:0 "朕不过淡淡提了句'东宫近来热闹'，次日[guanzhi_official.GetTitledFirstName]便上表自陈'才不称位，迹涉嫌疑'，请调外任，避居江湖。倒是识趣得很。"
 guanzhi_court.1225.o0:0 "眼里还有没有朕？！下狱勘问"
 guanzhi_court.1225.o1:0 "撕破脸于储位不利，调任闲职冷处理"
 guanzhi_court.1225.t:0 "故我依然"
 guanzhi_court.1225.desc:0 "敲打之后，[guanzhi_official.GetTitledFirstName]出入东宫如故，甚至更勤。听闻他已开始替太子物色东宫官属，俨然以'储君元辅'自居了。"
 guanzhi_court.1226.o0:0 "监国？！查！看这背后是谁在主使"
 guanzhi_court.1226.o1:0 "压下此奏，从此隔断东宫与外朝"
 guanzhi_court.1226.t:0 "羽翼渐丰"
 guanzhi_court.1226.desc:0 "朕未加干预，半年之间，东宫宾客盈门，朝中后进之士竞相奔走。近日竟有御史奏请'太子监国，以分圣劳'——这话是谁教的，朕用脚指头都想得到。"
 guanzhi_court.1227.o0:0 "储君贤明，朕复何忧？就此放心"
 guanzhi_court.1227.o1:0 "即便如此，臣结东宫之例不可开"
 guanzhi_court.1227.t:0 "储君知礼"
 guanzhi_court.1227.desc:0 "静观数月，太子虽与[guanzhi_official.GetTitledFirstName]往来，但凡事必先奏朕而后行，东宫属官的选任，太子一概推给吏部。这孩子，心里有数。"
 guanzhi_court.1228.o0:0 "I see."
 guanzhi_court.1228.t:0 "剪其旁枝"
 guanzhi_court.1228.desc:0 "[guanzhi_official.GetTitledFirstName]离京赴任那日，东宫门前清净了许多。太子站在城楼上看了很久，终究什么也没说。"
 guanzhi_court.1229.o0:0 "I see."
 guanzhi_court.1229.t:0 "父子无猜"
 guanzhi_court.1229.desc:0 "风波过去，东宫依旧书声琅琅。朕偶尔踱去听太子讲学，君臣父子，各安其位。朝中那些嚼舌根的人，也渐渐闭了嘴。"
 guanzhi_court.1230.o0:0 "I see."
 guanzhi_court.1230.t:0 "东宫之狱"
 guanzhi_court.1230.desc:0 "狱辞连成之日，[guanzhi_official.GetTitledFirstName]以'交结储贰、窥伺神器'论罪。太子幽居东宫，数月不出。朝野噤声，人人皆知那道看不见的裂痕，再无法弥合了。"
 guanzhi_court.1231.o0:0 "清议干政，渐不可长，下诏禁社"
 guanzhi_court.1231.o1:0 "先派人看看他们都议些什么"
 guanzhi_court.1231.o2:0 "文人雅集而已，何至于此？由他们去"
 guanzhi_court.1231.t:0 "文社风起"
 guanzhi_court.1231.desc:0 "都中名士结为文社，每月雅集，评骘人物，月旦朝政，[guanzhi_official.GetTitledFirstName]被推为社首。台谏上章弹劾，称其'标榜声气，处士横议，此朋党之萌也'。"
 guanzhi_court.1232.o0:0 "诽谤朝政至此，收捕社首，余者不问"
 guanzhi_court.1232.o1:0 "防民之口甚于防川，收回禁诏"
 guanzhi_court.1232.t:0 "檄文四起"
 guanzhi_court.1232.desc:0 "禁社之诏一下，社员非但不散，反而激愤作文，讥刺朝政，篇篇传诵于太学与市井之间。[guanzhi_official.GetTitledFirstName]一篇《辨党论》，洛阳为之纸贵。"
 guanzhi_court.1233.o0:0 "I see."
 guanzhi_court.1233.t:0 "社散人安"
 guanzhi_court.1233.desc:0 "禁诏既下，社员们纷纷烧掉社稿，作鸟兽散。[guanzhi_official.GetTitledFirstName]上表谢罪，自请闭门读书。清议之声，一时俱息。"
 guanzhi_court.1234.o0:0 "择其善者而行之，再召社首一谈"
 guanzhi_court.1234.o1:0 "纵有可取，妄议之罪仍不可恕"
 guanzhi_court.1234.t:0 "清议可采"
 guanzhi_court.1234.desc:0 "暗访回报：社中所议，多为漕运积弊、选官失平之事，条分缕析，竟颇中要害。其锋芒虽盛，倒也不全是书生空谈。"
 guanzhi_court.1235.o0:0 "讪上之风一开，朝廷体统何存？禁社惩首"
 guanzhi_court.1235.o1:0 "酒后狂言，睁一眼闭一眼罢"
 guanzhi_court.1235.t:0 "语涉乘舆"
 guanzhi_court.1235.desc:0 "暗访回报：社中议论渐无忌惮，竟至语涉宫闱，讥朕'远君子而亲小人'。座中哄笑者数十人，[guanzhi_official.GetTitledFirstName]危坐其中，并不制止。"
 guanzhi_court.1236.o0:0 "清议凌驾朝廷之上，此风断不可长"
 guanzhi_court.1236.o1:0 "收为己用，诏社中俊彦入仕"
 guanzhi_court.1236.t:0 "门户既立"
 guanzhi_court.1236.desc:0 "朕不加干预，文社声势愈盛，四方士子负笈来投者日以百计。如今朝中官员升迁，竟要先问社中月旦之评。'不入其社，难为清流。'"
 guanzhi_court.1237.o0:0 "成何体统！申饬社首，命其整肃"
 guanzhi_court.1237.o1:0 "看他们自己闹散，朕不出手"
 guanzhi_court.1237.t:0 "清流内讧"
 guanzhi_court.1237.desc:0 "物极必反。社中名士争座位、争月旦之评的高低，竟闹到互相攻讦、著文对骂的地步。一场清流雅集，成了市井笑谈。"
 guanzhi_court.1238.o0:0 "I see."
 guanzhi_court.1238.t:0 "清议之锢"
 guanzhi_court.1238.desc:0 "缇骑围社之日，书稿焚于市，[guanzhi_official.GetTitledFirstName]锒铛入狱。太学生聚哭于城门，自此朝野清议，噤若寒蝉。朕赢了这一局，却不知输了什么。"
 guanzhi_court.1239.o0:0 "I see."
 guanzhi_court.1239.t:0 "社事阑珊"
 guanzhi_court.1239.desc:0 "风潮起落，原是文章常态。文社渐渐门庭冷落，名士们散归各自书斋。朝堂之上，又只剩奏对之声。"
 guanzhi_court.1240.o0:0 "I see."
 guanzhi_court.1240.t:0 "野无遗贤"
 guanzhi_court.1240.desc:0 "朕将社中俊彦一一招入朝中，各授其职。[guanzhi_official.GetTitledFirstName]入朝谢恩那日，天下士人皆道：朝廷能容清议，真盛世气象。"
 guanzhi_court.1241.o0:0 "事涉谋逆，不可不查，下廷尉鞫问"
 guanzhi_court.1241.o1:0 "证据支离，显系构陷，掷还告词"
 guanzhi_court.1241.o2:0 "两造俱拘，当廷对质"
 guanzhi_court.1241.t:0 "告讦忠良"
 guanzhi_court.1241.desc:0 "忽有吏人叩阙上变，告[guanzhi_official.GetTitledFirstName]交通外藩、阴蓄异志。所呈书信往来、金帛之数，言之凿凿，然细按之，又多似是而非。举朝为之侧目。"
 guanzhi_court.1242.o0:0 "反坐告者，为其昭雪"
 guanzhi_court.1242.o1:0 "姑释之，不必深究幕后"
 guanzhi_court.1242.t:0 "查无实据"
 guanzhi_court.1242.desc:0 "廷尉穷治月余，所谓书信皆摹仿笔迹，金帛亦无下落。告者词穷，始吐实情：受人指使，贪赏而诬。"
 guanzhi_court.1243.o0:0 "既已成招，明正典刑"
 guanzhi_court.1243.o1:0 "此中定有冤情，发回重审"
 guanzhi_court.1243.t:0 "锻链成狱"
 guanzhi_court.1243.desc:0 "狱吏希旨，拷掠之下，竟锻炼成狱。[guanzhi_official.GetTitledFirstName]不胜棰楚，诬服谋反。案卷送至御前，只待朱笔一勾。"
 guanzhi_court.1244.o0:0 "I see."
 guanzhi_court.1244.t:0 "君臣不疑"
 guanzhi_court.1244.desc:0 "朕掷还告词之事传出，[guanzhi_official.GetTitledFirstName]入宫顿首，感激涕零。自此任事愈奋，朝臣亦谓朕有知人之明。"
 guanzhi_court.1245.o0:0 "拿问讦者，穷治幕后主使"
 guanzhi_court.1245.o1:0 "忍下这口气，冷处理之"
 guanzhi_court.1245.t:0 "讦者复起"
 guanzhi_court.1245.desc:0 "前词方掷还，告者竟再上变，且遍贴谤贴于通衢，谓朕包庇逆臣。看来背后有人撑腰，志在必得。"
 guanzhi_court.1246.o0:0 "反坐讦者，昭告中外"
 guanzhi_court.1246.o1:0 "薄责讦者，各留体面"
 guanzhi_court.1246.t:0 "当廷对质"
 guanzhi_court.1246.desc:0 "两造对质于廷。[guanzhi_official.GetTitledFirstName]逐条驳斥，告者汗下如雨，语无伦次，当庭认了诬告之罪。百官在列，是非已明。"
 guanzhi_court.1247.o0:0 "I see."
 guanzhi_court.1247.t:0 "沉冤得雪"
 guanzhi_court.1247.desc:0 "诬告者伏法，[guanzhi_official.GetTitledFirstName]官复原职，朕亲为慰劳。朝野相传：主上明察秋毫，谗人无所容其喙。"
 guanzhi_court.1248.o0:0 "I see."
 guanzhi_court.1248.t:0 "息事宁人"
 guanzhi_court.1248.desc:0 "此事终以和稀泥了结。讦者未得重惩，忠良虽保禄位，心下未必无憾。朝中告讦之风，恐难就此绝迹。"
 guanzhi_court.1249.o0:0 "I see."
 guanzhi_court.1249.t:0 "忠良喋血"
 guanzhi_court.1249.desc:0 "[guanzhi_official.GetTitledFirstName]弃市之日，围观者万人，有识者多掩泣。未几真相渐白，人皆言其冤。朕每念及，亦觉芒刺在背。"
 guanzhi_court.1251.o0:0 "下诏严禁，传唱者以妖言论罪"
 guanzhi_court.1251.o1:0 "密查童谣从何而来"
 guanzhi_court.1251.o2:0 "妖言自兴自灭，不必张皇"
 guanzhi_court.1251.t:0 "妖言入禁"
 guanzhi_court.1251.desc:0 "近日民间忽传童谣，语涉谶纬，暗指朝廷气数。此语竟越过宫墙，流入禁中，连内侍宫女都在私下传唱。黄门不敢隐瞒，密奏于朕。"
 guanzhi_court.1252.o0:0 "I see."
 guanzhi_court.1252.t:0 "禁网暂肃"
 guanzhi_court.1252.desc:0 "禁令既下，里巷不敢再唱。然街谈巷议虽止，人心之疑未必尽消。"
 guanzhi_court.1253.o0:0 "索性大索都城，穷治传者"
 guanzhi_court.1253.o1:0 "撤禁止捕，以德弭之"
 guanzhi_court.1253.t:0 "愈禁愈炽"
 guanzhi_court.1253.desc:0 "禁得越紧，传得越邪。如今童谣添了新词，讥讽朝廷'防民之口'。捕了几个人，反倒坐实了妖言有验。"
 guanzhi_court.1254.o0:0 "锁拿门客，问其主使"
 guanzhi_court.1254.o1:0 "召其入对，当面问个明白"
 guanzhi_court.1254.t:0 "溯源有获"
 guanzhi_court.1254.desc:0 "暗查两月，源头渐渐清晰——童谣竟是从[guanzhi_official.GetTitledFirstName]府上的门客中散出来的。是狂生妄语，还是有人授意？"
 guanzhi_court.1255.o0:0 "罢了，下诏自修德政以答天心"
 guanzhi_court.1255.o1:0 "继续查，宁可错拿不可放过"
 guanzhi_court.1255.t:0 "查无头绪"
 guanzhi_court.1255.desc:0 "查来查去，只抓到几个愚昧村夫，问不出个所以然。童谣像野火一般，烧了这片，又起那片。"
 guanzhi_court.1256.o0:0 "I see."
 guanzhi_court.1256.t:0 "妖言自熄"
 guanzhi_court.1256.desc:0 "朕置之不问，童谣传了一阵，终究没什么应验，市井渐渐也就不唱了。一场虚惊。"
 guanzhi_court.1257.o0:0 "I see."
 guanzhi_court.1257.t:0 "修德弭妖"
 guanzhi_court.1257.desc:0 "朕下诏罪己，省刑薄赋，停不急之务。数月之间，民谣渐止，民心亦安。史臣书曰：妖不胜德。"
 guanzhi_court.1258.o0:0 "I see."
 guanzhi_court.1258.t:0 "大索都城"
 guanzhi_court.1258.desc:0 "缇骑四出，旬日之间系狱数百。童谣是压下去了，可家家闭户，人人自危，都城之内一片死气。"
 guanzhi_court.1259.o0:0 "I see."
 guanzhi_court.1259.t:0 "君臣剖心"
 guanzhi_court.1259.desc:0 "[guanzhi_official.GetTitledFirstName]奉召入对，免冠顿首，自陈驭下不严，愿受处置。朕察其诚恳，薄责门客而慰留之。妖言之源既绝，风波遂平。"
 guanzhi_court.1261.o0:0 "腹诽岂可为罪？掷还弹章"
 guanzhi_court.1261.o1:0 "召其入对，亲察其心迹"
 guanzhi_court.1261.o2:0 "大臣心怀怨望，不可不惩"
 guanzhi_court.1261.t:0 "腹诽之劾"
 guanzhi_court.1261.desc:0 "廷议新令，[guanzhi_official.GetTitledFirstName]默无一言，唯唇微动。有酷吏上章弹劾：此人虽不入言，实腹诽朝政，其罪当诛。举朝愕然，静待朕意。"
 guanzhi_court.1262.o0:0 "I see."
 guanzhi_court.1262.t:0 "清议归心"
 guanzhi_court.1262.desc:0 "朕掷还弹章，且申谕群臣：论罪当论迹，岂可以忖度罪人？朝中直臣闻之，莫不称快。"
 guanzhi_court.1263.o0:0 "将此罗织之徒逐出朝廷"
 guanzhi_court.1263.o1:0 "各打板子，两下都申饬"
 guanzhi_court.1263.t:0 "劾者复争"
 guanzhi_court.1263.desc:0 "弹劾之人不肯干休，又上一章，谓朕姑息养奸，且罗织[guanzhi_official.GetTitledFirstName]平日细过数十条，必欲置之死地。"
 guanzhi_court.1264.o0:0 "是朕错疑了，疏中良策即日施行"
 guanzhi_court.1264.o1:0 "巧言令色，朕不信他"
 guanzhi_court.1264.t:0 "殿前剖白"
 guanzhi_court.1264.desc:0 "[guanzhi_official.GetTitledFirstName]奉召入对，从容自陈：当日默然，实因新令尚有斟酌处，正欲具疏详奏，非敢腹诽。言毕出袖中疏稿为证。"
 guanzhi_court.1265.o0:0 "心中有鬼，夺官候审"
 guanzhi_court.1265.o1:0 "或者只是怯懦，放他回去罢"
 guanzhi_court.1265.t:0 "言辞闪烁"
 guanzhi_court.1265.desc:0 "对答之间，[guanzhi_official.GetTitledFirstName]言辞闪烁，汗出如浆。问他新令得失，支吾半日，终不敢出一语。朕心中疑云更重了。"
 guanzhi_court.1266.o0:0 "顺坡下驴，薄责释放"
 guanzhi_court.1266.o1:0 "朕意已决，杀一儆百"
 guanzhi_court.1266.t:0 "舆论大哗"
 guanzhi_court.1266.desc:0 "朕将[guanzhi_official.GetTitledFirstName]下狱治罪，消息传出，朝野哗然。士大夫私下议论：唇动亦成罪，今后谁人还敢上朝？"
 guanzhi_court.1267.o0:0 "I see."
 guanzhi_court.1267.t:0 "腹诽成狱"
 guanzhi_court.1267.desc:0 "[guanzhi_official.GetTitledFirstName]终以'腹诽'定罪，削籍流放。自此公卿上朝，人人揣度圣意，唯诺之声盈廷，再无一句逆耳之言。"
 guanzhi_court.1268.o0:0 "I see."
 guanzhi_court.1268.t:0 "正气得申"
 guanzhi_court.1268.desc:0 "是非既明，[guanzhi_official.GetTitledFirstName]安然复职，罗织者怏怏退去。朝中大臣私下感叹：主上不以疑似罪人，社稷之福也。"
 guanzhi_court.1269.o0:0 "I see."
 guanzhi_court.1269.t:0 "含糊了结"
 guanzhi_court.1269.desc:0 "这桩腹诽案，终究含含糊糊地散了。没人受罚，也没人服气。只是经此一事，廷议之时愈发沉默了。"
 guanzhi_court.1270.o0:0 "I see."
 guanzhi_court.1270.t:0 "以唇杀人"
 guanzhi_court.1270.desc:0 "[guanzhi_official.GetTitledFirstName]竟以微愠见诛。行刑之日，天色晦暗。自此朝臣相见，不敢交一语，道路以目。朕虽立威，朝堂已成寒蝉之局。"
 guanzhi_court.1271.o0:0 "诗人咏物，何预朝政？留中不发"
 guanzhi_court.1271.o1:0 "命其自辩，逐句分疏"
 guanzhi_court.1271.o2:0 "文辞怨望，付台院勘问"
 guanzhi_court.1271.t:0 "诗案初起"
 guanzhi_court.1271.desc:0 "有人摘出[guanzhi_official.GetTitledFirstName]诗集数首，逐句笺注，谓'蛰龙'讥朕不躬亲，'东风'怨朝廷寡恩。笺注进呈御前，劾其讪谤君上，罪当不赦。"
 guanzhi_court.1272.o0:0 "I see."
 guanzhi_court.1272.t:0 "士林称颂"
 guanzhi_court.1272.desc:0 "朕留中之事传了出去，士林交口称颂，谓主上有容言之量。笺注者讨了个没趣，不敢再言。"
 guanzhi_court.1273.o0:0 "斥退笺注者，此等小人不可用"
 guanzhi_court.1273.o1:0 "众口铄金，还是勘一勘罢"
 guanzhi_court.1273.t:0 "罗织不已"
 guanzhi_court.1273.desc:0 "笺注者见朕不答，竟再搜旧作，连十年前吊古之诗也摘了出来，谓'哭庙'之句实哭今上之政。物议渐起。"
 guanzhi_court.1274.o0:0 "果然冤他，抚慰并薄责告者"
 guanzhi_court.1274.o1:0 "纵然如此，行文不慎亦有失"
 guanzhi_court.1274.t:0 "逐句分疏"
 guanzhi_court.1274.desc:0 "[guanzhi_official.GetTitledFirstName]上表自辩，逐句注明作诗的时节与本事：'蛰龙'乃咏古松，'东风'实伤春归。句句有出处，笺注竟是断章取义。"
 guanzhi_court.1275.o0:0 "到此为止，烧掉卷宗，不究了"
 guanzhi_court.1275.o1:0 "既开了头，索性查个彻底"
 guanzhi_court.1275.t:0 "欲辩愈晦"
 guanzhi_court.1275.desc:0 "自辩之表呈上，不辩还好，一辩之下又引出更多旧作。笺注者如获至宝，连夜加注，卷宗厚了数倍。"
 guanzhi_court.1276.o0:0 "依台院所拟，薄责了事"
 guanzhi_court.1276.o1:0 "朕看他就是心存怨望，重办"
 guanzhi_court.1276.t:0 "台院持平"
 guanzhi_court.1276.desc:0 "台院勘问月余，回报：诗文虽有牢骚，实无讪谤之实。言官亦上疏，谓以诗罪人，恐塞天下文人之心。"
 guanzhi_court.1277.o0:0 "I see."
 guanzhi_court.1277.t:0 "诗狱铸成"
 guanzhi_court.1277.desc:0 "勘问渐成罗织，[guanzhi_official.GetTitledFirstName]终以'讪谤'夺官远谪。临行焚稿，士林物伤其类，自此诗文酬唱，人人先自删改三遍。"
 guanzhi_court.1278.o0:0 "I see."
 guanzhi_court.1278.t:0 "君王雅量"
 guanzhi_court.1278.desc:0 "朕笑谓左右：朕若与诗人争句，岂不贻笑千古？遂置不问。消息传开，士林感奋，称盛世容人之度。"
 guanzhi_court.1279.o0:0 "I see."
 guanzhi_court.1279.t:0 "薄惩息争"
 guanzhi_court.1279.desc:0 "[guanzhi_official.GetTitledFirstName]罚俸数月，诫以慎言。事情了了，诗也无人再敢随便写了。得失之间，朕也说不清。"
 guanzhi_court.1280.o0:0 "I see."
 guanzhi_court.1280.t:0 "深文周纳"
 guanzhi_court.1280.desc:0 "朕执意重办，[guanzhi_official.GetTitledFirstName]竟瘐毙狱中。天下文人闻之股栗，笺注之风却自此大盛——摘人诗句，成了晋身之阶。"
 guanzhi_court.1281.o0:0 "遣使劳军，赐金帛以示不疑"
 guanzhi_court.1281.o1:0 "召其入朝述职，试探其心"
 guanzhi_court.1281.o2:0 "流言无稽，置之不问"
 guanzhi_court.1281.t:0 "功高招谤"
 guanzhi_court.1281.desc:0 "[guanzhi_official.GetTitledFirstName]督师在外，连战连捷，威名日盛。朝中流言随之四起：或谓其拥兵自重，或谓其市恩士卒，更有甚者，谓其有'不臣之心'。"
 guanzhi_court.1282.o0:0 "I see."
 guanzhi_court.1282.t:0 "宠遇愈隆"
 guanzhi_court.1282.desc:0 "使者赍金帛至军前，宣朕慰劳之旨。[guanzhi_official.GetTitledFirstName]望阙再拜，将士山呼。流言虽未尽息，军心却愈发归附朝廷。"
 guanzhi_court.1283.o0:0 "治谤者以离间君臣之罪"
 guanzhi_court.1283.o1:0 "清者自清，随他们说去"
 guanzhi_court.1283.t:0 "谤声再起"
 guanzhi_court.1283.desc:0 "金帛方至军前，朝中谤者又生新说：主上赏赐愈厚，足见猜忌愈深——此乃笼络之术耳。更有甚者，说[guanzhi_official.GetTitledFirstName]散金帛以结军心。"
 guanzhi_court.1284.o0:0 "温语慰留，兵权照旧托付"
 guanzhi_court.1284.o1:0 "既然请了，就准他荣养罢"
 guanzhi_court.1284.t:0 "单车入朝"
 guanzhi_court.1284.desc:0 "诏书到营，[guanzhi_official.GetTitledFirstName]即日交卸兵符，单车入朝，随行者不过数骑。廷见之日，免冠谢罪，请归田里。其无他志，已昭然可见。"
 guanzhi_court.1285.o0:0 "收回成命，加其食邑以安军心"
 guanzhi_court.1285.o1:0 "将计就计，遣新将接掌兵符"
 guanzhi_court.1285.t:0 "边军惊疑"
 guanzhi_court.1285.desc:0 "召还之诏甫出，边军大哗。将士谓朝廷猜忌功臣，军心动摇，敌骑闻风又聚于塞下。前线急报一日三至。"
 guanzhi_court.1286.o0:0 "I see."
 guanzhi_court.1286.t:0 "谣言自息"
 guanzhi_court.1286.desc:0 "朕不为流言所动，[guanzhi_official.GetTitledFirstName]在前线又报大捷。捷音至京，谤者自觉无趣，渐渐闭了嘴。"
 guanzhi_court.1287.o0:0 "手诏慰勉，剖陈朕心无他"
 guanzhi_court.1287.o1:0 "准其请辞，正可收兵权于朝廷"
 guanzhi_court.1287.t:0 "功臣自危"
 guanzhi_court.1287.desc:0 "朕的沉默传到前线，[guanzhi_official.GetTitledFirstName]却理解为圣心已疑。其近来上书请辞兵权，言辞哀切，军中已有骚动之迹。"
 guanzhi_court.1288.o0:0 "I see."
 guanzhi_court.1288.t:0 "疑谤尽释"
 guanzhi_court.1288.desc:0 "几番风波，君臣之间终无一隙。[guanzhi_official.GetTitledFirstName]感朕知遇，督师益力。史臣有言：将在外而君不疑，此社稷之福也。"
 guanzhi_court.1289.o0:0 "I see."
 guanzhi_court.1289.t:0 "功臣解甲"
 guanzhi_court.1289.desc:0 "[guanzhi_official.GetTitledFirstName]交还兵符，荣养于京。府门冷落，旧部星散。朝中谙军事者自此又少一人，边报再来时，朕不免想起他。"
 guanzhi_court.1290.o0:0 "I see."
 guanzhi_court.1290.t:0 "激成边患"
 guanzhi_court.1290.desc:0 "新将到营，号令不行，旧部鼓噪，几致哗变。[guanzhi_official.GetTitledFirstName]郁郁成疾，前线连吃败仗。朝中谤者，此时倒都安静了。"
 guanzhi_court.1291.o0:0 "即刻遣人围宅掘验"
 guanzhi_court.1291.o1:0 "巫蛊之事最启祸端，先审告者"
 guanzhi_court.1291.o2:0 "烧掉告词，此风断不可长"
 guanzhi_court.1291.t:0 "巫蛊之告"
 guanzhi_court.1291.desc:0 "有人密告：[guanzhi_official.GetTitledFirstName]于宅中埋木偶，书朕名讳，日夜诅咒。告者言之凿凿，且称愿为向导，掘地可得。宫禁之内，闻者无不色变。"
 guanzhi_court.1292.o0:0 "赃证在此，下诏狱穷治"
 guanzhi_court.1292.o1:0 "事有蹊跷，详查木偶来历"
 guanzhi_court.1292.t:0 "掘得偶人"
 guanzhi_court.1292.desc:0 "缇骑围宅，掘地三尺，竟真的掘出桐木偶人，上有朱书符咒！[guanzhi_official.GetTitledFirstName]呼冤不止，称必是奸人事先埋设栽赃。真伪一时难辨。"
 guanzhi_court.1293.o0:0 "反坐告者，慰抚受诬之臣"
 guanzhi_court.1293.o1:0 "告者或有所闻，薄责释之"
 guanzhi_court.1293.t:0 "掘地无获"
 guanzhi_court.1293.desc:0 "宅中翻掘殆尽，寸木未得。告者张口结舌，[guanzhi_official.GetTitledFirstName]摘冠于廷，泣请治告者诬罔之罪。百官在列，皆愤愤不平。"
 guanzhi_court.1294.o0:0 "穷治幕后，金主是何人？"
 guanzhi_court.1294.o1:0 "斩此獠以谢天下，余者不究"
 guanzhi_court.1294.t:0 "诬罔败露"
 guanzhi_court.1294.desc:0 "先审告者，果然有诈——其人与[guanzhi_official.GetTitledFirstName]有旧怨，受人重金，预谋栽赃。连木偶的刀工、符咒的笔迹，都对得上。"
 guanzhi_court.1295.o0:0 "宫闱重地，岂容攀扯？止狱"
 guanzhi_court.1295.o1:0 "天子犯法与庶民同，查！"
 guanzhi_court.1295.t:0 "蔓及宫闱"
 guanzhi_court.1295.desc:0 "审到深处，告者竟供出宫中有人牵涉——说是某贵人宫中亦埋有厌胜之物。此案若再追下去，就要烧到朕的后宫了。"
 guanzhi_court.1296.o0:0 "I see."
 guanzhi_court.1296.t:0 "焚词止诬"
 guanzhi_court.1296.desc:0 "朕命取告词，当着来使的面烧了，并传谕：再有以巫蛊告人者，以所告之罪罪之。举朝闻之，皆颂主上圣明，告讦者为之敛迹。"
 guanzhi_court.1297.o0:0 "人赃并获时再拿他，这回跑不了"
 guanzhi_court.1297.o1:0 "罢了，当初是朕不究，认了"
 guanzhi_court.1297.t:0 "弄假成真"
 guanzhi_court.1297.desc:0 "焚词之后数月，[guanzhi_official.GetTitledFirstName]家奴因罪潜逃，自首于有司：其主宅中实有厌胜之物，焚词之举反倒使他躲过一劫。朕脸上有些挂不住了。"
 guanzhi_court.1298.o0:0 "I see."
 guanzhi_court.1298.t:0 "巫蛊成狱"
 guanzhi_court.1298.desc:0 "诏狱既兴，攀引日广。今日搜某宅，明日掘某园，朝臣人人自危，相见以目。[guanzhi_official.GetTitledFirstName]虽诛，朝堂之上已是一片肃杀。"
 guanzhi_court.1299.o0:0 "I see."
 guanzhi_court.1299.t:0 "诬者伏法"
 guanzhi_court.1299.desc:0 "栽赃者明正典刑，[guanzhi_official.GetTitledFirstName]沉冤得雪。朕特诏申禁：告巫蛊而不实者，反坐。此风一刹，朝野称快。"
 guanzhi_court.1300.o0:0 "I see."
 guanzhi_court.1300.t:0 "疑云犹在"
 guanzhi_court.1300.desc:0 "案子不了了之，可巫蛊二字已在人心扎了根。君臣之间，同僚之间，总像隔着一层什么。这根刺，怕是拔不掉了。"
 guanzhi_court.1301.o0:0 "召其入对，朕要亲听新法之弊"
 guanzhi_court.1301.o1:0 "沮挠新政，罪无可贷，逐之"
 guanzhi_court.1301.o2:0 "令其条陈利害，有则改之"
 guanzhi_court.1301.t:0 "谤议盈朝"
 guanzhi_court.1301.desc:0 "新政推行逾年，州县多有不便，谤议纷起。[guanzhi_official.GetTitledFirstName]上疏极言新法之弊，疏文传出，抄本满城，清议翕然从之。主政大臣请治其讪谤之罪。"
 guanzhi_court.1302.o0:0 "即遣使按察，新法该改的改"
 guanzhi_court.1302.o1:0 "法是好法，坏在执行，责成有司"
 guanzhi_court.1302.t:0 "言之有物"
 guanzhi_court.1302.desc:0 "廷对半日，[guanzhi_official.GetTitledFirstName]历数新法在州县走样之状：青苗抑配、市易夺利，件件有实据。朕越听越是心惊——原来下情竟壅塞至此。"
 guanzhi_court.1303.o0:0 "空谈误国，降一级以观后效"
 guanzhi_court.1303.o1:0 "念其敢言，不加罪，也不采纳"
 guanzhi_court.1303.t:0 "徒尚空谈"
 guanzhi_court.1303.desc:0 "对答之间，[guanzhi_official.GetTitledFirstName]翻来覆去只是'与民争利''变更祖制'几句老话，问他具体弊端，却一件也指不出。看来所谓谤议，多半是意气。"
 guanzhi_court.1304.o0:0 "太学生干政，一体弹压"
 guanzhi_court.1304.o1:0 "收回成命，召还抚慰"
 guanzhi_court.1304.t:0 "逐臣激变"
 guanzhi_court.1304.desc:0 "[guanzhi_official.GetTitledFirstName]被逐出京之日，送行者塞途，太学生数百人伏阙上书，为其鸣冤。谤议非但未曾止息，反倒烧得更旺了。"
 guanzhi_court.1305.o0:0 "I see."
 guanzhi_court.1305.t:0 "令行禁止"
 guanzhi_court.1305.desc:0 "为首者既逐，谤议果然敛迹。州县奉行新法不敢怠慢，钱谷渐充，府库日见丰盈。只是朝堂之上，也再听不到一句不同的话了。"
 guanzhi_court.1306.o0:0 "I see."
 guanzhi_court.1306.t:0 "采言修法"
 guanzhi_court.1306.desc:0 "[guanzhi_official.GetTitledFirstName]条陈十二事，朕采其八事，诏令修改新法之苛者。谤者见朝廷并非讳过，议论渐渐就事论事起来。"
 guanzhi_court.1307.o0:0 "新政不可废，朕一力担之"
 guanzhi_court.1307.o1:0 "暂缓新法，以安众心"
 guanzhi_court.1307.t:0 "谤议复炽"
 guanzhi_court.1307.desc:0 "朝廷一改再改，谤者反倒得了理：看，若非新法有误，何至于改？于是攻讦更烈，直指主政大臣当罢、新法当废。"
 guanzhi_court.1308.o0:0 "I see."
 guanzhi_court.1308.t:0 "新政得寿"
 guanzhi_court.1308.desc:0 "既察下情，又改苛政，新法去其弊而存其利，渐渐行得顺了。[guanzhi_official.GetTitledFirstName]以敢言受赏，言路与新政，竟得两全。"
 guanzhi_court.1309.o0:0 "I see."
 guanzhi_court.1309.t:0 "不为谤夺"
 guanzhi_court.1309.desc:0 "朕下诏：新法既定，再有讪谤沮挠者，以违制论。谤议被硬压了下去，新政照旧推行。是成是败，只好留给后日了。"
 guanzhi_court.1310.o0:0 "I see."
 guanzhi_court.1310.t:0 "朝局纷扰"
 guanzhi_court.1310.desc:0 "弹压愈急，攻讦愈烈，朝中遂分为新党旧党，势同水火。政事堂上日日相争，朕居其间，左右不是。"
 guanzhi_court.1311.o0:0 "事关国本，下廷议共商"
 guanzhi_court.1311.o1:0 "京师根本之地，岂可轻动？留中"
 guanzhi_court.1311.o2:0 "妄言迁都，动摇人心，廷杖之"
 guanzhi_court.1311.t:0 "迁都之疏"
 guanzhi_court.1311.desc:0 "边患日重，烽燧屡警。[guanzhi_official.GetTitledFirstName]上疏极言：京师迫近塞垣，胡骑数日可至，不如迁都腹地，据山河之固以避其锋。疏入，举朝震动，聚议纷纭。"
 guanzhi_court.1312.o0:0 "依议，诏定迁都"
 guanzhi_court.1312.o1:0 "迁都是示弱于敌，朕意守之"
 guanzhi_court.1312.t:0 "群议主迁"
 guanzhi_court.1312.desc:0 "廷议数日，群臣多附迁都之说，已择定新都形胜之地，连宫室城郭之图都呈上来了。[guanzhi_official.GetTitledFirstName]顿首固请：社稷为重，幸勿迟疑。"
 guanzhi_court.1313.o0:0 "朕独断：迁！"
 guanzhi_court.1313.o1:0 "罢议！整军备边，示敌以必守"
 guanzhi_court.1313.t:0 "迁守相持"
 guanzhi_court.1313.desc:0 "廷议之上，主迁者与主守者争得面红耳赤。主迁者谓社稷为重，主守者谓弃京即弃天下之望。两造相持不下，皆候圣裁。"
 guanzhi_court.1314.o0:0 "事急矣，下诏巡幸以避其锋"
 guanzhi_court.1314.o1:0 "朕下罪己诏，亲登城楼以安众"
 guanzhi_court.1314.t:0 "敌骑益近"
 guanzhi_court.1314.desc:0 "迁都疏留中月余，边报益急：敌大举入寇，前锋距京不过数百里。京师米价腾贵，富室已暗暗捆载南行，人心惶惶。"
 guanzhi_court.1315.o0:0 "出榜安民，严斥弃都之谣"
 guanzhi_court.1315.o1:0 "捕造谣者下狱，以儆效尤"
 guanzhi_court.1315.t:0 "弃都流言"
 guanzhi_court.1315.desc:0 "朝中不知圣意所在，民间流言蜂起，皆言朝廷将弃京师南逃。商贾闭市，细民扶老携幼争出城门，几致踩踏。"
 guanzhi_court.1316.o0:0 "朕屈己谢之，复其官职"
 guanzhi_court.1316.o1:0 "朕不悔！敢再言迁都者同罪"
 guanzhi_court.1316.t:0 "杖下直臣"
 guanzhi_court.1316.desc:0 "[guanzhi_official.GetTitledFirstName]受杖于廷，血肉模糊而不言悔，且言：'臣言不用，他日敌至城下，悔之晚矣。'朝野闻之，多有同情其忠者。"
 guanzhi_court.1317.o0:0 "I see."
 guanzhi_court.1317.t:0 "銮驾南迁"
 guanzhi_court.1317.desc:0 "迁都之役经年，宫室营缮、百官播迁、军民转徙，国库为之几空。然新都据险临江，宗庙社稷得全，敌骑虽盛，只能望河而叹。"
 guanzhi_court.1318.o0:0 "I see."
 guanzhi_court.1318.t:0 "固京却敌"
 guanzhi_court.1318.desc:0 "朕拒迁守京，亲御戎服劳军，将士感奋用命。敌知京师有备，逡巡不敢深入，终引兵北去。主守诸臣弹冠相庆，主迁者亦俯首心服。"
 guanzhi_court.1319.o0:0 "I see."
 guanzhi_court.1319.t:0 "迁守两罢"
 guanzhi_court.1319.desc:0 "迁都之议终寝，朝廷但增修边障、积粟京师以为备。敌亦旋即退兵，一场风波，就此两罢。事后看来，竟是虚惊一场。"
 guanzhi_court.1321.o0:0 "战！寇能往，朕亦能往"
 guanzhi_court.1321.o1:0 "且许之和，以纾国难"
 guanzhi_court.1321.o2:0 "和战皆备，先遣使觇敌虚实"
 guanzhi_court.1321.t:0 "和战廷辩"
 guanzhi_court.1321.desc:0 "强敌倾国压境，边郡羽书雪片般飞来。廷辩之上，[guanzhi_official.GetTitledFirstName]按剑主哉，谓示弱则敌愈骄；另一派则力陈师老财匮，谓和则生聚可待。两说相持，皆望朕一言而决。"
 guanzhi_court.1322.o0:0 "乘胜直捣，务歼其主力"
 guanzhi_court.1322.o1:0 "穷寇勿迫，受降班师"
 guanzhi_court.1322.t:0 "前军奏捷"
 guanzhi_court.1322.desc:0 "大军既出，将士用命，连战皆捷，斩首数千，敌锋大挫。捷报入京之日，百姓夹道欢呼。主和诸臣默然，[guanzhi_official.GetTitledFirstName]则请乘胜穷追。"
 guanzhi_court.1323.o0:0 "征发再举，此仇必报"
 guanzhi_court.1323.o1:0 "兵败国疲，遣使请和罢"
 guanzhi_court.1323.t:0 "大军挫衄"
 guanzhi_court.1323.desc:0 "败报传至：我军轻进中伏，折损万余，辎重尽失，败兵塞于道路。京师震动，主和之议复炽，纷纷归咎于始谋战者。"
 guanzhi_court.1324.o0:0 "忍一时之辱，岁币予之"
 guanzhi_court.1324.o1:0 "辱国至此！罢和议，转议战"
 guanzhi_court.1324.t:0 "敌索厚币"
 guanzhi_court.1324.desc:0 "使臣回报：敌许罢兵，然岁索缯帛金银，数目之巨，几敌半年之赋。且要朕以晚辈之礼事其主。[guanzhi_official.GetTitledFirstName]愤然曰：此城下之盟也！"
 guanzhi_court.1325.o0:0 "仓皇征兵应战"
 guanzhi_court.1325.o1:0 "罪主和之臣以谢天下"
 guanzhi_court.1325.t:0 "和议中变"
 guanzhi_court.1325.desc:0 "和议方成，边备稍弛，敌竟渝盟，轻骑掩至，连破数城而去。朝野大哗，皆言主和误国。朕览奏，掷之于地。"
 guanzhi_court.1326.o0:0 "乘其内乱，兴师伐之"
 guanzhi_court.1326.o1:0 "坐观其乱，缮甲蓄粟以待"
 guanzhi_court.1326.t:0 "敌国内乱"
 guanzhi_court.1326.desc:0 "使臣密报：敌国内部争位，骨肉相攻，其精锐半撤而东，压境之师多是虚张声势。天赐之机，正在目前。"
 guanzhi_court.1327.o0:0 "敛兵固守，深沟高垒以拒之"
 guanzhi_court.1327.o1:0 "既不可战，遣使议和罢"
 guanzhi_court.1327.t:0 "敌备甚严"
 guanzhi_court.1327.desc:0 "使臣还报：敌兵精粮足，壁垒森严，其主亲临誓师，志在必得。以今之国力，战则无幸胜之算。"
 guanzhi_court.1328.o0:0 "I see."
 guanzhi_court.1328.t:0 "饮至策勋"
 guanzhi_court.1328.desc:0 "王师凯旋，朕亲至郊劳，饮至策勋，告捷于宗庙。自此敌胆益寒，数年不敢南向。史官大书：天子神武，一戎衣而边境安。"
 guanzhi_court.1329.o0:0 "I see."
 guanzhi_court.1329.t:0 "玉帛修好"
 guanzhi_court.1329.desc:0 "和约既成，玉帛往来，边关罢警。虽岁有所费，然百姓免于锋镝，得以休养生息。朝中犹有讥其示弱者和，朕亦姑听之。"
 guanzhi_court.1330.o0:0 "I see."
 guanzhi_court.1330.t:0 "师老财竭"
 guanzhi_court.1330.desc:0 "战事迁延数载，师老于外，财竭于内，户口流亡，田园荒芜。朕夜半览军报，未尝不抚案长叹：和战之间，一言兴丧，其难如此。"
 guanzhi_court.1331.o0:0 "命礼官博考经典，务求至当"
 guanzhi_court.1331.o1:0 "朕意已决，径下诏尊崇"
 guanzhi_court.1331.o2:0 "孝道清议两难，且从缓议"
 guanzhi_court.1331.t:0 "尊崇之议"
 guanzhi_court.1331.desc:0 "朕以旁支入继大统，今欲尊崇本生父，加殊礼以报劬劳。诏下礼官议，[guanzhi_official.GetTitledFirstName]率礼官固争：为人后者为之子，本生父只宜称皇伯考，此万世不易之礼也。"
 guanzhi_court.1332.o0:0 "朕屈私情，从其议"
 guanzhi_court.1332.o1:0 "再议！朕要的是皇考之称"
 guanzhi_court.1332.t:0 "皇伯考议"
 guanzhi_court.1332.desc:0 "礼官考据经传，连章而上：当以皇伯考为称，仪注分明，引汉宣、光武故事为证。[guanzhi_official.GetTitledFirstName]伏阙固请，称此礼一失，纲常尽隳。朕览之，心甚不怿。"
 guanzhi_court.1333.o0:0 "都退下，朕亲裁此事"
 guanzhi_court.1333.o1:0 "将为首争执者杖于廷"
 guanzhi_court.1333.t:0 "礼分两党"
 guanzhi_court.1333.desc:0 "议礼一事，竟令朝臣裂为两党：一派附礼官执皇伯考之说，一派揣朕意主皇考之议。章疏交攻，互相诋为奸谀，朝堂汹汹如沸。"
 guanzhi_court.1334.o0:0 "为首者贬出京师，余不问"
 guanzhi_court.1334.o1:0 "朕亦悔之，遣使抚慰伤者"
 guanzhi_court.1334.t:0 "廷杖礼官"
 guanzhi_court.1334.desc:0 "廷杖既行，血染丹墀。执礼诸臣免冠待罪，伏地哭谏，声彻殿陛。消息传出，天下士论哗然，皆谓朝廷以杖辱礼臣，失士心矣。"
 guanzhi_court.1335.o0:0 "弹章一概留中，朕不回心"
 guanzhi_court.1335.o1:0 "众怒难犯，收回成命"
 guanzhi_court.1335.t:0 "诏称皇考"
 guanzhi_court.1335.desc:0 "尊崇之诏径下：本生父称皇考，立庙京师，礼秩一准帝王。诏出，台谏交章论劾，一日数十上，[guanzhi_official.GetTitledFirstName]更以去就力争，请削官归田。"
 guanzhi_court.1336.o0:0 "称皇伯考，而加殊礼以慰孝心"
 guanzhi_court.1336.o1:0 "终不能已，再下廷议"
 guanzhi_court.1336.t:0 "中夜彷徨"
 guanzhi_court.1336.desc:0 "议既从缓，朕中夜思之，辗转反侧：生我者父母，继统者宗庙，忠孝清议，竟不可兼得。两宫亦有微言，家事国事，搅作一团。"
 guanzhi_court.1337.o0:0 "朕从清议，此事依礼官"
 guanzhi_court.1337.o1:0 "要挟君上！为首者悉罢之"
 guanzhi_court.1337.t:0 "伏阙力争"
 guanzhi_court.1337.desc:0 "缓议日久，言官等不得旨意，竟相约伏阙：若尊崇逾礼，愿同日罢官归乡。以[guanzhi_official.GetTitledFirstName]为首者数十人，免冠跪于宫门之外，观者如堵。"
 guanzhi_court.1338.o0:0 "I see."
 guanzhi_court.1338.t:0 "大礼终成"
 guanzhi_court.1338.desc:0 "尊崇之礼终究得行，皇考之称入于诏书。然执礼之士或贬或去，朝中为之一空。朕虽遂了孝心，每对空落落的谏垣，亦觉怅然。"
 guanzhi_court.1339.o0:0 "I see."
 guanzhi_court.1339.t:0 "屈己从礼"
 guanzhi_court.1339.desc:0 "朕终抑私情以从公议，诏称皇伯考，一依礼官所定。诏下之日，群臣山呼，天下翕然称圣，谓主上能克己复礼，社稷之福也。"
 guanzhi_court.1340.o0:0 "I see."
 guanzhi_court.1340.t:0 "殊礼两全"
 guanzhi_court.1340.desc:0 "几经折冲，终定仪制：本生父称皇伯考，而加殊礼，立别庙，岁时致祭一准皇考之仪。礼不失经，孝亦得伸，两派皆无词，一场礼议就此而息。"
 guanzhi_court.1341.o0:0 "聚历官详议，务究其理"
 guanzhi_court.1341.o1:0 "祖宗旧历，岂可轻改？不准"
 guanzhi_court.1341.o2:0 "令作新历，与旧历并验之"
 guanzhi_court.1341.t:0 "交食不验"
 guanzhi_court.1341.desc:0 "近来历法失准，日食推算屡不验，朔望皆差。司天监[guanzhi_official.GetTitledFirstName]上奏：旧历行用已久，岁差日积，请诏改历，以正天时。守旧大臣则谓祖宗旧历不可轻动。"
 guanzhi_court.1342.o0:0 "推算既验，即颁行天下"
 guanzhi_court.1342.o1:0 "再验一年，确然无误再说"
 guanzhi_court.1342.t:0 "新历初成"
 guanzhi_court.1342.desc:0 "新历草稿已成，[guanzhi_official.GetTitledFirstName]率历官当庭演算，去岁三次交食皆验如符契。守旧者语塞，但仍哓哓：历法乃国之大经，颁行不可不慎。"
 guanzhi_court.1343.o0:0 "改历朕所许也，朕当庇之"
 guanzhi_court.1343.o1:0 "谪其人以谢旧臣，罢改历"
 guanzhi_court.1343.t:0 "妄改之劾"
 guanzhi_court.1343.desc:0 "守旧大臣交章弹劾[guanzhi_official.GetTitledFirstName]：妄改祖宗成法，紊乱天时，其罪当诛。弹章连上，辞气甚厉，新历之议摇摇欲坠。"
 guanzhi_court.1344.o0:0 "悔不用其言，召还改历"
 guanzhi_court.1344.o1:0 "宁失天象，不变祖制"
 guanzhi_court.1344.t:0 "占候再失"
 guanzhi_court.1344.desc:0 "旧历仍行，而日食又不验，救食之仪空张于朝堂，天狗却食在分秒之外。占候失措，远近传为笑谈，御史始有追论司天之罪者。"
 guanzhi_court.1345.o0:0 "温旨勉留，许其参验新术"
 guanzhi_court.1345.o1:0 "去留随意，朕不强留"
 guanzhi_court.1345.t:0 "历官灰心"
 guanzhi_court.1345.desc:0 "改历之请既沮，[guanzhi_official.GetTitledFirstName]郁郁不得志，屡次称病不朝，或言其欲挂冠而去。司天监诸生亦多懈怠，推步之业渐荒。"
 guanzhi_court.1346.o0:0 "废旧历，颁行新历"
 guanzhi_court.1346.o1:0 "以旧历正朔，新历备参考"
 guanzhi_court.1346.t:0 "期年并验"
 guanzhi_court.1346.desc:0 "新旧两历并验期年，结果分明：新历十验其九，旧历十失其四。验簿具在，守旧诸臣面对白纸黑字，再也无话可说。"
 guanzhi_court.1347.o0:0 "I see."
 guanzhi_court.1347.t:0 "历议寝阁"
 guanzhi_court.1347.desc:0 "改历之议争持数年，终究搁置。旧历照旧行用，交食照旧不验。司天之业日荒，能推步者渐稀，后世读史至此，不免一叹。"
 guanzhi_court.1348.o0:0 "I see."
 guanzhi_court.1348.t:0 "新历颁行"
 guanzhi_court.1348.desc:0 "新历颁行天下，正朔既正，交食皆验。四夷来朝者亦请颁赐历日，奉正朔而归。朕亲制序文冠于历首，[guanzhi_official.GetTitledFirstName]之名附焉。"
 guanzhi_court.1349.o0:0 "I see."
 guanzhi_court.1349.t:0 "两历并行"
 guanzhi_court.1349.desc:0 "朝廷定议：颁朔仍用旧历以安众心，新历则藏之司天，参验候气。一场改历之争，落得个不新不旧、两存其说。"
 guanzhi_court.1351.o0:0 "令双方尽言，朕以理断之"
 guanzhi_court.1351.o1:0 "盐铁利国，断不可罢"
 guanzhi_court.1351.o2:0 "与民休息，悉罢盐铁之榷"
 guanzhi_court.1351.t:0 "盐铁大议"
 guanzhi_court.1351.desc:0 "国用日绌，朝议及于盐铁专卖。贤良文学一派请罢榷与民休息，谓朝廷不与民争利；[guanzhi_official.GetTitledFirstName]则力主专卖不可废，谓边费国用皆仰给于此。两造数十人，廷辩连日。"
 guanzhi_court.1352.o0:0 "存专卖，而严抑榷吏苛扰"
 guanzhi_court.1352.o1:0 "榷利甚厚，益榷及于酒茗"
 guanzhi_court.1352.t:0 "利孔不可开"
 guanzhi_court.1352.desc:0 "廷辩数日，主专卖者历数边饷、河工、赈贷之费，皆出盐铁，若罢榷则诸费无着。文学诸人语塞，但引'王者不言利'为对，气势已屈。"
 guanzhi_court.1353.o0:0 "民困至此，罢榷！"
 guanzhi_court.1353.o1:0 "稍弛其禁，存其大纲"
 guanzhi_court.1353.t:0 "清议汹汹"
 guanzhi_court.1353.desc:0 "廷辩数日，文学诸人历陈民间疾苦：盐贵如珠，铁器窳恶，吏缘为奸，小民淡食。言者声泪俱下，听者无不动容，主专卖者渐落下风。"
 guanzhi_court.1354.o0:0 "以羡余治边备河，用于正途"
 guanzhi_court.1354.o1:0 "充盈朕之内帑"
 guanzhi_court.1354.t:0 "缗钱日入"
 guanzhi_court.1354.desc:0 "专卖既坚，盐铁之利源源入京，太仓渐充，边饷赖以不乏。有司报羡余之数，朕览之甚喜，[guanzhi_official.GetTitledFirstName]颇以此自矜。"
 guanzhi_court.1355.o0:0 "严惩贪纵榷吏，以平民怨"
 guanzhi_court.1355.o1:0 "利在国家，勿恤小民之怨"
 guanzhi_court.1355.t:0 "榷政大苛"
 guanzhi_court.1355.desc:0 "榷令既峻，盐铁吏因缘为奸，抑配强卖，小民苦之。私盐私铸四起，捕不胜捕，郡国狱讼繁兴，囹圄几满。"
 guanzhi_court.1356.o0:0 "国用要紧，复榷盐铁"
 guanzhi_court.1356.o1:0 "量加田赋，以补国用"
 guanzhi_court.1356.t:0 "边饷不继"
 guanzhi_court.1356.desc:0 "盐铁既罢，榷利顿绝，太仓之入骤减。边镇催饷文书接踵而至，有司计无所出，竟议减百官俸禄以充之，朝议又汹汹复起。"
 guanzhi_court.1357.o0:0 "行算缗告缗，夺其暴利"
 guanzhi_court.1357.o1:0 "民富即国富，任之可也"
 guanzhi_court.1357.t:0 "豪商擅利"
 guanzhi_court.1357.desc:0 "官榷既废，盐铁之利不入国库，尽归富商大贾。豪商冶铸煮盐，富埒王侯，僮仆千指，交通王侯，渐有尾大之势。"
 guanzhi_court.1358.o0:0 "I see."
 guanzhi_court.1358.t:0 "存榷去苛"
 guanzhi_court.1358.desc:0 "朝廷定议：盐铁专卖存其大纲，而尽革苛扰之政，黜退贪吏，平其盐价。国用不乏，民亦稍苏，一场大辩论，总算落得不偏不倚。"
 guanzhi_court.1359.o0:0 "I see."
 guanzhi_court.1359.t:0 "利进怨积"
 guanzhi_court.1359.desc:0 "榷利大进，府库充溢，然民间膏血渐竭，怨声载道。有司以聚敛为能，酷吏以搜刮得幸。朕虽得钱谷之利，失的却是天下之心。"
 guanzhi_court.1360.o0:0 "I see."
 guanzhi_court.1360.t:0 "弛禁利民"
 guanzhi_court.1360.desc:0 "盐铁之禁既弛，山海之利还之于民。数年之间，农安于田，商安于市，虽国用稍绌，而天下颂声作焉。朕始信'不言利'三字，自有深味。"
 guanzhi_court.1361.o0:0 "漕运命脉，兴工改道！"
 guanzhi_court.1361.o1:0 "疏浚旧渠即可，何必大役"
 guanzhi_court.1361.o2:0 "暂发陆运海运应急，从长计议"
 guanzhi_court.1361.t:0 "漕渠壅塞"
 guanzhi_court.1361.desc:0 "漕渠年久淤塞，粮船胶滞，京师太仓之积渐薄，百官俸米、禁军月粮皆有缺额之忧。[guanzhi_official.GetTitledFirstName]奏请别开新河以通漕运，工费之巨，以百万计。"
 guanzhi_court.1362.o0:0 "大阅漕运，旌督工之功"
 guanzhi_court.1362.o1:0 "功虽成而民力疲，赈恤役夫"
 guanzhi_court.1362.t:0 "新河既成"
 guanzhi_court.1362.desc:0 "新河工成，引流通漕，粮船首尾相衔，直抵京师。太仓复盈，[guanzhi_official.GetTitledFirstName]督工有功，百姓役夫亦渐散归田里。"
 guanzhi_court.1363.o0:0 "罢了！罢新河，复归旧道"
 guanzhi_court.1363.o1:0 "开弓没有回头箭，严督续修"
 guanzhi_court.1363.t:0 "新河屡决"
 guanzhi_court.1363.desc:0 "新河地势相戾，屡筑屡决，溺死役夫数百，糜费巨万而功不成。言官交章劾[guanzhi_official.GetTitledFirstName]轻启大役，误国病民。"
 guanzhi_court.1364.o0:0 "再浚，并置闸节水以济之"
 guanzhi_court.1364.o1:0 "旧渠不可恃，改道之议复起"
 guanzhi_court.1364.t:0 "旋浚旋淤"
 guanzhi_court.1364.desc:0 "旧渠疏浚方毕，未及一年又淤。漕船依旧浅涩，运丁叫苦连天。前后所费，已数倍于初估，而病根未除。"
 guanzhi_court.1365.o0:0 "足见旧制可行，岁以为常"
 guanzhi_court.1365.t:0 "浚渠小通"
 guanzhi_court.1365.desc:0 "疏浚之力竟奏小效，旧渠水势渐畅，漕船虽迟而竟达。京师粮价稍平，主改道者亦不复哓哓。"
 guanzhi_court.1366.o0:0 "罢海运，急开新河改道"
 guanzhi_court.1366.o1:0 "仍恃旧渠，严期催运"
 guanzhi_court.1366.t:0 "海运漂没"
 guanzhi_court.1366.desc:0 "权发海运以应急，孰料飓风忽起，粮船漂没数艘，溺死运卒百余。朝臣争言海道凶险，不可复蹈。"
 guanzhi_court.1367.o0:0 "终非长策，兴工改道罢"
 guanzhi_court.1367.o1:0 "罢陆运，听民输钱代运"
 guanzhi_court.1367.t:0 "转输疲民"
 guanzhi_court.1367.desc:0 "陆运转输，牛车络绎于道，人畜死者相望，运费十倍于漕。所过州县不堪供应，民怨之声渐闻于朝。"
 guanzhi_court.1368.o0:0 "I see."
 guanzhi_court.1368.t:0 "漕运大通"
 guanzhi_court.1368.desc:0 "新河既通，漕船岁运数百万石，直达京畿。太仓之积陈陈相因，边饷京师两无所忧。始议之臣受赏，天下始知此役之非妄动。"
 guanzhi_court.1369.o0:0 "I see."
 guanzhi_court.1369.t:0 "河决为害"
 guanzhi_court.1369.desc:0 "新河再决，浊流漫野，漂没田庐以千计，流民塞路。朝廷急发帑赈济，而始议改道者被劾去职。一场大役，终成画饼。"
 guanzhi_court.1370.o0:0 "I see."
 guanzhi_court.1370.t:0 "因循维持"
 guanzhi_court.1370.desc:0 "漕事终归于因循：旧渠岁浚岁淤，闸坝时修时坏，运粮仅支京师之用。上下皆知非长策，然无人再敢提改道二字了。"
 guanzhi_court.1371.o0:0 "铸大钱以救钱荒"
 guanzhi_court.1371.o1:0 "大钱虚币也，废钱用帛"
 guanzhi_court.1371.o2:0 "钱法大事，下廷臣博议"
 guanzhi_court.1371.t:0 "钱荒日甚"
 guanzhi_court.1371.desc:0 "钱荒日甚，铜钱寝贵，百货腾踊，民间至以绢帛粟米相易，市易几于停滞。[guanzhi_official.GetTitledFirstName]奏请铸当十大钱以救钱荒；亦有老臣谓大钱乃虚币祸根，不如废钱而用谷帛。"
 guanzhi_court.1372.o0:0 "通行天下，定为永制"
 guanzhi_court.1372.o1:0 "当十何足？益铸当百大钱"
 guanzhi_court.1372.t:0 "大钱初行"
 guanzhi_court.1372.desc:0 "大钱既铸，以一当十，市上铜钱骤增，交易稍通，朝廷更得铸利以补国用。[guanzhi_official.GetTitledFirstName]扬扬自得，请定为永制。"
 guanzhi_court.1373.o0:0 "铸钱者斩！严刑止滥"
 guanzhi_court.1373.o1:0 "收大钱改铸小钱，以平其直"
 guanzhi_court.1373.t:0 "盗铸蜂起"
 guanzhi_court.1373.desc:0 "大钱利重，盗铸者如云而起，虽严刑不能禁。私钱滥恶薄小，掺杂行使，物价愈贵，良民持真钱反买不到东西。"
 guanzhi_court.1374.o0:0 "复铸钱，废帛币之令"
 guanzhi_court.1374.o1:0 "强令行之，违者以法从事"
 guanzhi_court.1374.t:0 "帛劣币窳"
 guanzhi_court.1374.desc:0 "废钱用帛，而奸商织薄帛短幅以充数，尺帛不能蔽体，斗米之价无算。商贾相率闭门，城乡交易断绝，怨声载道。"
 guanzhi_court.1375.o0:0 "城乡两便，钱帛兼行"
 guanzhi_court.1375.o1:0 "既然便民，索性悉废铜钱"
 guanzhi_court.1375.t:0 "谷帛通行"
 guanzhi_court.1375.desc:0 "废钱之后，乡间以谷帛相易，农人卖粟购帛，反觉称便，不复受钱荒之苦。唯城中商贾犹以为言，谓远行贸易非钱不可。"
 guanzhi_court.1376.o0:0 "善，即日颁行新钱"
 guanzhi_court.1376.o1:0 "新钱与旧钱并行一年以观效"
 guanzhi_court.1376.t:0 "新钱议定"
 guanzhi_court.1376.desc:0 "廷臣博议旬日，终有定论：更铸新钱，轻重适中，与物价相称，既非大钱之虚，亦免废钱之扰。[guanzhi_official.GetTitledFirstName]奉诏督铸。"
 guanzhi_court.1377.o0:0 "朕亲决之：铸新钱，勿复议"
 guanzhi_court.1377.o1:0 "且拖一拖，徐观其变"
 guanzhi_court.1377.t:0 "聚讼盈廷"
 guanzhi_court.1377.desc:0 "廷议聚讼，主大钱者、主废钱者、主仍旧者各执一说，旬日不决。而钱荒日甚一日，市上斗米千钱，小民束手。"
 guanzhi_court.1378.o0:0 "I see."
 guanzhi_court.1378.t:0 "钱法一新"
 guanzhi_court.1378.desc:0 "新钱既行，轻重得宜，商贾辐辏，市易复通，钱荒渐解。泉货流转如血脉贯通，四方百货云集京师，一片兴旺气象。"
 guanzhi_court.1379.o0:0 "I see."
 guanzhi_court.1379.t:0 "币制大乱"
 guanzhi_court.1379.desc:0 "币制一改再改，钱滥物贵，市肆昼闭，持钱者买不到米，有米者不肯收钱。民怨沸腾，谣诼四起，皆言朝廷以空文夺民财。"
 guanzhi_court.1380.o0:0 "I see."
 guanzhi_court.1380.t:0 "复归旧制"
 guanzhi_court.1380.desc:0 "新令尽罢，一切复归旧钱旧制。市肆渐渐复业，人心稍安，然钱荒之根未除，不过回到从前将就得过的日子。"
 guanzhi_court.1381.o0:0 "功是功，过是过，下狱勘问"
 guanzhi_court.1381.o1:0 "念其旧功，令其退赃自赎"
 guanzhi_court.1381.o2:0 "压下此案，保全老臣体面"
 guanzhi_court.1381.t:0 "贪墨案发"
 guanzhi_court.1381.desc:0 "御史台急奏：查得[guanzhi_official.GetTitledFirstName]历年侵吞官帑、受纳贿赂，赃累巨万，簿册俱在。此人乃是两朝旧臣，曾随先帝经略四方，功绩彪炳。如今铁证当前，念旧功否？"
 guanzhi_court.1382.o0:0 "国法无私，依律处斩"
 guanzhi_court.1382.o1:0 "免死削籍，赃物入官"
 guanzhi_court.1382.t:0 "赃证确凿"
 guanzhi_court.1382.desc:0 "廷尉勘问月余，赃银起获入库，珠玉田契充栋。[guanzhi_official.GetTitledFirstName]伏地无言，唯以先帝旧恩为请。朝中百官屏息，静观朕如何处断。"
 guanzhi_court.1383.o0:0 "穷治到底，一一查证"
 guanzhi_court.1383.o1:0 "罪止其身，余皆不问"
 guanzhi_court.1383.t:0 "狱中攀咬"
 guanzhi_court.1383.desc:0 "狱中方急，[guanzhi_official.GetTitledFirstName]为求活命，供词牵连朝臣十余人，有真有伪，一时难辨。若穷治之，恐朝堂为之一空；若不治，又恐纵奸。"
 guanzhi_court.1384.o0:0 "I see."
 guanzhi_court.1384.t:0 "输财自赎"
 guanzhi_court.1384.desc:0 "[guanzhi_official.GetTitledFirstName]尽散家财退赃，数目竟逾所劾。其人在衙理事愈发谨小慎微，朝臣亦多称朕宽仁。"
 guanzhi_court.1385.o0:0 "朕的好意被当成了驴肝肺，拿问！"
 guanzhi_court.1385.o1:0 "再给他最后一次机会"
 guanzhi_court.1385.t:0 "故态复萌"
 guanzhi_court.1385.desc:0 "退赃未久，御史再奏：[guanzhi_official.GetTitledFirstName]自恃朕宽，复伸贪手，且扬言'陛下念旧，不足惧也'。满朝侧目。"
 guanzhi_court.1386.o0:0 "为平民愤，重开勘问"
 guanzhi_court.1386.o1:0 "朕意已决，谁再妄议，罚俸"
 guanzhi_court.1386.t:0 "物议沸腾"
 guanzhi_court.1386.desc:0 "压案之事终究走漏。台谏交章弹劾，清议汹汹：陛下曲庇旧臣，国法何在？连市井之间也有了歌谣。"
 guanzhi_court.1387.o0:0 "I see."
 guanzhi_court.1387.t:0 "法度渐弛"
 guanzhi_court.1387.desc:0 "此案高高举起、轻轻放下，百官看在眼里。自此中外衙署，侵吞克扣之事日多，法度渐成空文。"
 guanzhi_court.1388.o0:0 "I see."
 guanzhi_court.1388.t:0 "明正典刑"
 guanzhi_court.1388.desc:0 "[guanzhi_official.GetTitledFirstName]弃市之日，观者塞途。朕下诏：功过不相掩，国法无亲疏。贪墨之风，一时敛迹。"
 guanzhi_court.1389.o0:0 "I see."
 guanzhi_court.1389.t:0 "功过两论"
 guanzhi_court.1389.desc:0 "[guanzhi_official.GetTitledFirstName]解印归田，赃赀充公。史臣书曰：念功而不废法，贷死而不恕罪，处置得中。"
 guanzhi_court.1390.o0:0 "I see."
 guanzhi_court.1390.t:0 "株连之祸"
 guanzhi_court.1390.desc:0 "穷治数月，贬逐者累累，衙署几空。贪风虽戢，然人人自危，办事唯求无过，再无人敢担当了。"
 guanzhi_court.1391.o0:0 "命御史台暗中访查，拿到实据"
 guanzhi_court.1391.o1:0 "即刻锁拿，突击审问"
 guanzhi_court.1391.o2:0 "或是流言，申饬几句便罢"
 guanzhi_court.1391.t:0 "鬻爵之闻"
 guanzhi_court.1391.desc:0 "密报入奏：近日外官迁转颇为蹊跷，数名贵无能名之人骤得美缺，皆曾重金出入[guanzhi_official.GetTitledFirstName]之门。卖官鬻爵，货赂公行，选政几成市道。"
 guanzhi_court.1392.o0:0 "按册拿人，一个不漏"
 guanzhi_court.1392.o1:0 "只诛首恶，账册焚毁"
 guanzhi_court.1392.t:0 "账册现形"
 guanzhi_court.1392.desc:0 "暗访两月，御史竟抄出一本私账：某官若干金，某职若干缗，价目分明，经手画押历历在目。朝中牵连之重，远超朕的预料。"
 guanzhi_court.1393.o0:0 "越是回护，越要查个明白"
 guanzhi_court.1393.o1:0 "牵一发而动全身，收手罢"
 guanzhi_court.1393.t:0 "说客盈门"
 guanzhi_court.1393.desc:0 "访查风声走漏，朝中重臣纷纷入见，或言[guanzhi_official.GetTitledFirstName]素来廉谨，或劝朕勿因细故动摇老臣。话里话外，皆是回护之意。"
 guanzhi_court.1394.o0:0 "败坏选政，斩！"
 guanzhi_court.1394.o1:0 "流徙远方，籍没家产"
 guanzhi_court.1394.t:0 "人赃并获"
 guanzhi_court.1394.desc:0 "突审之下，门吏先溃，供出纳贿簿籍藏于地窖。起获之日，金锭之上竟还烙着纳贿者的名号。[guanzhi_official.GetTitledFirstName]面如死灰。"
 guanzhi_court.1395.o0:0 "温旨抚慰，恢复其名"
 guanzhi_court.1395.o1:0 "无风不起浪，外放了事"
 guanzhi_court.1395.t:0 "空劳一遭"
 guanzhi_court.1395.desc:0 "突审无所获，府中抄检亦无赃证。[guanzhi_official.GetTitledFirstName]伏阙喊冤，百官多有附和，言朕轻信谗言、轻辱大臣。"
 guanzhi_court.1396.o0:0 "再不整饬，国将不国，彻查！"
 guanzhi_court.1396.o1:0 "水至清则无鱼，随他去罢"
 guanzhi_court.1396.t:0 "选政大坏"
 guanzhi_court.1396.desc:0 "朕未深究，卖官之风愈炽。如今州县之缺，不问贤否，先问价码。寒窗之士仕进无门，膏粱纨绔弹冠相庆。"
 guanzhi_court.1397.o0:0 "I see."
 guanzhi_court.1397.t:0 "仕途成市"
 guanzhi_court.1397.desc:0 "鬻爵之风终不可遏。吏部堂上，俨然牙行；除目一下，价随缺转。天下读书人之心，渐渐冷了。"
 guanzhi_court.1398.o0:0 "I see."
 guanzhi_court.1398.t:0 "选曹之狱"
 guanzhi_court.1398.desc:0 "诏狱既兴，按册收捕者数十人，选曹为之一空。经此一番，铨选肃然，然朝中亦是人人惴惴，唯恐名在册中。"
 guanzhi_court.1399.o0:0 "I see."
 guanzhi_court.1399.t:0 "首恶既除"
 guanzhi_court.1399.desc:0 "[guanzhi_official.GetTitledFirstName]去官之日，朕下诏申严铨选之制，受贿与行贿同罪。选政为之一清，士论称快。"
 guanzhi_court.1400.o0:0 "I see."
 guanzhi_court.1400.t:0 "事过无痕"
 guanzhi_court.1400.desc:0 "一场风波，查无实据而散。朕温旨慰勉，[guanzhi_official.GetTitledFirstName]感激涕零。只是那鬻爵的传闻，从此再无人敢提了。"
 guanzhi_court.1401.o0:0 "边军在吃土，他在起高楼？拿问！"
 guanzhi_court.1401.o1:0 "先封存账册，查明来龙去脉"
 guanzhi_court.1401.o2:0 "勒令其即刻补足亏空，免于追究"
 guanzhi_court.1401.t:0 "军帑亏空"
 guanzhi_court.1401.desc:0 "兵部核查边军粮饷，亏空竟逾十万缗。追查之下，款项竟流入京中一处营建工地——[guanzhi_official.GetTitledFirstName]正在起造的私宅园林，飞檐画栋，僭拟王侯。"
 guanzhi_court.1402.o0:0 "功不抵罪，依律重处"
 guanzhi_court.1402.o1:0 "姑念边功，削职补帑"
 guanzhi_court.1402.t:0 "边讯汹汹"
 guanzhi_court.1402.desc:0 "拿问之旨传到军中，边卒闻之无不称快，旧日怨声稍息。然[guanzhi_official.GetTitledFirstName]在军中旧部颇多，已有人上书为其诉功，言其督师有劳，一时之过。"
 guanzhi_court.1403.o0:0 "军国为重，先拨内帑充饷，事后再算"
 guanzhi_court.1403.o1:0 "军法如山，边情再急也要先正典刑"
 guanzhi_court.1403.t:0 "边报骤至"
 guanzhi_court.1403.desc:0 "屋漏偏逢连夜雨。拿问方下，边报骤至：敌骑犯塞，而军中粮饷不继，已有士卒哗变之兆。满朝目光齐聚御座——此时追责，还是先用兵？"
 guanzhi_court.1404.o0:0 "连窝端掉，重塑度支"
 guanzhi_court.1404.o1:0 "惩主谋、宽胁从，限期补帑"
 guanzhi_court.1404.t:0 "窝案连环"
 guanzhi_court.1404.desc:0 "账册封存细查，挪用并非一人一手：度支核准、转运经手、库吏销账，层层都有人情。主谋虽在[guanzhi_official.GetTitledFirstName]，从者竟遍诸曹。"
 guanzhi_court.1405.o0:0 "人证没了物证在，查封私宅抵充军帑"
 guanzhi_court.1405.o1:0 "死无对证，朕咽不下这口气，穷追！"
 guanzhi_court.1405.t:0 "账毁人亡"
 guanzhi_court.1405.desc:0 "查账的旨意未下，度支衙门竟走水，账册焚毁大半，经手库吏暴毙于家中。朝中议论纷纷，皆言是灭口。唯独营建的宅子，还立在那里。"
 guanzhi_court.1406.o0:0 "欺君罔上，至此极矣，收监！"
 guanzhi_court.1406.o1:0 "账目既平，下不为例"
 guanzhi_court.1406.t:0 "面补暗侵"
 guanzhi_court.1406.desc:0 "[guanzhi_official.GetTitledFirstName]表上补足亏空，边饷如数发下。然御史再查，所谓补足之款，竟是从另一处赈项里挪来的。拆东墙补西墙，账目越补越乱。"
 guanzhi_court.1407.o0:0 "I see."
 guanzhi_court.1407.t:0 "军法昭然"
 guanzhi_court.1407.desc:0 "诏下：挪用军帑，罪同误国。[guanzhi_official.GetTitledFirstName]锒铛入狱，园林充公，改建营房。边军闻之，士气为之一振。"
 guanzhi_court.1408.o0:0 "I see."
 guanzhi_court.1408.t:0 "以宅抵帑"
 guanzhi_court.1408.desc:0 "私宅查封估价，作价抵充军帑。[guanzhi_official.GetTitledFirstName]解职归田。营建半成的园林，就此成了军中学舍，时人传为笑谈。"
 guanzhi_court.1409.o0:0 "I see."
 guanzhi_court.1409.t:0 "账目暂平"
 guanzhi_court.1409.desc:0 "亏空表面上填平了，边事也应付过去了。只是经手的人心里都清楚：这笔账，不过是换了个名目挂着。度支之弊，积重难返。"
 guanzhi_court.1410.o0:0 "I see."
 guanzhi_court.1410.t:0 "大索诸曹"
 guanzhi_court.1410.desc:0 "穷追之下，贬逐收捕者数十人，度支、转运两司几乎换了个遍。军帑追回了大半，可朝中办事的人手，也跟着去了大半。"
 guanzhi_court.1411.o0:0 "派钦差微服赴灾区核实"
 guanzhi_court.1411.o1:0 "即刻锁拿督办，当堂对账"
 guanzhi_court.1411.o2:0 "灾重事繁，先添粮再查账"
 guanzhi_court.1411.t:0 "赈粮不继"
 guanzhi_court.1411.desc:0 "大灾之后，朕发内帑漕粮五十万石赈济。然流民使者回奏：灾民所得，十不存三。层层过手，处处克扣。督办赈务的[guanzhi_official.GetTitledFirstName]，报上的账却是颗粒归仓。"
 guanzhi_court.1412.o0:0 "吸民髓以自肥，与杀人何异？严办！"
 guanzhi_court.1412.o1:0 "追回赃款，即刻再赈，从宽发落"
 guanzhi_court.1412.t:0 "白骨露野"
 guanzhi_court.1412.desc:0 "钦差微服归来，伏地痛哭：灾区粥厂米汤可鉴人影，道旁饿殍相望，而官仓之粟竟转运出粜，价入私囊。赃银流向，直指督办衙署。"
 guanzhi_court.1413.o0:0 "法不责众？朕偏要责众！"
 guanzhi_court.1413.o1:0 "惩督办以谢灾民，余者训诫"
 guanzhi_court.1413.t:0 "账外之账"
 guanzhi_court.1413.desc:0 "钦差查得实情：克扣确有，但大头并非督办所吞——各州县以'赈灾耗费'为名截留者十之七八，上行下效，已成惯例。[guanzhi_official.GetTitledFirstName]亦不过是随大流。"
 guanzhi_court.1414.o0:0 "打入大牢，追赃赈民"
 guanzhi_court.1414.o1:0 "限三日补足，戴罪赈灾"
 guanzhi_court.1414.t:0 "对账穿帮"
 guanzhi_court.1414.desc:0 "当堂对账，户部原册与赈区回执数目凿枘不合。[guanzhi_official.GetTitledFirstName]汗如雨下，支吾不能对。堂下灾民代表哭声一片。"
 guanzhi_court.1415.o0:0 "狡辩！制有弊，尔就顺竿爬？"
 guanzhi_court.1415.o1:0 "其言虽狡，制弊亦真，着议改赈法"
 guanzhi_court.1415.t:0 "反唇相讥"
 guanzhi_court.1415.desc:0 "[guanzhi_official.GetTitledFirstName]不但不认罪，反呈上一沓文书：沿途驿站支应、官吏夫马耗费皆有定额，账目'亏空'乃是制度使然。言下之意，是朝廷的赈制本身行不通。"
 guanzhi_court.1416.o0:0 "雷霆手段，赈务、民变一并处置"
 guanzhi_court.1416.o1:0 "换可靠之人总理赈务，既往不咎"
 guanzhi_court.1416.t:0 "添油救火"
 guanzhi_court.1416.desc:0 "朕添拨的二十万石也如泥牛入海。灾区盗贼蜂起，民变已有燎原之势。御史弹章雪片般飞来：再不追责，恐失天下之望。"
 guanzhi_court.1417.o0:0 "I see."
 guanzhi_court.1417.t:0 "赃款归仓"
 guanzhi_court.1417.desc:0 "赃银追回之日，朕命即于灾区设厂放赈，并遣使宣谕：吞赈者虽远必追。灾民焚香北拜，民变之焰，竟不扑自熄。"
 guanzhi_court.1418.o0:0 "I see."
 guanzhi_court.1418.t:0 "一人伏辜"
 guanzhi_court.1418.desc:0 "[guanzhi_official.GetTitledFirstName]革职拿问，余党一概不问。灾民得了交代，百官松了口气。只是那'截留'的惯例，依然在衙署之间悄悄流转。"
 guanzhi_court.1419.o0:0 "I see."
 guanzhi_court.1419.t:0 "更张赈制"
 guanzhi_court.1419.desc:0 "朕下诏更定赈法：粮不过手、直达灾县，监赈使巡行考核。新制初行，弊端稍戢。史臣曰：惩一人不如立一法。"
 guanzhi_court.1420.o0:0 "I see."
 guanzhi_court.1420.t:0 "霹雳手段"
 guanzhi_court.1420.desc:0 "严查与平乱并举，收捕贪吏数十，民变亦被压服。灾区总算安定下来，然经此一番，府库一空，民心之伤，非一日可愈。"
 guanzhi_court.1421.o0:0 "冤案必雪，即刻重审"
 guanzhi_court.1421.o1:0 "先密查当年伪证出自谁手"
 guanzhi_court.1421.o2:0 "案已多年，何必再翻旧账"
 guanzhi_court.1421.t:0 "旧案疑云"
 guanzhi_court.1421.desc:0 "大理寺整理陈年卷宗，发现数年前一桩谋逆案证据前后抵牾，当年'铁证'竟是伪造。蒙冤者早已瘐死狱中，而当年主审定谳之人，正是如今位极人臣的[guanzhi_official.GetTitledFirstName]。"
 guanzhi_court.1422.o0:0 "为蒙冤者昭雪追复，主审者抵罪"
 guanzhi_court.1422.o1:0 "昭雪可以，但[guanzhi_official.GetTitledFirstName]是国之柱石，不可动"
 guanzhi_court.1422.t:0 "沉冤得雪"
 guanzhi_court.1422.desc:0 "重审之下，伪证桩桩坐实：所谓通敌书信，笔迹出自幕客；所谓同谋口供，皆是拷掠而成。当年一桩'铁案'，从头至尾都是罗织。"
 guanzhi_court.1423.o0:0 "朕亲揽此案，谁阻拦谁同罪"
 guanzhi_court.1423.o1:0 "众怒难犯，复审就此打住"
 guanzhi_court.1423.t:0 "反扑汹汹"
 guanzhi_court.1423.desc:0 "重审的风声传出，[guanzhi_official.GetTitledFirstName]一党群起反扑：或言蒙冤者家属图谋翻案敲诈，或言大理寺轻启旧狱动摇国本，弹章反将复审官围了个严实。"
 guanzhi_court.1424.o0:0 "构陷忠良，十恶不赦，收捕！"
 guanzhi_court.1424.o1:0 "握此把柄，使其为己所用"
 guanzhi_court.1424.t:0 "伪证之源"
 guanzhi_court.1424.desc:0 "密查数月，伪证的来路水落石出：当年为夺蒙冤者之位，[guanzhi_official.GetTitledFirstName]指使幕客伪造书信，更买通狱吏伪作口供。一桩冤狱，竟是场蓄意的构陷。"
 guanzhi_court.1425.o0:0 "纵无铁证，朕心已明，照样问罪"
 guanzhi_court.1425.o1:0 "无凭无据，奈何奈何"
 guanzhi_court.1425.t:0 "先手灭迹"
 guanzhi_court.1425.desc:0 "密查竟被察觉。当年经手的狱吏或暴卒或远遁，伪证原稿也已'失火'焚毁。朕手里的，只剩一叠抵牾的卷宗，和一个死无对证的僵局。"
 guanzhi_court.1426.o0:0 "民心不可违，重审！"
 guanzhi_court.1426.o1:0 "好言抚慰，赐金遣归，案子不提"
 guanzhi_court.1426.t:0 "登闻鼓响"
 guanzhi_court.1426.desc:0 "朕将此事压下，蒙冤者的老母却携孙跪于宫门，击登闻鼓鸣冤，血泪控诉，三日不去。围观百姓数以千计，京中议论鼎沸。"
 guanzhi_court.1427.o0:0 "I see."
 guanzhi_court.1427.t:0 "冤沉旧牍"
 guanzhi_court.1427.desc:0 "翻案之事终归沉寂。蒙冤者的名字，静静躺在落灰的卷宗里。只是每逢阴雨，京中老人还会讲起那年狱中的哭声。"
 guanzhi_court.1428.o0:0 "I see."
 guanzhi_court.1428.t:0 "雪冤正刑"
 guanzhi_court.1428.desc:0 "诏下：为蒙冤者追复原官、厚恤其家，[guanzhi_official.GetTitledFirstName]以故入人罪论抵。昭雪之日，其老母捧诏北向而哭，观者无不垂泪。"
 guanzhi_court.1429.o0:0 "I see."
 guanzhi_court.1429.t:0 "半面公道"
 guanzhi_court.1429.desc:0 "冤者昭雪，家属得恤，而主审之人依旧安居其位。朝野私语：陛下还了死人公道，却欠了活人一个说法。"
 guanzhi_court.1430.o0:0 "I see."
 guanzhi_court.1430.t:0 "隐棋一枚"
 guanzhi_court.1430.desc:0 "那叠卷宗被朕锁入内库。[guanzhi_official.GetTitledFirstName]自此对朕俯首帖耳，言听计从。只是午夜梦回，朕偶尔会想起狱中那个没能等到天亮的人。"
 guanzhi_court.1431.o0:0 "谏官再争，一并杖之！"
 guanzhi_court.1431.o1:0 "且押下，容朕三思"
 guanzhi_court.1431.o2:0 "收回成命，改为罚俸"
 guanzhi_court.1431.t:0 "雷霆之怒"
 guanzhi_court.1431.desc:0 "廷议之上，[guanzhi_official.GetTitledFirstName]当面顶撞，言辞激烈，几不留君臣体面。朕勃然大怒，喝令：廷杖四十！左右谏官大惊，纷纷出列，叩首死争。"
 guanzhi_court.1432.o0:0 "厚葬之，朕不罪其言"
 guanzhi_court.1432.o1:0 "狂悖之徒，死不足惜"
 guanzhi_court.1432.t:0 "杖下殒命"
 guanzhi_court.1432.desc:0 "廷杖之下，[guanzhi_official.GetTitledFirstName]竟气绝于丹墀。血染玉阶，百官相顾失色。谏官伏尸痛哭，声彻殿宇。朕握着杖旨的手，微微发凉。"
 guanzhi_court.1433.o0:0 "传太医急救，杖责之令就此作罢"
 guanzhi_court.1433.o1:0 "抬出去！朕的廷杖，还轮不到他人置喙"
 guanzhi_court.1433.t:0 "以死相争"
 guanzhi_court.1433.desc:0 "杖责方毕，首争的谏官竟以头触柱，血流披面，言'陛下杖杀直臣之日，即社稷蒙尘之时'。满殿死寂，只余柱上血迹斑斑。"
 guanzhi_court.1434.o0:0 "召其入宫，当面论个是非曲直"
 guanzhi_court.1434.o1:0 "死罪可免，活罪难逃，贬为外官"
 guanzhi_court.1434.t:0 "怒意渐消"
 guanzhi_court.1434.desc:0 "数日之间，朕静心思之：其言虽逆耳，所指未必无据。若因一言杖责大臣，恐寒了天下敢言之人的心。"
 guanzhi_court.1435.o0:0 "从善如流，下诏纳之"
 guanzhi_court.1435.o1:0 "清议汹汹，朕偏不吃这一套"
 guanzhi_court.1435.t:0 "伏阙不止"
 guanzhi_court.1435.desc:0 "朕虽暂缓廷杖，谏官们却不肯罢休：今日一拨伏阙，明日一拨上疏，非要朕明诏收回成命、褒奖直臣。言辞之间，已隐隐有挟清议以迫君上之意。"
 guanzhi_court.1436.o0:0 "I see."
 guanzhi_court.1436.t:0 "各退一步"
 guanzhi_court.1436.desc:0 "廷杖改为罚俸，[guanzhi_official.GetTitledFirstName]上表谢罪，谏官亦称颂圣明。一场风波，就此消弭于无形。"
 guanzhi_court.1437.o0:0 "I see."
 guanzhi_court.1437.t:0 "雷霆雨露"
 guanzhi_court.1437.desc:0 "一番雷霆之后，终归雨露。[guanzhi_official.GetTitledFirstName]感念再生，谏诤愈发恳切而讲究分寸。史臣笔曰：君能容直，臣敢尽言，朝堂之幸。"
 guanzhi_court.1438.o0:0 "I see."
 guanzhi_court.1438.t:0 "朝堂噤声"
 guanzhi_court.1438.desc:0 "自此之后，廷议之上再无逆耳之言。百官奏对，皆先揣朕意。大殿之中一片颂声，朕却偶尔觉得，这安静有些吓人。"
 guanzhi_court.1439.o0:0 "I see."
 guanzhi_court.1439.t:0 "出为外官"
 guanzhi_court.1439.desc:0 "[guanzhi_official.GetTitledFirstName]束装出京之日，同僚相送者寥寥。廷杖虽未加身，满朝都已读懂了朕的意思：廷争可以，逾矩不行。"
 guanzhi_court.1441.o0:0 "新朝新气象，普天同赦"
 guanzhi_court.1441.o1:0 "赦轻罪而不赦重囚，折中行之"
 guanzhi_court.1441.o2:0 "刑官之言有理，此番不赦"
 guanzhi_court.1441.t:0 "恩典之议"
 guanzhi_court.1441.desc:0 "新皇践祚，礼部援例奏请大赦天下，以示新朝恩典。刑部尚书[guanzhi_official.GetTitledFirstName]却独持异议：今盗贼未靖、猾吏未惩，滥赦恐纵虎归山。赦与不赦，廷议不决。"
 guanzhi_court.1442.o0:0 "I see."
 guanzhi_court.1442.t:0 "图圄一空"
 guanzhi_court.1442.desc:0 "赦书既下，天下图圄为之一空。囚犯归家，骨肉团圆，道旁焚香颂圣者相望。连青楼酒肆之中，传唱的都是新皇仁德。"
 guanzhi_court.1443.o0:0 "命有司严缉再犯者，从重论处"
 guanzhi_court.1443.o1:0 "赦令已出，覆水难收，奈何"
 guanzhi_court.1443.t:0 "纵虎归山"
 guanzhi_court.1443.desc:0 "赦书一下，狱中巨盗悍吏尽出。不出数月，数郡盗案复起，苦主伏阙哭诉：昨日害我满门之人，今日竟与我同街而行。"
 guanzhi_court.1444.o0:0 "I see."
 guanzhi_court.1444.t:0 "宽猛相济"
 guanzhi_court.1444.desc:0 "赦书颁下：徒流以下咸赦，谋逆、强盗、贪赃不赦。民间得沐恩典者数万，而重囚依旧伏法。朝野皆称处置得宜，[guanzhi_official.GetTitledFirstName]亦上表称善。"
 guanzhi_court.1445.o0:0 "朕亲定条目，三日颁行"
 guanzhi_court.1445.o1:0 "争而不决，索性从宽"
 guanzhi_court.1445.t:0 "轻重之界"
 guanzhi_court.1445.desc:0 "折中之议既定，刑部与大礼官却为界限吵作一团：赃吏何额以上不赦？劫案何情之下可原？条目屡易，赦书迟迟不能颁行，狱中人犯家属望眼欲穿。"
 guanzhi_court.1446.o0:0 "法者天下之平，朕不沽名"
 guanzhi_court.1446.o1:0 "罢了，改降德音，赦轻罪"
 guanzhi_court.1446.t:0 "新恩未洽"
 guanzhi_court.1446.desc:0 "不赦之旨既下，狱中家属聚于京兆府外啼哭，民间亦有怨言：新皇登基，竟无一毫恩典及于小民。连几位老臣都上表婉转相劝。"
 guanzhi_court.1447.o0:0 "I see."
 guanzhi_court.1447.t:0 "恩威并著"
 guanzhi_court.1447.desc:0 "再犯者从重论处之令一下，出狱之人无不凛凛自守。民间称颂：新皇有菩萨心肠，亦有霹雳手段。"
 guanzhi_court.1448.o0:0 "I see."
 guanzhi_court.1448.t:0 "姑息之讥"
 guanzhi_court.1448.desc:0 "再犯之案终是不了了之。清议讥之：赦书墨沈未干，而盗已横行。新朝的恩典，成了法度上的一道口子。"
 guanzhi_court.1449.o0:0 "I see."
 guanzhi_court.1449.t:0 "持法不阿"
 guanzhi_court.1449.desc:0 "朕终不行赦。刑官称善，谓此真治世之君；民间虽有小怨，而吏治肃然。史臣书曰：不市恩而天下服其平。"
 guanzhi_court.1451.o0:0 "下诏核查中旨真伪"
 guanzhi_court.1451.o1:0 "既已成命，姑且追认"
 guanzhi_court.1451.o2:0 "内侍敢尔？收付有司穷治"
 guanzhi_court.1451.t:0 "中旨之疑"
 guanzhi_court.1451.desc:0 "吏部密奏：新除[guanzhi_official.GetTitledFirstName]之职，与廷议所拟不合，乃有宦官夜至吏部，口宣'中旨'强令改注。然朕实未尝降此旨。矫诏之渐，岂可不慎？"
 guanzhi_court.1452.o0:0 "念其不知情，留任不究"
 guanzhi_court.1452.o1:0 "矫诏之除岂可承认？一并罢黜"
 guanzhi_court.1452.t:0 "矫诏得实"
 guanzhi_court.1452.desc:0 "核验月余，事果得实：宦官受人之金，伪传旨意。[guanzhi_official.GetTitledFirstName]闻讯惶惧，免冠待罪于阙下，口称实不知情。"
 guanzhi_court.1453.o0:0 "水太深了，就此罢手"
 guanzhi_court.1453.o1:0 "越是遮掩，越要查到底"
 guanzhi_court.1453.t:0 "查无实证"
 guanzhi_court.1453.desc:0 "传旨宦官已暴毙于狱中，死无对证。吏部上下皆言记不清了，案子悬在半空。朝中窃议：是谁能令一介阉竖无声无息地死去？"
 guanzhi_court.1454.o0:0 "此风断不可长，痛加裁抑"
 guanzhi_court.1454.o1:0 "宫中乏人使唤，姑且容之"
 guanzhi_court.1454.t:0 "阉竖得志"
 guanzhi_court.1454.desc:0 "朕既追认，宦官辈气焰日盛。如今除授迁转，多先行于中官之家，而后方下明诏。百官求进者，竟以宦者之门为捷径。"
 guanzhi_court.1455.o0:0 "顺乎清议，罢此除授"
 guanzhi_court.1455.o1:0 "朕命即天命，何恤浮言"
 guanzhi_court.1455.t:0 "物议沸腾"
 guanzhi_court.1455.desc:0 "追认之命一下，台谏交章论列，皆云'中旨斜封，乱政之渐'。[guanzhi_official.GetTitledFirstName]到任未久，已为清议所不容，坐立难安。"
 guanzhi_court.1456.o0:0 "枭首示众，以清宫禁"
 guanzhi_court.1456.o1:0 "家丑不可外扬，赐死狱中"
 guanzhi_court.1456.t:0 "穷治得情"
 guanzhi_court.1456.desc:0 "严刑之下，宦官尽吐其实：受人重贿，伪传中旨，前后已非一次。牵涉之广，令朕心惊。主谋阉竖已在槛车之中，候旨发落。"
 guanzhi_court.1457.o0:0 "法不阿贵，一体穷治"
 guanzhi_court.1457.o1:0 "罪止首恶，余皆不问"
 guanzhi_court.1457.t:0 "牵连掖庭"
 guanzhi_court.1457.desc:0 "狱辞渐深，竟牵连后宫嫔御与数名贵近。若再穷治，宫闱之内恐无宁日；若就此罢手，则前功尽弃。左右皆劝朕三思。"
 guanzhi_court.1458.o0:0 "I see."
 guanzhi_court.1458.t:0 "宫禁肃然"
 guanzhi_court.1458.desc:0 "首恶伏诛，阉竖辈股栗屏气，中旨之弊一时绝迹。百官闻之，皆称圣明。唯宫中行事，从此多了几分森冷之气。"
 guanzhi_court.1459.o0:0 "I see."
 guanzhi_court.1459.t:0 "晦暗收场"
 guanzhi_court.1459.desc:0 "此事终究不了了之。除授如旧，阉竖如旧，只是朝臣们心里都明白了一件事：有些旨意，未必出自圣裁。"
 guanzhi_court.1461.o0:0 "舅氏之面，不好驳他，准了"
 guanzhi_court.1461.o1:0 "官爵乃天下公器，婉言拒之"
 guanzhi_court.1461.o2:0 "授一闲曹，两全其美"
 guanzhi_court.1461.t:0 "椒房之请"
 guanzhi_court.1461.desc:0 "国舅入宫请见，寒暄数语，忽为[guanzhi_official.GetTitledFirstName]求一美缺，言其'实为俊才，屈居下僚可惜'。言辞恳切，又隐隐以皇后为言。朕一时沉吟未答。"
 guanzhi_court.1462.o0:0 "传谕切责舅氏，杜塞请谒"
 guanzhi_court.1462.o1:0 "骨肉至亲，何必苛责"
 guanzhi_court.1462.t:0 "外戚骄纵"
 guanzhi_court.1462.desc:0 "自从徇了舅氏之情，外戚请托纷至沓来，门前求官者络绎不绝。今日[guanzhi_official.GetTitledFirstName]又升迁了，朝中已有'宁登舅氏之门，不入考功之籍'的民谣。"
 guanzhi_court.1463.o0:0 "I see."
 guanzhi_court.1463.t:0 "人地相宜"
 guanzhi_court.1463.desc:0 "谁料[guanzhi_official.GetTitledFirstName]到任之后，厘革宿弊，颇有能名，竟是个人才。举主是国舅这件事，渐渐无人再提起了。朕也算是误打误撞，得了一员干吏。"
 guanzhi_court.1464.o0:0 "赐金帛珍玩，好言抚慰"
 guanzhi_court.1464.o1:0 "外戚岂可挟私干政？传谕申饬"
 guanzhi_court.1464.t:0 "后宫怨望"
 guanzhi_court.1464.desc:0 "拒绝国舅之事传入后宫，皇后数日不言，国舅称病不朝。外间已有议论，说朕薄待戚里，不念旧恩。"
 guanzhi_court.1465.o0:0 "I see."
 guanzhi_court.1465.t:0 "朝野称善"
 guanzhi_court.1465.desc:0 "朕谢绝请托之事不胫而走，士大夫交口称颂，谓朕不以私恩废公义。四方求仕者闻风自励，皆言但当力学，不必奔竞。"
 guanzhi_court.1466.o0:0 "I see."
 guanzhi_court.1466.t:0 "闲曹自适"
 guanzhi_court.1466.desc:0 "[guanzhi_official.GetTitledFirstName]得了个有名无实的闲职，倒也安分。国舅面子上过得去，朝廷的规矩也没坏。只是清议嫌朕和稀泥，到底落了个'优容戚里'的名声。"
 guanzhi_court.1467.o0:0 "再徇一次，下不为例"
 guanzhi_court.1467.o1:0 "前番已给足颜面，此番断不可许"
 guanzhi_court.1467.t:0 "得陇望蜀"
 guanzhi_court.1467.desc:0 "闲职未满一年，国舅又来请托，说[guanzhi_official.GetTitledFirstName]'久居散地，非待才之道'。看来朕的退让，只喂大了胃口。"
 guanzhi_court.1468.o0:0 "I see."
 guanzhi_court.1468.t:0 "戚里之患"
 guanzhi_court.1468.desc:0 "请托之门一开，便再难关上。如今戚里宾客布列朝端，考功黜陟几成虚文。史臣援笔，已在'外戚'传上添了一笔。"
 guanzhi_court.1469.o0:0 "I see."
 guanzhi_court.1469.t:0 "宫闱生隙"
 guanzhi_court.1469.desc:0 "申饬之谕既出，外戚敛迹，请托顿绝。只是皇后自此与朕有了隔阂，椒房之内，再无往日的笑语。公义与私情，终究难以两全。"
 guanzhi_court.1471.o0:0 "妇人岂可预闻政事？温言止之"
 guanzhi_court.1471.o1:0 "爱妃所荐，姑且用他一试"
 guanzhi_court.1471.o2:0 "明日即下明诏，拔擢此人"
 guanzhi_court.1471.t:0 "枕畔之言"
 guanzhi_court.1471.desc:0 "夜宴方阑，宠妃为朕添酒，忽款款言道：[guanzhi_official.GetTitledFirstName]才具过人，久沉下僚，陛下何不稍加拔擢？语笑温柔，却不像是无心之语。"
 guanzhi_court.1472.o0:0 "I see."
 guanzhi_court.1472.t:0 "贤妃知礼"
 guanzhi_court.1472.desc:0 "妃闻朕言，敛容谢罪，自此再不外预朝政。后宫诸嫔御闻之，亦皆谨守本分。此事传至外廷，台谏皆称宫闱肃清。"
 guanzhi_court.1473.o0:0 "是才当用，非因妃言，擢之"
 guanzhi_court.1473.o1:0 "终不叙用，以杜后宫之渐"
 guanzhi_court.1473.t:0 "失之东隅"
 guanzhi_court.1473.desc:0 "数月后朕细阅考绩，[guanzhi_official.GetTitledFirstName]课最连上，确有干济之才，与妃所言不虚。她虽越分进言，识人倒是准的。"
 guanzhi_court.1474.o0:0 "I see."
 guanzhi_court.1474.t:0 "不负所举"
 guanzhi_court.1474.desc:0 "[guanzhi_official.GetTitledFirstName]履新之后，剖决如流，果然称职。外廷初有微词，见其治绩，亦渐无话。只是朕心里总有一丝说不清的别扭。"
 guanzhi_court.1475.o0:0 "朕用人自有主张，责退言官"
 guanzhi_court.1475.o1:0 "收回成命，以息物议"
 guanzhi_court.1475.t:0 "外廷哗然"
 guanzhi_court.1475.desc:0 "升迁之旨方下，台谏弹章已至，劾[guanzhi_official.GetTitledFirstName]'因缘掖庭，夤缘而进'。朝野哄传此人是'裙带上来的官'，其本人亦愧愤欲辞。"
 guanzhi_court.1476.o0:0 "严诏：后宫干政者，罪无赦"
 guanzhi_court.1476.o1:0 "爱妃们高兴就好，随她们去"
 guanzhi_court.1476.t:0 "宫府渐通"
 guanzhi_court.1476.desc:0 "自朕下明诏拔擢，后宫诸妃竞相效仿，荐人者日众。大臣进退，渐有'宫闱一诺，重于制敕'之势。今日[guanzhi_official.GetTitledFirstName]又携重礼入宫谢恩了。"
 guanzhi_court.1477.o0:0 "给他们个台阶，改授此人外任"
 guanzhi_court.1477.o1:0 "廷杖！看他们还争不争"
 guanzhi_court.1477.t:0 "言官死争"
 guanzhi_court.1477.desc:0 "明诏既下，御史连章死争，伏阁不去，言'陛下以一女子之言乱朝廷名器'。前有贬责，后有继者，竟似与朕赌上了气。"
 guanzhi_court.1478.o0:0 "I see."
 guanzhi_court.1478.t:0 "宫闱肃清"
 guanzhi_court.1478.desc:0 "禁令既严，妃嫔屏息，大臣去就复归于庙堂公议。[guanzhi_official.GetTitledFirstName]凭本事升迁，再无人敢说闲话。"
 guanzhi_court.1479.o0:0 "I see."
 guanzhi_court.1479.t:0 "弃车保帅"
 guanzhi_court.1479.desc:0 "[guanzhi_official.GetTitledFirstName]灰头土脸地离开了朝廷。风波是平了，可人人都看清了：在朕这里，一个臣子的前程，敌不过一阵枕边风、几纸弹章。"
 guanzhi_court.1480.o0:0 "I see."
 guanzhi_court.1480.t:0 "妇寺之渐"
 guanzhi_court.1480.desc:0 "言路既塞，宫闱之权重于台阁。如今百官升迁，先问掖庭之意，再问庙堂之议。朕的朝廷，不知何时成了后妃的棋局。"
 guanzhi_court.1481.o0:0 "太子处事果敢，朕心甚慰"
 guanzhi_court.1481.o1:0 "更张太过，谕令太子改正"
 guanzhi_court.1481.o2:0 "两存其议，且待朕回銮裁断"
 guanzhi_court.1481.t:0 "监国更张"
 guanzhi_court.1481.desc:0 "朕巡幸在外，太子监国。未及两月，东宫连下数令：更钱法、易守令、停岁贡。老臣[guanzhi_official.GetTitledFirstName]驰奏行在，劾太子'轻变旧章，迹近专擅'。东宫官属亦上表，称老臣'沮格新政，掣肘储君'。"
 guanzhi_court.1482.o0:0 "亲书慰谕，朕还在，慌什么"
 guanzhi_court.1482.o1:0 "耆旧自扰，不必理会"
 guanzhi_court.1482.t:0 "老臣不安"
 guanzhi_court.1482.desc:0 "朕褒奖太子的旨意传回京师，[guanzhi_official.GetTitledFirstName]等一班老臣惶惶不安，或请告老，或杜门谢客。朝堂之上，竟隐隐有'一朝天子一朝臣'的私下议论。"
 guanzhi_court.1483.o0:0 "过界了。切责太子，收其除授之权"
 guanzhi_court.1483.o1:0 "终是储君，朕的江山早晚是他的"
 guanzhi_court.1483.t:0 "储君益专"
 guanzhi_court.1483.desc:0 "得太子褒谕之后，东宫更无忌惮，如今除授官员竟不俟奏报，先行注拟。[guanzhi_official.GetTitledFirstName]再上急奏，字里行间已见忧愤：'是天下有二主也！'"
 guanzhi_court.1484.o0:0 "I see."
 guanzhi_court.1484.t:0 "储君谢罪"
 guanzhi_court.1484.desc:0 "朕的谕旨一到，太子即日谢罪，尽罢新令，复旧章，待罪东宫读书。回銮之日，太子出郭迎驾，执礼甚恭。父子之间，嫌隙尽释。"
 guanzhi_court.1485.o0:0 "召太子入宫，父子把话说开"
 guanzhi_court.1485.o1:0 "防人之心不可无，简汰东宫官属"
 guanzhi_court.1485.t:0 "东宫怏怏"
 guanzhi_court.1485.desc:0 "太子奉诏改过，心中却怏怏不乐，东宫官属私下怨[guanzhi_official.GetTitledFirstName]'离间骨肉'。近来太子请安的疏表，字迹都冷淡了几分。"
 guanzhi_court.1486.o0:0 "回銮之日，当廷裁断是非"
 guanzhi_court.1486.o1:0 "各降手诏慰谕，都不许再争"
 guanzhi_court.1486.t:0 "两派相持"
 guanzhi_court.1486.desc:0 "朕迟迟不表态，朝中遂分两派：新进附东宫，言太子'英断有为'；耆旧附[guanzhi_official.GetTitledFirstName]，言'祖宗成法不可轻变'。朝堂之上，凡有议论，先问立场，后论是非。"
 guanzhi_court.1487.o0:0 "快刀斩乱麻，悉罢新令、斥退东宫用事者"
 guanzhi_court.1487.o1:0 "既成事实，下诏追认其半"
 guanzhi_court.1487.t:0 "政出多门"
 guanzhi_court.1487.desc:0 "朕的沉默被当成了默许。如今政令或出东宫，或出台省，臣下不知所从，奔走两府之间。等朕回銮时，朝局已是积重难返。"
 guanzhi_court.1488.o0:0 "I see."
 guanzhi_court.1488.t:0 "上下复一"
 guanzhi_court.1488.desc:0 "朕既表明心迹，老臣安位，储君知礼，两派之见渐消。一场监国风波，倒让太子学会了几分分寸，让老臣明白了几分时势。"
 guanzhi_court.1489.o0:0 "I see."
 guanzhi_court.1489.t:0 "党痕暗结"
 guanzhi_court.1489.desc:0 "风波表面上平息了，但'东宫党'与'旧臣党'的名目已在朝中扎了根。人人都把这笔账记着，只等朕百年之后，连本带利地清算。"
 guanzhi_court.1490.o0:0 "I see."
 guanzhi_court.1490.t:0 "储位生疑"
 guanzhi_court.1490.desc:0 "东宫官属一朝散尽，太子幽居读书，见了朕只是叩头，再不多言一句。父子之恩，自此隔了一层纱。宫中已开始有人揣摩：储位，怕是要变了。"
 guanzhi_court.1491.o0:0 "下其章于廷议，让百官评说"
 guanzhi_court.1491.o1:0 "留中不发，朕再想想"
 guanzhi_court.1491.o2:0 "折辱御史，以安重臣之心"
 guanzhi_court.1491.t:0 "初生之犊"
 guanzhi_court.1491.desc:0 "少年御史伏阙上章，劾头号权臣[guanzhi_official.GetTitledFirstName]十罪：专除授、鬻官爵、蔽言路、通贿赂……字字有据，满朝震动。弹章压在御案上，朕看了一夜。准，则朝廷失一柱石；不准，则言路寒心。"
 guanzhi_court.1492.o0:0 "顺势收其权柄，罢其政事"
 guanzhi_court.1492.o1:0 "念其旧劳，薄责数语了事"
 guanzhi_court.1492.t:0 "众矢之的"
 guanzhi_court.1492.desc:0 "廷议之日，平日受压的臣僚纷纷发难，你一言我一语，竟坐实了大半罪名。[guanzhi_official.GetTitledFirstName]立于朝班，面色灰败，再无往日颐指气使之态。"
 guanzhi_court.1493.o0:0 "他们不敢说，朕亲自来断"
 guanzhi_court.1493.o1:0 "罢了。收回弹章，只当无事"
 guanzhi_court.1493.t:0 "满堂缄默"
 guanzhi_court.1493.desc:0 "廷议之日，朕环视百官，问弹章所言是否属实。满堂文武，竟无一人敢答，皆俯首看笏。权势之可畏，一至於此！朕忽然觉得这座朝堂有些陌生。"
 guanzhi_court.1494.o0:0 "忠哉此子！即日穷治权臣"
 guanzhi_court.1494.o1:0 "沽名卖直之徒，廷杖逐出"
 guanzhi_court.1494.t:0 "以死争之"
 guanzhi_court.1494.desc:0 "弹章留中月余，那少年御史竟再上一疏，言：'臣头可断，此章不可留。陛下不斩奸臣，请先斩臣！'疏出，朝野传诵，人人都等着看朕如何收场。"
 guanzhi_court.1495.o0:0 "忍无可忍，收其权柄，召还御史"
 guanzhi_court.1495.o1:0 "动他不得，继续隐忍"
 guanzhi_court.1495.t:0 "投鼠忌器"
 guanzhi_court.1495.desc:0 "朕迟迟不表态，[guanzhi_official.GetTitledFirstName]愈发恣肆，竟将那御史寻了个错处贬出京去。满朝无人敢言。朕案头的弹章，墨迹都淡了。"
 guanzhi_court.1496.o0:0 "顺势转弯，重开廷议"
 guanzhi_court.1496.o1:0 "索性贬御史出京，一压到底"
 guanzhi_court.1496.t:0 "弹章外传"
 guanzhi_court.1496.desc:0 "朕折辱御史以安权臣，谁知弹章早已抄出宫外，市井传诵，茶馆酒肆皆言'权臣可劾，圣旨可议'。[guanzhi_official.GetTitledFirstName]的门生故吏四出弹压，反而越描越黑。"
 guanzhi_court.1497.o0:0 "I see."
 guanzhi_court.1497.t:0 "大厦既倾"
 guanzhi_court.1497.desc:0 "罢政之诏既下，[guanzhi_official.GetTitledFirstName]解印出朝，门生故吏星散。朕长舒了一口气，又隐隐觉得空落落的——这根柱子压了朕多年，拔掉之后，才知道朝堂上竟缺了这么大一块。"
 guanzhi_court.1498.o0:0 "I see."
 guanzhi_court.1498.t:0 "各留体面"
 guanzhi_court.1498.desc:0 "薄责数语，双方各留体面。权臣仍是权臣，御史升了一级调离言路。人人都说朕处置得'圆融'，只有朕自己知道，这不过把今天的事推到了明天。"
 guanzhi_court.1499.o0:0 "I see."
 guanzhi_court.1499.t:0 "言路寒心"
 guanzhi_court.1499.desc:0 "自此之后，台谏之言日稀，弹章皆成颂表。[guanzhi_official.GetTitledFirstName]的权势比从前更重了。偶有新人想上疏言事，老前辈只淡淡说一句：'记得那个少年御史么？'"
 guanzhi_court.1501.o0:0 "两皆不信，饬令和解共事"
 guanzhi_court.1501.o1:0 "借刀察人，先摸清[guanzhi_official.GetTitledFirstName]的底"
 guanzhi_court.1501.o2:0 "两贤相厄，朕之失也，各加慰谕"
 guanzhi_court.1501.t:0 "两虎相讦"
 guanzhi_court.1501.desc:0 "旬日之间，两封密奏先后至朕案前：[guanzhi_official.GetTitledFirstName]劾同列某'交通四方，阴蓄异志'；某亦劾其'纳贿鬻狱，植党营私'。二人素不相能，皆朕之肱股，如今撕破脸皮，必欲去对方而后快。"
 guanzhi_court.1502.o0:0 "做戏给朕看？俱贬出京"
 guanzhi_court.1502.o1:0 "任他们斗，朕自冷眼旁观"
 guanzhi_court.1502.t:0 "阳和阴斗"
 guanzhi_court.1502.desc:0 "饬和之诏一下，二人于朝堂之上执手言欢，宛如平生知己。背地里，却各自指使门下弹劾对方的亲朋故旧，株连蔓引，朝中人人自危。"
 guanzhi_court.1503.o0:0 "I see."
 guanzhi_court.1503.t:0 "将相和"
 guanzhi_court.1503.desc:0 "谁料朕一番饬谕，竟令二人各自惭悔。[guanzhi_official.GetTitledFirstName]亲赴对方府上负荆，对方亦倒屣相迎。自此二人同心辅政，朝野传为美谈。"
 guanzhi_court.1504.o0:0 "铁证如山，罢官下狱"
 guanzhi_court.1504.o1:0 "隐而不发，留作日后制约的把柄"
 guanzhi_court.1504.t:0 "袖中铁证"
 guanzhi_court.1504.desc:0 "暗察两月，回报确凿：[guanzhi_official.GetTitledFirstName]受贿鬻官，皆有实据，连收受的礼单都抄来了。朕捏着这份清单，心中五味杂陈。"
 guanzhi_court.1505.o0:0 "利用朕的疑心？先办了你"
 guanzhi_court.1505.o1:0 "将计就计，索性收下这些黑料"
 guanzhi_court.1505.t:0 "事机不密"
 guanzhi_court.1505.desc:0 "朕暗察之事竟被[guanzhi_official.GetTitledFirstName]察觉。他惶恐之余，谗毁对手变本加厉，今日一封密奏，明日一段'街谈巷议'，字字都想借朕的疑心杀人。"
 guanzhi_court.1506.o0:0 "I see."
 guanzhi_court.1506.t:0 "君臣释嫌"
 guanzhi_court.1506.desc:0 "朕手书慰谕，言'卿等皆朕股肱，相煎何急'。二臣捧诏感泣，各上表自劾，争相当庭认错。一场风波，竟化作了满朝忠悃之气。"
 guanzhi_court.1507.o0:0 "再不管，朕就真成傀儡了——俱贬"
 guanzhi_court.1507.o1:0 "再忍忍，等他们自己斗出结果"
 guanzhi_court.1507.t:0 "姑息养奸"
 guanzhi_court.1507.desc:0 "朕的慰谕被二人当成了软弱。如今他们争斗愈烈，却都学会了把朕拉下水：今日甲言'此陛下之意也'，明日乙称'圣意实欲去彼'。朕成了他们手中的一面旗。"
 guanzhi_court.1508.o0:0 "I see."
 guanzhi_court.1508.t:0 "两贤俱去"
 guanzhi_court.1508.desc:0 "一日之间，两员大臣先后离京。朝堂为之一空，政务为之停滞。朕赢了清净，却输了两条臂膀。值与不值，怕要留给后人评说了。"
 guanzhi_court.1509.o0:0 "I see."
 guanzhi_court.1509.t:0 "水落石出"
 guanzhi_court.1509.desc:0 "[guanzhi_official.GetTitledFirstName]获罪去职，其对手留任主政。满朝都说圣明烛照、去奸留贤，只有朕心里清楚：今日之胜负，几分是是非，几分是权术。"
 guanzhi_court.1511.o0:0 "不动声色，分其权于数人"
 guanzhi_court.1511.o1:0 "加殊礼尊崇之，暗夺其实权"
 guanzhi_court.1511.o2:0 "断然罢相，朕不受此掣肘"
 guanzhi_court.1511.t:0 "马首是瞻"
 guanzhi_court.1511.desc:0 "近来朕察觉一事：百官奏事，先问相府之意；诏敕将下，先视[guanzhi_official.GetTitledFirstName]之色。六部堂官，半出其门；台谏言路，多承其风。朕之诏书，竟有出不了宫门之势。"
 guanzhi_court.1512.o0:0 "阻挠者以违制论，执意推行"
 guanzhi_court.1512.o1:0 "阻力太大，收兵回营"
 guanzhi_court.1512.t:0 "处处掣肘"
 guanzhi_court.1512.desc:0 "朕以'参知机务'之名，分相权于三四人。谁知[guanzhi_official.GetTitledFirstName]的门生故吏遍布诸司，新令处处受阻：文书压着不办，会议推托不到，政令出不了尚书省的大门。"
 guanzhi_court.1513.o0:0 "I see."
 guanzhi_court.1513.t:0 "权归人主"
 guanzhi_court.1513.desc:0 "分权之策竟推行得出奇顺利。三四人参预机务，互相牵制，事事须奏取圣裁。[guanzhi_official.GetTitledFirstName]渐成虚位，也只能徒呼奈何。朕重新尝到了乾纲独断的滋味。"
 guanzhi_court.1514.o0:0 "I see."
 guanzhi_court.1514.t:0 "雍容收权"
 guanzhi_court.1514.desc:0 "朕加[guanzhi_official.GetTitledFirstName]殊礼，赐剑履上殿、赞拜不名，却将其日常政务一一移交他人。他安享尊荣，渐渐乐得清闲，门生故吏见其不管事了，也就慢慢散了。"
 guanzhi_court.1515.o0:0 "朕亲临视疾，看他如何收场"
 guanzhi_court.1515.o1:0 "下诏慰留，收权之议暂且作罢"
 guanzhi_court.1515.t:0 "称疾不朝"
 guanzhi_court.1515.desc:0 "[guanzhi_official.GetTitledFirstName]何等精明，早已识破朕的用意。如今他称疾不朝，百官却车马填门，争相问疾，相府门前冠盖如云，比早朝还热闹三分。这是在做给朕看。"
 guanzhi_court.1516.o0:0 "论救者俱贬！朕意已决"
 guanzhi_court.1516.o1:0 "众怒难犯，复其相位以安人心"
 guanzhi_court.1516.t:0 "交章论救"
 guanzhi_court.1516.desc:0 "罢相之诏方下，朝野震动。[guanzhi_official.GetTitledFirstName]的门生故吏交章论救，一日之内弹压不下；老臣宿将亦多有不平者，言'宰相无罪而罢，非国之福'。"
 guanzhi_court.1517.o0:0 "I see."
 guanzhi_court.1517.t:0 "乾纲独断"
 guanzhi_court.1517.desc:0 "几番较量，相权终归于朕。如今百官奏事直达御前，诏敕自中书出而天下奉行。朕的朝廷，终于姓了朕的姓。只是案头的章奏，从此堆得像山一样了。"
 guanzhi_court.1518.o0:0 "I see."
 guanzhi_court.1518.t:0 "尾大依旧"
 guanzhi_court.1518.desc:0 "收权之事，终究不了了之。[guanzhi_official.GetTitledFirstName]仍是百官的马首，朕仍是那个盖章的天子。他见了朕愈发恭敬，恭敬得让朕心里发凉。"
 guanzhi_court.1519.o0:0 "I see."
 guanzhi_court.1519.t:0 "拔山立威"
 guanzhi_court.1519.desc:0 "[guanzhi_official.GetTitledFirstName]去职之日，论救者皆贬，相府门可罗雀。满朝文武从此明白：这朝堂之上，只有一位主子。威是立住了，只是此后治国，朕得亲力亲为了。"
 guanzhi_court.1521.o0:0 "遣御史驰驿核查，务得实情"
 guanzhi_court.1521.o1:0 "边功难得，照例封赏就是"
 guanzhi_court.1521.o2:0 "压下不表，免得寒了边将之心"
 guanzhi_court.1521.t:0 "捷报可疑"
 guanzhi_court.1521.desc:0 "边镇捷报入京：斩获三千，拓地百里。然[guanzhi_official.GetTitledFirstName]于朝班中出列奏道：塘报首级之数与俘馘不合，且边境并无大战之讯。此捷，恐有虚冒。"
 guanzhi_court.1522.o0:0 "欺君之罪，槛车征还问罪"
 guanzhi_court.1522.o1:0 "边情险恶，降旨切责，令其戴罪戍守"
 guanzhi_court.1522.t:0 "虚报坐实"
 guanzhi_court.1522.desc:0 "御史回奏：所谓斩获三千，实不过百余级，余皆杀良冒功，边民冤声载道。其将虚报战功，欺罔朝廷，罪状昭然。"
 guanzhi_court.1523.o0:0 "I see."
 guanzhi_court.1523.t:0 "使者受蒙"
 guanzhi_court.1523.desc:0 "御史行至边镇，其将盛陈牛酒，厚赠金帛。回报称战功大略属实，稍有夸饰而已。朕加赏边军，然朝中私语，谓使者受了人家好处。"
 guanzhi_court.1524.o0:0 "不能再容，遣使彻底核查"
 guanzhi_court.1524.o1:0 "边境总算无事，随他报去"
 guanzhi_court.1524.t:0 "捷报愈夸"
 guanzhi_court.1524.desc:0 "自朕封赏之后，边镇捷报一岁数至，斩获之数由三千而至五千、八千。兵部核其甲仗粮册，军实竟毫无增益。[guanzhi_official.GetTitledFirstName]复奏：此风不可长。"
 guanzhi_court.1525.o0:0 "酿成大患，立逮其将治罪"
 guanzhi_court.1525.o1:0 "大敌当前，先易将，后议罪"
 guanzhi_court.1525.t:0 "杀良召寇"
 guanzhi_court.1525.desc:0 "冒功之事终致边患：边民不堪杀戮，相率投寇，引敌入塞，连陷二堡。边将犹以'力战却敌'闻。"
 guanzhi_court.1526.o0:0 "既已捅破，顺势下诏核查"
 guanzhi_court.1526.o1:0 "斥言官风闻误国，各罚俸三月"
 guanzhi_court.1526.t:0 "台谏风闻"
 guanzhi_court.1526.desc:0 "朕虽压下不问，台谏却已风闻入奏，劾边将冒功、劾朕姑息。章疏抄传于外，京师议论纷纷。"
 guanzhi_court.1527.o0:0 "I see."
 guanzhi_court.1527.t:0 "讳疾忌医"
 guanzhi_court.1527.desc:0 "冒功之案终究无人再提。边将知朝廷不问，夸饰如故。边事之虚实，朕已不能尽知，惟愿烽燧无警耳。"
 guanzhi_court.1528.o0:0 "I see."
 guanzhi_court.1528.t:0 "明正其罪"
 guanzhi_court.1528.desc:0 "边将槛车入京，廷鞫服罪，夺职论戍。诏谕诸镇：嗣后奏功，皆以验核为凭。诸将悚然，塘报一时不敢复夸。"
 guanzhi_court.1529.o0:0 "I see."
 guanzhi_court.1529.t:0 "姑容养患"
 guanzhi_court.1529.desc:0 "朕念其久戍之劳，切责了事。边将感惧交集，稍有敛迹，然诸镇皆窥知朝廷之意，虚报之风不过稍戢，未绝也。"
 guanzhi_court.1531.o0:0 "边事为重，如数拨饷"
 guanzhi_court.1531.o1:0 "遣使点验军实，再定拨数"
 guanzhi_court.1531.o2:0 "国库不裕，减半拨给，令其撙节"
 guanzhi_court.1531.t:0 "连章请饷"
 guanzhi_court.1531.desc:0 "边镇一月三疏请饷，言士卒枵腹、衣甲朽坏，寇骑伺隙，缓急无可恃者。户部却奏：该镇岁饷已倍于往时。[guanzhi_official.GetTitledFirstName]进言：是真困乏，抑或养寇邀赏，不可不察。"
 guanzhi_court.1532.o0:0 "I see."
 guanzhi_court.1532.t:0 "边备粗安"
 guanzhi_court.1532.desc:0 "饷械至边，士卒饱暖，城垒一新。其将上表谢恩，誓以死报。秋防无事，烽燧不惊。"
 guanzhi_court.1533.o0:0 "遣官清查饷项，穷其侵渔"
 guanzhi_court.1533.o1:0 "边将难制，隐忍不发，徐图之"
 guanzhi_court.1533.t:0 "楼台新起"
 guanzhi_court.1533.desc:0 "饷至边镇，士卒未见实惠，怨声载道；其将府中却新起楼台，姬妾罗绮，僭拟王公。逃卒至京，言之凿凿。"
 guanzhi_court.1534.o0:0 "急拨粮饷，不可使壮士寒心"
 guanzhi_court.1534.o1:0 "库帑有限，量拨半数，令其坚守"
 guanzhi_court.1534.t:0 "边军实困"
 guanzhi_court.1534.desc:0 "使者回奏：该镇士卒衣不蔽体，日食一餐，城堞颓圮，兵器朽钝，委实困顿。所请之饷，分毫无虚。"
 guanzhi_court.1535.o0:0 "夺其兵权，槛车征还"
 guanzhi_court.1535.o1:0 "投鼠忌器，先易其副，徐徐图之"
 guanzhi_court.1535.t:0 "养寇邀饷"
 guanzhi_court.1535.desc:0 "使者密报：该镇军籍虚名十之三，空饷尽归私橐；寇至则纵之饱掠，寇去则报捷邀赏。所谓'边患孔亟'，半是其将自养之寇。"
 guanzhi_court.1536.o0:0 "不可激变，补足欠饷"
 guanzhi_court.1536.o1:0 "朝廷岂受边将要挟？严旨切责"
 guanzhi_court.1536.t:0 "减饷之患"
 guanzhi_court.1536.desc:0 "半饷至边，军中汹汹，有夜聚而噪者。其将上表，言辞怨望：'士卒啼饥，臣不能制。'隐然以哗变挟朝廷。"
 guanzhi_court.1537.o0:0 "I see."
 guanzhi_court.1537.t:0 "饷弊一清"
 guanzhi_court.1537.desc:0 "清查之使至，追出侵饷巨万，其将解职待罪。重定军籍，汰其虚名，边饷之弊为之一清。"
 guanzhi_court.1538.o0:0 "I see."
 guanzhi_court.1538.t:0 "收其兵柄"
 guanzhi_court.1538.desc:0 "诏使驰至，夺其兵符，槛车入京。边军另简良将统之，军士闻其败，无一人为之惜者。"
 guanzhi_court.1539.o0:0 "I see."
 guanzhi_court.1539.t:0 "隐忍苟安"
 guanzhi_court.1539.desc:0 "朕终未穷其罪。其将益骄，遇诏使辄倨。边镇之事，朝廷但闻其所欲闻者而已。"
 guanzhi_court.1540.o0:0 "I see."
 guanzhi_court.1540.t:0 "边军小哗"
 guanzhi_court.1540.desc:0 "切责之旨至，军中果哗，焚掠官廨，旬日始定。朝廷不得不补饷抚之，威惠两失。"
 guanzhi_court.1541.o0:0 "丧师之罪，岂容讳饰？下诏彻查"
 guanzhi_court.1541.o1:0 "先降旨责问边将，观其自辩"
 guanzhi_court.1541.o2:0 "战时动摇军心，斥其妄言"
 guanzhi_court.1541.t:0 "败绩之劾"
 guanzhi_court.1541.desc:0 "[guanzhi_official.GetTitledFirstName]上疏急奏：边镇新遭大败，丧师数千，失寨三座，而塘报讳败称捷，伪言斩获。阖朝文武，多为边将遮掩，独臣不敢不言。"
 guanzhi_court.1542.o0:0 "收主帅下狱，明正典刑"
 guanzhi_court.1542.o1:0 "隐其大罪，密令戴罪立功"
 guanzhi_court.1542.t:0 "败状尽露"
 guanzhi_court.1542.desc:0 "钦使查验毕，回报：败绩属实，死者倍于所奏，溃卒流散为盗。主帅讳败，杀报事之小校以灭口。铁证如山。"
 guanzhi_court.1543.o0:0 "毁籍灭口，其心可知！穷治到底"
 guanzhi_court.1543.o1:0 "查无实据，责言官失实以谢边将"
 guanzhi_court.1543.t:0 "死无对证"
 guanzhi_court.1543.desc:0 "钦使至边，军中文书已'毁于寇火'，目睹之卒非死即徙。主帅反上表劾[guanzhi_official.GetTitledFirstName]风闻构陷、动摇边事。"
 guanzhi_court.1544.o0:0 "兼听则明，仍遣使查实"
 guanzhi_court.1544.o1:0 "其言有理，切责言官安其心"
 guanzhi_court.1544.t:0 "边将自辩"
 guanzhi_court.1544.desc:0 "边将回表：不过小挫，旋即克复，杀敌相当。并称京师言官受人指使，意在倾陷边帅，摇惑圣听。言辞甚壮。"
 guanzhi_court.1545.o0:0 "下罪己诏，并收边将治罪"
 guanzhi_court.1545.o1:0 "罪在边将一人，与朝廷何干"
 guanzhi_court.1545.t:0 "溃卒言败"
 guanzhi_court.1545.desc:0 "未几，溃卒数千逃入内地，沿途言败状甚悉，州郡遮护不得。败绩遂尽人皆知，京城汹汹，谓朝廷为边将所欺。"
 guanzhi_court.1546.o0:0 "I see."
 guanzhi_court.1546.t:0 "言者寒心"
 guanzhi_court.1546.desc:0 "[guanzhi_official.GetTitledFirstName]因言获罪，台谏为之气短。数月之后，边镇果再有败讯，然已无一人敢先奏者。"
 guanzhi_court.1547.o0:0 "I see."
 guanzhi_court.1547.t:0 "军法如山"
 guanzhi_court.1547.desc:0 "诏书暴其罪状于天下，主帅削职论死，监军以下各有差。诸镇闻之悚然，塘报始不敢虚饰。然临阵易帅，边事亦小有波动。"
 guanzhi_court.1548.o0:0 "I see."
 guanzhi_court.1548.t:0 "戴罪戍边"
 guanzhi_court.1548.desc:0 "朕隐其重罪，切责留任。其将感戴天恩，又惧朝廷之察，整军经武，来岁果以小捷自赎。知其事者，或讥朕赏罚不明。"
 guanzhi_court.1549.o0:0 "I see."
 guanzhi_court.1549.t:0 "罪己饬边"
 guanzhi_court.1549.desc:0 "朕下诏罪己，引咎于任将不明；边将收系论罪，边军更置良帅。士民见朕不护己短，反称其德。"
 guanzhi_court.1551.o0:0 "善哉斯言，却瑞不受"
 guanzhi_court.1551.o1:0 "天意昭示，朕受之无愧"
 guanzhi_court.1551.o2:0 "嘉其忠直，鹿仍养于上林"
 guanzhi_court.1551.t:0 "白鹿入献"
 guanzhi_court.1551.desc:0 "州郡遣使献白鹿一头，称获于名山，毛色如雪，驯扰不惊人，盖太平之瑞。百官称贺，独[guanzhi_official.GetTitledFirstName]进言：祥瑞者，德之表也；德未洽而瑞屡至，适足为羞，愿陛下勿喜。"
 guanzhi_court.1552.o0:0 "I see."
 guanzhi_court.1552.t:0 "却瑞之声"
 guanzhi_court.1552.desc:0 "朕却白鹿之事传于四方，诏曰：'郡国毋得献祥瑞，其以循良课最闻。'士大夫相贺，谓此真帝王之度。"
 guanzhi_court.1553.o0:0 "浮言何足恤，温旨慰勉之"
 guanzhi_court.1553.o1:0 "众口铄金，令其避位自处"
 guanzhi_court.1553.t:0 "沮瑞之谤"
 guanzhi_court.1553.desc:0 "献瑞之州郡长官谄进无路，心衔[guanzhi_official.GetTitledFirstName]，造作浮言，谓其沮格天意、市恩钓名。言者三数人，章疏渐闻于朕。"
 guanzhi_court.1554.o0:0 "此风一开则吏治坏，下诏禁止"
 guanzhi_court.1554.o1:0 "盛世之符，多多益善，照旧收纳"
 guanzhi_court.1554.t:0 "争献祥瑞"
 guanzhi_court.1554.desc:0 "自朕受白鹿，四方争献祥瑞：某郡嘉禾九穗，某县甘露降松，某州白雀巢庭。驿使相望于道，有司勘验疲于奔命。"
 guanzhi_court.1555.o0:0 "秘而瘗之，毋令外间知晓"
 guanzhi_court.1555.o1:0 "朕德薄致此，下诏自讼"
 guanzhi_court.1555.t:0 "鹿死上林"
 guanzhi_court.1555.desc:0 "白鹿入苑月余，竟不食而死。左右失色，私语沸腾：瑞物夭亡，是不祥也。有司请秘之，言官请告于太庙。"
 guanzhi_court.1556.o0:0 "I see."
 guanzhi_court.1556.t:0 "忠直得志"
 guanzhi_court.1556.desc:0 "朕嘉[guanzhi_official.GetTitledFirstName]之忠，擢其官以示天下；白鹿豢于上林，亦不张大其事。进退之间，颇得中道，朝野称善。"
 guanzhi_court.1557.o0:0 "I see."
 guanzhi_court.1557.t:0 "德归于上"
 guanzhi_court.1557.desc:0 "自是不尚祥瑞，专求治绩。郡国所奏，皆仓廪狱讼之实。史臣书曰：上不侈符瑞，故下不为谀。"
 guanzhi_court.1558.o0:0 "I see."
 guanzhi_court.1558.t:0 "直臣见疏"
 guanzhi_court.1558.desc:0 "[guanzhi_official.GetTitledFirstName]避位去朝，谀者日进。后虽有嘉禾白雀之献，朝堂之上，唯闻颂声，不闻规谏矣。"
 guanzhi_court.1559.o0:0 "I see."
 guanzhi_court.1559.t:0 "瑞物之累"
 guanzhi_court.1559.desc:0 "祥瑞之书日积，无益之费日滋。及白鹿之死泄闻于外，民间遂有'瑞物夭，天子惶'之谣，朕闻之，怫然不悦者累日。"
 guanzhi_court.1561.o0:0 "老成之见，下诏求直言"
 guanzhi_court.1561.o1:0 "老生常谈，留中不发"
 guanzhi_court.1561.o2:0 "瑞应如此，正宜封禅告成"
 guanzhi_court.1561.t:0 "芝草屡见"
 guanzhi_court.1561.desc:0 "旬月之间，祥瑞叠奏：甘露降于殿槐，芝草产于太庙，醴泉出于上林。群臣请上尊号。老臣[guanzhi_official.GetTitledFirstName]独上疏：'臣闻祥瑞多则吏治坏。郡县以瑞谀上，则无人视民事矣。'"
 guanzhi_court.1562.o0:0 "既知其弊，整饬州县吏治"
 guanzhi_court.1562.o1:0 "积重难返，择其一二行之"
 guanzhi_court.1562.t:0 "直言毕集"
 guanzhi_court.1562.desc:0 "求言之诏下，奏章毕集：或言赋敛之重，或言狱讼之冤，或言祥瑞勘验之费蠹于州县。朕宵衣览之，始知承平之下，积弊已深。"
 guanzhi_court.1563.o0:0 "兼收并察，去其挟私者"
 guanzhi_court.1563.o1:0 "言路纷扰，徒乱人意，罢之"
 guanzhi_court.1563.t:0 "借言攻讦"
 guanzhi_court.1563.desc:0 "求言既久，言者渐失其旨：借端攻讦私怨，指斥同列，章奏盈廷，半是党同伐异之语。真直言反为所掩。"
 guanzhi_court.1564.o0:0 "彻查伪瑞，罪其献者"
 guanzhi_court.1564.o1:0 "事涉祥瑞，恐伤国体，寝之"
 guanzhi_court.1564.t:0 "伪瑞迭出"
 guanzhi_court.1564.desc:0 "朕既不以老臣之言为意，献瑞者益无忌惮。有郡献'天书石'，文曰'圣寿万年'，验之，乃凿字以蜜浆引蚁成文者。欺罔之迹，路人皆知。"
 guanzhi_court.1565.o0:0 "朕过矣！慰留之，并纳其言"
 guanzhi_court.1565.o1:0 "准其致仕，全其晚节"
 guanzhi_court.1565.t:0 "老臣乞骸"
 guanzhi_court.1565.desc:0 "[guanzhi_official.GetTitledFirstName]以言不见用，再上疏乞骸骨。疏中有云：'陛下乐闻芝草，则四方献芝草；陛下乐闻疾苦，则四方奏疾苦。臣老矣，不能从谀。'"
 guanzhi_court.1566.o0:0 "力排众议，大典照旧举行"
 guanzhi_court.1566.o1:0 "物力维艰，朕不为虚文，罢之"
 guanzhi_court.1566.t:0 "封禅之议"
 guanzhi_court.1566.desc:0 "朕以瑞应频仍，欲行封禅大典。度支奏：车驾仪卫、郡县供顿，非巨万不可办。[guanzhi_official.GetTitledFirstName]率台谏力谏：封禅者，功成德洽而后议，今旱蝗之余，非其时也。"
 guanzhi_court.1567.o0:0 "I see."
 guanzhi_court.1567.t:0 "实政代瑞"
 guanzhi_court.1567.desc:0 "自是朝廷不复言瑞，专以户口增、狱讼平课郡县。数岁之后，盗贼渐稀，仓庾渐实。人方知老臣'祥瑞多则吏治坏'一语，药石之言也。"
 guanzhi_court.1568.o0:0 "I see."
 guanzhi_court.1568.t:0 "虚应故事"
 guanzhi_court.1568.desc:0 "求言之举，始勤终怠。言者见上不果行，亦渐缄默。祥瑞之奏与灾异之报，并行于途，各取所好而已。"
 guanzhi_court.1569.o0:0 "I see."
 guanzhi_court.1569.t:0 "虚文耗国"
 guanzhi_court.1569.desc:0 "封禅之费以巨万计，土木仪卫，半入经办之吏囊橐。还京之日，颂声盈耳，而帑藏为之一虚。识者私叹：瑞何在焉？"
 guanzhi_court.1570.o0:0 "I see."
 guanzhi_court.1570.t:0 "老臣去国"
 guanzhi_court.1570.desc:0 "[guanzhi_official.GetTitledFirstName]挂冠出都，士大夫祖道于门外，目送者皆唏嘘。自是朝中争言符瑞，无复有以吏治为言者。"
 guanzhi_court.1571.o0:0 "天变可畏，朕即下诏罪己"
 guanzhi_court.1571.o1:0 "天变不足畏，照常视朝"
 guanzhi_court.1571.o2:0 "命太史详占，再作区处"
 guanzhi_court.1571.t:0 "彗星见西"
 guanzhi_court.1571.desc:0 "彗星见于西方，长竟天，三夕不灭。太史奏：彗者，除旧布新之象，主大臣当之。群臣恐惧，[guanzhi_official.GetTitledFirstName]率百僚顿首，请陛下避正殿、减常膳、下罪己之诏。"
 guanzhi_court.1572.o0:0 "I see."
 guanzhi_court.1572.t:0 "彗灭人和"
 guanzhi_court.1572.desc:0 "罪己之诏既下，朕避殿减膳，亲录囚徒，罢不急之役。旬余，彗光渐灭。士民相传：天子畏天修德，此社稷之福也。"
 guanzhi_court.1573.o0:0 "朕既求言，择善而从之"
 guanzhi_court.1573.o1:0 "借灾沽名之徒，各予申饬"
 guanzhi_court.1573.t:0 "借灾言事"
 guanzhi_court.1573.desc:0 "自罪己诏下，借天变言事者蜂起：或攻宰执，或诋近幸，章奏直指阙廷，辞气日激。有诏求言，而言者几于讦上矣。"
 guanzhi_court.1574.o0:0 "事已至此，补下罪己之诏"
 guanzhi_court.1574.o1:0 "严查谣言，妖言惑众者罪之"
 guanzhi_court.1574.t:0 "灾异继见"
 guanzhi_court.1574.desc:0 "朕未罪己，而震灾、陨霜继见，米价腾踊，民间谣言四起，谓'天怒未解'。[guanzhi_official.GetTitledFirstName]复率群官伏阙固请。"
 guanzhi_court.1575.o0:0 "I see."
 guanzhi_court.1575.t:0 "彗竟自灭"
 guanzhi_court.1575.desc:0 "彗竟自行隐灭，四境亦无大祲。朕临朝谓左右：灾异之说，儒者好为之耳。群臣唯唯，然清议私议朕傲忽天意者，亦有其人。"
 guanzhi_court.1576.o0:0 "天人相应，罢其政柄以弭变"
 guanzhi_court.1576.o1:0 "天意难知，朕反躬修德而已"
 guanzhi_court.1576.t:0 "占应宰臣"
 guanzhi_court.1576.desc:0 "太史再占，奏曰：彗扫紫宫，应在执政，宜斥大臣以当天变。一时群臣侧目于[guanzhi_official.GetTitledFirstName]——其人为首相，恰当其冲。"
 guanzhi_court.1577.o0:0 "I see."
 guanzhi_court.1577.t:0 "修德弭灾"
 guanzhi_court.1577.desc:0 "朕因天变而自省：蠲逋赋、理冤狱、罢营缮，政事多所厘正。彗灭之后，朝野翕然，谓天虽示警，而国有令主。"
 guanzhi_court.1578.o0:0 "I see."
 guanzhi_court.1578.t:0 "天人之讥"
 guanzhi_court.1578.desc:0 "朕拒罪己而重责言者，自是灾异之奏不达于上，郡县相率讳灾。他日水旱猝发，朝廷竟无所备，民受其敝。"
 guanzhi_court.1579.o0:0 "I see."
 guanzhi_court.1579.t:0 "移咎宰臣"
 guanzhi_court.1579.desc:0 "[guanzhi_official.GetTitledFirstName]以'当天变'罢政。朝臣相顾股栗：今日在彼，安知明日不在我？自是执政者皆务自全，无肯任事者矣。"
 guanzhi_court.1581.o0:0 "下罪己诏，避殿减膳"
 guanzhi_court.1581.o1:0 "先赈灾民，兼祷山川"
 guanzhi_court.1581.o2:0 "天意难回，专意赈恤，不事虚文"
 guanzhi_court.1581.t:0 "祈雨不雨"
 guanzhi_court.1581.desc:0 "大旱三月，赤地千里，禾稼尽枯。朕亲祷于太庙社稷，徒跣曝日，雨犹不降。有司请下罪己诏以答天谴，亦有言当遣使遍祷名山大川者。[guanzhi_official.GetTitledFirstName]奏：祷雨不如恤民。"
 guanzhi_court.1582.o0:0 "I see."
 guanzhi_court.1582.t:0 "诏雨立至"
 guanzhi_court.1582.desc:0 "罪己之诏方下，阴云四合，三日而大雨滂沱，四野霑足。父老扶杖聚于阙下，山呼万岁。皆言天子至诚，感格天心。"
 guanzhi_court.1583.o0:0 "开常平仓，大发粟赈之"
 guanzhi_court.1583.o1:0 "徙饥民就食于丰收之郡"
 guanzhi_court.1583.t:0 "诏下犹旱"
 guanzhi_court.1583.desc:0 "罪己诏下而旱犹不止，骄阳如火，人心愈惶。饥民渐聚于通都大邑，或掘草根、剥树皮以食。州县告急之章，日数十上。"
 guanzhi_court.1584.o0:0 "I see."
 guanzhi_court.1584.t:0 "赈定雨降"
 guanzhi_court.1584.desc:0 "赈使四出，粥厂遍设，流民稍安其业。既而云兴雨降，岁得半收。民言：上恤我民，故天亦恤之。"
 guanzhi_court.1585.o0:0 "严查赈务，贪吏立置重典"
 guanzhi_court.1585.o1:0 "非常之时，先安民、后究吏"
 guanzhi_court.1585.t:0 "赈粮被蚀"
 guanzhi_court.1585.desc:0 "灾民尚未得实惠，而监察之使密奏：州县吏侵渔赈粮，以糠秕杂粟米，斗斛不足其数。灾民所领，不抵熬饥。"
 guanzhi_court.1586.o0:0 "朕从其请，补下罪己之诏"
 guanzhi_court.1586.o1:0 "朕无罪可己，申谕百官毋妄言"
 guanzhi_court.1586.t:0 "清议之责"
 guanzhi_court.1586.desc:0 "朕专意赈恤而不肯罪己，清议遂有所讥：谓朕吝一诏书，不能引咎，故天怒未解、霖雨不降。言官伏阙者数辈。"
 guanzhi_court.1587.o0:0 "I see."
 guanzhi_court.1587.t:0 "民心得保"
 guanzhi_court.1587.desc:0 "大赈既行，饿殍渐少，流亡渐复。秋后得雨，晚禾薄收。民虽苦，而无大叛。史册书之曰：岁大饥，民不怨。"
 guanzhi_court.1588.o0:0 "I see."
 guanzhi_court.1588.t:0 "流离载道"
 guanzhi_court.1588.desc:0 "赈不及施，徙民就食者多毙于道路，强壮者相聚为盗，州郡捕不能尽。旱灾之后，继以人患，闾阎数年不能复。"
 guanzhi_court.1589.o0:0 "I see."
 guanzhi_court.1589.t:0 "诛贪回天"
 guanzhi_court.1589.desc:0 "贪吏数人弃市，赃粟尽发以予饥民，观者称快。未几雨降，民谓：天意回于诛贪之日。朕亦知恤民之要，在察吏为先。"
