l_english:
 guanzhi_grant_xuxian_interaction:0 "加授虚衔"
 guanzhi_grant_xuxian_interaction_desc:0 "为此人物加授州牧、都督、行军大总管或检校官等荣誉衔。"
 guanzhi.9850.t:0 "加授虚衔"
 guanzhi.9850.desc:0 "择虚衔以授[recipient.GetShortUIName]。州牧者，汉之方伯虚号；使持节都督诸州军事，魏晋之节将；行军大总管，唐之方面统帅；检校者，唐中后期之加官。"
 gzx_menu_zm:0 "虚职州牧（汉制）"
 gzx_menu_jie:0 "使持节都督诸州军事"
 gzx_menu_zgj:0 "行军大总管（唐道级）"
 gzx_menu_jj:0 "检校官（唐制）"
 gzx_pick_zm_desc:0 "择州以授州牧（虚职，司隶称司隶校尉）。"
 gzx_pick_jie_desc:0 "择所督诸州（可复选，再点取消；确认后册封）。"
 gzx_pick_zgj_desc:0 "择道以授行军大总管。"
 gzx_pick_jj_desc:0 "择职事官以授检校（授新替旧）。"
 gzx_jie_confirm:0 "就此册封"
 gzx_jie_reset:0 "清空重选"
 guanzhi_revoke_zm_interaction:0 "剥夺州牧"
 guanzhi_revoke_zm_interaction_desc:0 "削夺此人物的州牧虚衔。"
 guanzhi_revoke_jie_interaction:0 "剥夺都督"
 guanzhi_revoke_jie_interaction_desc:0 "削夺此人物的使持节都督诸州军事。"
 guanzhi_revoke_zgj_interaction:0 "剥夺行军大总管"
 guanzhi_revoke_zgj_interaction_desc:0 "削夺此人物的行军大总管。"
 guanzhi_revoke_jj_interaction:0 "剥夺检校官"
 guanzhi_revoke_jj_interaction_desc:0 "削夺此人物的检校官。"
 trait_gzzm_desc:0 "汉制州牧虚号，方伯之荣，不治其州。"
 trait_gzjdj_desc:0 "使持节都督诸州军事，节将之任，得专杀伐。"
 trait_gzzgj_desc:0 "唐道级行军大总管，方面统帅。"
 trait_gzjj_desc:0 "唐中后期检校官，带职而不任事，以为荣宠。"
 trait_gzjdj:0 "使持节都督诸军事"
 gzxj_suffix:0 "诸军事"
 gzx_menu_xs:0 "文馆学士（唐制）"
 gzx_pick_xs_desc:0 "择文馆学士以授之（弘文馆/集贤殿/崇文馆/崇玄馆，授新替旧）。"
 guanzhi_revoke_xs_interaction:0 "剥夺学士"
 guanzhi_revoke_xs_interaction_desc:0 "削夺此人物的文馆学士衔。"
 trait_gzxs_desc:0 "唐文馆学士，文学侍从之荣，掌图书、备顾问。"
