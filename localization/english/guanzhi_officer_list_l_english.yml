 guanzhi_officer_list_tang:0 "——Three Preceptors and Three Excellencies——\n　Grand Preceptor：[holder_t_taishi.GetShortUIName]\n　Grand Mentor：[holder_t_taifu.GetShortUIName]\n　Grand Guardian：[holder_t_taibao.GetShortUIName]\n　Grand Commandant：[holder_t_taiwei.GetShortUIName]\n　Minister over the Masses：[holder_t_situ.GetShortUIName]\n　Grand Minister of Works：[holder_t_sikong.GetShortUIName]\n——Three Departments and the Censorate——\n　Director of the Department of State Affairs：[holder_t_shangshuling.GetShortUIName]\n　Left Vice Director of State Affairs：[holder_t_zuopuye.GetShortUIName]\n　Right Vice Director of State Affairs：[holder_t_youpuye.GetShortUIName]\n　Director of the Secretariat：[holder_t_zhongshuling.GetShortUIName]\n　Director of the Chancellery：[holder_t_shizhong.GetShortUIName]\n　Censor-in-chief：[holder_t_yushidafu.GetShortUIName]\n——Six Ministries——\n　Minister of Personnel：[holder_t_libu.GetShortUIName]\n　Minister of Revenue：[holder_t_hubu.GetShortUIName]\n　Minister of Rites：[holder_t_libu_rites.GetShortUIName]\n　Minister of War：[holder_t_bingbu.GetShortUIName]\n　Minister of Justice：[holder_t_xingbu.GetShortUIName]\n　Minister of Works：[holder_t_gongbu.GetShortUIName]\n——Nine Courts——\n　Minister of the Court of Imperial Sacrifices：[holder_t_taichang.GetShortUIName]\n　Minister of the Court of Imperial Entertainments：[holder_t_guanglu.GetShortUIName]\n　Minister of the Court of the Palace Guards：[holder_t_weiwei_si.GetShortUIName]\n　Minister of the Court of the Imperial Clan：[holder_t_zongzheng.GetShortUIName]\n　Minister of the Court of the Imperial Stud：[holder_t_taipu.GetShortUIName]\n　Minister of the Court of Judicial Review：[holder_t_dali.GetShortUIName]\n　Minister of the Court of State Ceremonial：[holder_t_honglu.GetShortUIName]\n　Minister of the Court of the National Granaries：[holder_t_sinong.GetShortUIName]\n　Minister of the Court of the Imperial Treasury：[holder_t_taifu_si.GetShortUIName]\n——Directorates——\n　Rector of the Directorate of Education：[holde