 guanzhi_officer_list_tang:0 "——Three Preceptors and Three Excellencies——\n　Grand Preceptor：[holder_t_taishi.Custom('gzol_t_taishi')]\n　Grand Mentor：[holder_t_taifu.Custom('gzol_t_taifu')]\n　Grand Guardian：[holder_t_taibao.Custom('gzol_t_taibao')]\n　Grand Commandant：[holder_t_taiwei.Custom('gzol_t_taiwei')]\n　Minister over the Masses：[holder_t_situ.Custom('gzol_t_situ')]\n　Grand Minister of Works：[holder_t_sikong.Custom('gzol_t_sikong')]\n——Three Departments and the Censorate——\n　Director of the Department of State Affairs：[holder_t_shangshuling.Custom('gzol_t_shangshuling')]\n　Left Vice Director of State Affairs：[holder_t_zuopuye.Custom('gzol_t_zuopuye')]\n　Right Vice Director of State Affairs：[holder_t_youpuye.Custom('gzol_t_youpuye')]\n　Director of the Secretariat：[holder_t_zhongshuling.Custom('gzol_t_zhongshuling')]\n　Director of the Chancellery：[holder_t_shizhong.Custom('gzol_t_shizhong')]\n　Censor-in-chief：[holder_t_yushidafu.Custom('gzol_t_yushidafu')]\n——Six Ministries——\n　Minister of Personnel：[holder_t_libu.Custom('gzol_t_libu')]\n　Minister of Revenue：[holder_t_hubu.Custom('gzol_t_hubu')]\n　Minister of Rites：[holder_t_libu_rites.Custom('gzol_t_libu_rites')]\n　Minister of War：[holder_t_bingbu.Custom('gzol_t_bingbu')]\n　Minister of Justice：[holder_t_xingbu.Custom('gzol_t_xingbu')]\n　Minister of Works：[holder_t_gongbu.Custom('gzol_t_gongbu')]\n——Nine Courts——\n　Minister of the Court of Imperial Sacrifices：[holder_t_taichang.Custom('gzol_t_taichang')]\n　Minister of the Court of Imperial Entertainments：[holder_t_guanglu.Custom('gzol_t_guanglu')]\n　Minister of the Court of the Palace Guards：[holder_t_weiwei_si.Custom('gzol_t_weiwei_si')]\n　Minister of the Court of the Imperial Clan：[holder_t_zongzheng.Custom('gzol_t_zongzheng')]\n　Minister of the Court of the Imperial Stud：[holder_t_taipu.Custom('gzol_t_taipu')]\n　Minister of the Court of Judicial Review：[holder_t_dali.Custom('gzol_t_dali')]\n　Minister of the Court of State Ceremonial：[holder_t_honglu.Custom('gzol_t_honglu')]\n　Minister of the Court of the National Granaries：[holder_t_sinong.Custom('gzol_t_sinong')]\n　Minister of the Court of the Imperial Treasury：[holder_t_taifu_si.Custom('gzol_t_taifu_si')]\n——Directorates——\n　Rector of the Directorate of Education：[holder_t_guozi.Custom('gzol_t_guozi')]\n　Director of the Imperial Manufactories：[holder_t_shaofu_jian.Custom('gzol_t_shaofu_jian')]\n　Director of Palace Buildings：[holder_t_jiangzuo.Custom('gzol_t_jiangzuo')]\n　Director of Armaments：[holder_t_junqi.Custom('gzol_t_junqi')]\n　Director of Waterways：[holder_t_dushui.Custom('gzol_t_dushui')]\n　Director of the Palace Library：[holder_t_mishu.Custom('gzol_t_mishu')]\n　Director of Palace Administration：[holder_t_dianzhong.Custom('gzol_t_dianzhong')]\n　Director of the Palace Domestic Service：[holder_t_neishi.Custom('gzol_t_neishi')]\n——Left Guards——\n　General of the Left Guard：[holder_t_zuowei.Custom('gzol_t_zuowei')]\n　General of the Left Valiant Guard：[holder_t_zuoxiaowei.Custom('gzol_t_zuoxiaowei')]\n　General of the Left Martial Guard：[holder_t_zuowuwei.Custom('gzol_t_zuowuwei')]\n　General of the Left Awesome Guard：[holder_t_zuoweiwei.Custom('gzol_t_zuoweiwei')]\n　General of the Left Palace Army Guard：[holder_t_zuolingjun.Custom('gzol_t_zuolingjun')]\n　General of the Left Golden Bird Guard：[holder_t_zuojinwu.Custom('gzol_t_zuojinwu')]\n　General of the Left Palace Gate Guard：[holder_t_zuojianmen.Custom('gzol_t_zuojianmen')]\n　General of the Left Imperial Sword Guard：[holder_t_zuoqianniu.Custom('gzol_t_zuoqianniu')]\n——Right Guards——\n　General of the Right Guard：[holder_t_youwei.Custom('gzol_t_youwei')]\n　General of the Right Valiant Guard：[holder_t_youxiaowei.Custom('gzol_t_youxiaowei')]\n　General of the Right Martial Guard：[holder_t_youwuwei.Custom('gzol_t_youwuwei')]\n　General of the Right Awesome Guard：[holder_t_youweiwei.Custom('gzol_t_youweiwei')]\n　General of the Right Palace Army Guard：[holder_t_youlingjun.Custom('gzol_t_youlingjun')]\n　General of the Right Golden Bird Guard：[holder_t_youjinwu.Custom('gzol_t_youjinwu')]\n　General of the Right Palace Gate Guard：[holder_t_youjianmen.Custom('gzol_t_youjianmen')]\n　General of the Right Imperial Sword Guard：[holder_t_youqianniu.Custom('gzol_t_youqianniu')]\n——Central Commissions——\n　Hanlin Academician：[holder_t_hanlin.Custom('gzol_t_hanlin')]\n　Privy Commissioner：[holder_t_shumi.Custom('gzol_t_shumi')]\n　Palace Ceremony Commissioner：[holder_t_xuanhui.Custom('gzol_t_xuanhui')]\n——Fiscal Commissions——\n　Salt and Iron Commissioner：[holder_t_yantie.Custom('gzol_t_yantie')]\n　Finance Planning Commissioner：[holder_t_duzhi.Custom('gzol_t_duzhi')]\n　Household Commissioner：[holder_t_hushi.Custom('gzol_t_hushi')]\n　Transport Commissioner：[holder_t_zhuanyun.Custom('gzol_t_zhuanyun')]\n　Coinage Commissioner：[holder_t_zhuqian.Custom('gzol_t_zhuqian')]\n　Tea Tax Commissioner：[holder_t_quecha.Custom('gzol_t_quecha')]\n　Land Tax Commissioner：[holder_t_zuyong.Custom('gzol_t_zuyong')]\n——Court Commissions——\n　Left Commandant-in-ordinary of the Shence Army：[holder_t_shencezuo.Custom('gzol_t_shencezuo')]\n　Right Commandant-in-ordinary of the Shence Army：[holder_t_shenceyou.Custom('gzol_t_shenceyou')]\n　Army-Inspection Commissioner：[holder_t_guanjunrong.Custom('gzol_t_guanjunrong')]\n　Palace Gate Commissioner：[holder_t_hemen.Custom('gzol_t_hemen')]\n　Guest Reception Commissioner：[holder_t_kesheng.Custom('gzol_t_kesheng')]\n　Protocol Commissioner：[holder_t_libin.Custom('gzol_t_libin')]\n　Imperial Estates Commissioner：[holder_t_neizhuangzhai.Custom('gzol_t_neizhuangzhai')]\n　Palace Parks Commissioner：[holder_t_gongyuan.Custom('gzol_t_gongyuan')]\n　Flying Dragon Stable Commissioner：[holder_t_feilong.Custom('gzol_t_feilong')]\n　Music Bureau Commissioner：[holder_t_jiaofang.Custom('gzol_t_jiaofang')]\n　Five Aviaries Commissioner：[holder_t_wufang.Custom('gzol_t_wufang')]\n　Imperial Kitchen Commissioner：[holder_t_shangshi.Custom('gzol_t_shangshi')]\n"
