 guanzhi_officer_list_tang:0 "——三师三公——\n　太师：[holder_t_taishi.Custom('gzol_t_taishi')]\n　太傅：[holder_t_taifu.Custom('gzol_t_taifu')]\n　太保：[holder_t_taibao.Custom('gzol_t_taibao')]\n　太尉：[holder_t_taiwei.Custom('gzol_t_taiwei')]\n　司徒：[holder_t_situ.Custom('gzol_t_situ')]\n　司空：[holder_t_sikong.Custom('gzol_t_sikong')]\n——三省与御史台——\n　尚书令：[holder_t_shangshuling.Custom('gzol_t_shangshuling')]\n　尚书左仆射：[holder_t_zuopuye.Custom('gzol_t_zuopuye')]\n　尚书右仆射：[holder_t_youpuye.Custom('gzol_t_youpuye')]\n　中书令：[holder_t_zhongshuling.Custom('gzol_t_zhongshuling')]\n　侍中：[holder_t_shizhong.Custom('gzol_t_shizhong')]\n　御史大夫：[holder_t_yushidafu.Custom('gzol_t_yushidafu')]\n——六部——\n　吏部侍郎：[holder_t_libu.Custom('gzol_t_libu')]\n　户部侍郎：[holder_t_hubu.Custom('gzol_t_hubu')]\n　礼部侍郎：[holder_t_libu_rites.Custom('gzol_t_libu_rites')]\n　兵部侍郎：[holder_t_bingbu.Custom('gzol_t_bingbu')]\n　刑部侍郎：[holder_t_xingbu.Custom('gzol_t_xingbu')]\n　工部侍郎：[holder_t_gongbu.Custom('gzol_t_gongbu')]\n——九寺——\n　太常寺卿：[holder_t_taichang.Custom('gzol_t_taichang')]\n　光禄寺卿：[holder_t_guanglu.Custom('gzol_t_guanglu')]\n　卫尉寺卿：[holder_t_weiwei_si.Custom('gzol_t_weiwei_si')]\n　宗正寺卿：[holder_t_zongzheng.Custom('gzol_t_zongzheng')]\n　太仆寺卿：[holder_t_taipu.Custom('gzol_t_taipu')]\n　大理寺卿：[holder_t_dali.Custom('gzol_t_dali')]\n　鸿胪寺卿：[holder_t_honglu.Custom('gzol_t_honglu')]\n　司农寺卿：[holder_t_sinong.Custom('gzol_t_sinong')]\n　太府寺卿：[holder_t_taifu_si.Custom('gzol_t_taifu_si')]\n——诸监——\n　国子监祭酒：[holder_t_guozi.Custom('gzol_t_guozi')]\n　少府监：[holder_t_shaofu_jian.Custom('gzol_t_shaofu_jian')]\n　将作大匠：[holder_t_jiangzuo.Custom('gzol_t_jiangzuo')]\n　军器监：[holder_t_junqi.Custom('gzol_t_junqi')]\n　都水监：[holder_t_dushui.Custom('gzol_t_dushui')]\n　秘书监：[holder_t_mishu.Custom('gzol_t_mishu')]\n　殿中监：[holder_t_dianzhong.Custom('gzol_t_dianzhong')]\n　内侍监：[holder_t_neishi.Custom('gzol_t_neishi')]\n——左军诸卫——\n　左卫大将军：[holder_t_zuowei.Custom('gzol_t_zuowei')]\n　左骁卫大将军：[holder_t_zuoxiaowei.Custom('gzol_t_zuoxiaowei')]\n　左武卫大将军：[holder_t_zuowuwei.Custom('gzol_t_zuowu