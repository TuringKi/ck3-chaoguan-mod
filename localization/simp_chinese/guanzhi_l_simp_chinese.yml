 guanzhi_vacant:0 "空缺"
 guanzhi_chaotang_hint:0 "皇帝自领的官职显示为空缺。右键廷臣或封臣选择「授予朝官」即可任命；点击在任者可罢免。"
 guanzhi_choose_system_decision_confirm:0 "就此厘定本朝官制？"
 guanzhi_arrange_offices_decision_confirm:0 "按照已选定的官制，创建全部朝官头衔并任命官员？"
