 guanzhi_grant_shizhi_interaction:0 "委任使职"
 guanzhi_grant_shizhi_interaction_desc:0 "委任此人物担任使职差遣（中枢、财政、宫廷诸使）。"
 guanzhi.0120.t:0 "委任使职"
 guanzhi.0120.desc:0 "择使职以委任[recipient.GetShortUIName]。使职无固定品级，随事而设。"
 guanzhi_grant_office_interaction:0 "授予朝官"
 guanzhi_grant_office_interaction_desc:0 "将一项朝官职位授予此人物。被授予者将成为你的封臣，官职出缺时由朝廷按功绩重新任命，不得世袭。"
 guanzhi_revoke_office_interaction:0 "罢免朝官"
 guanzhi_revoke_office_interaction_desc:0 "罢免此人物担任的全部朝官职位，官职由朝廷按功绩重新任命。"
 guanzhi_choose_system_decision:0 "厘定官制"
 guanzhi_choose_system_decision_desc:0 "为本朝选定中央朝官制度：唐制（三师三公、三省六部、九寺五监、十六卫）或汉制（三公九卿、尚书台、诸将军）。选定后可通过“安排朝官”决议或右键人物“授予朝官”来任免官员。"
 guanzhi_arrange_offices_decision:0 "安排朝官"
 guanzhi_arrange_offices_decision_desc:0 "按照已选定的官制，一次性创建全部朝官头衔并从朝臣中任命官员。旧存档可用此决议立即补齐所有官职。"
 guanzhi.9001.t:0 "厘定官制"
 guanzhi.9001.desc:0 "天下初定，百废待兴。中央朝廷的官制，当遵唐制——三师三公坐而论道，三省六部九寺五监分理庶政，十六卫拱卫京师；还是依汉制——三公九卿辅佐天子，尚书台出纳王命，诸将军分掌兵权？"
 guanzhi.9001.tang:0 "遵唐制（三省六部）"
 guanzhi.9001.han:0 "依汉制（三公九卿）"
 guanzhi.0001.t:0 "授予朝官"
 guanzhi.0001.desc:0 "为[recipient.GetShortUIName]选择一项朝官职位。官职出缺时将由朝廷按功绩重新任命。"
