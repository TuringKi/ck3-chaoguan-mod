 CHARACTER_FULL_NAME_NICKNAMED_DYNASTY_ALWAYS_FIRST: "$TITLE$$TIER$、$NICK$、$DYNASTY$$NAME$"
 CHARACTER_FULL_NAME_NICKNAMED_PREFIX_DYNASTY_ALWAYS_FIRST: "$TITLE$$TIER$、$NICK$、$DYNASTY$$NAME$"
 CHARACTER_FULL_NAME_UNLANDED_NICKNAMED_DYNASTY_ALWAYS_FIRST: "$NICK$、$DYNASTY$$NAME$"
 CHARACTER_FULL_NAME_UNLANDED_NICKNAMED_PREFIX_DYNASTY_ALWAYS_FIRST: "$NICK$、$DYNASTY$$NAME$"

 CHARACTER_FIRST_NAME_AND_DYNASTY_NICKNAMED_DYNASTY_FIRST: "$NICK$、$DYNASTY$$NAME$"
