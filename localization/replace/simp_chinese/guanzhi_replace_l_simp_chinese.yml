l_simp_chinese:
 # Guanzhi 官制 - 封号(昵称)名字格式: 用"、"代替引号
 # 覆盖原版 NICKNAMED 名字格式(仅汉语常用组, 不改日文/父名组)
 # 例: 尚书省尚书左仆射、淮阴侯、李纪·李氏

 CHARACTER_TITLE_NAME_NICKNAMED_PREFIX: "$TIER$、$NICK$"
 CHARACTER_TITLE_NAME_NICKNAMED_PATRONYM: "$TIER$、$NICK$"

 CHARACTER_FIRST_NAME_NICKNAMED: "$NICK$、$NAME$"
 CHARACTER_FIRST_NAME_NICKNAMED_PREFIX: "$NICK$、$NAME$"
 CHARACTER_TITLED_FIRST_NAME_NICKNAMED: "$TIER$、$NICK$、$NAME$"
 CHARACTER_TITLED_FIRST_NAME_NICKNAMED_PREFIX: "$TIER$、$NICK$、$NAME$"
 CHARACTER_TITLED_DYNASTY_FIRST_NICKNAMED: "$TIER$、$NICK$、$HOUSE$$NAME$"
 CHARACTER_TITLED_DYNASTY_FIRST_NICKNAMED_PREFIX: "$TIER$、$NICK$、$HOUSE$$NAME$"
 CHARACTER_FIRST_NAME_AND_DYNASTY_NICKNAMED: "$NICK$、$HOUSE$$NAME$"
 CHARACTER_NAME_NICKNAMED: "$TITLE$$TIER$、$NICK$、$NAME$"
 CHARACTER_NAME_NICKNAMED_PREFIX: "$TITLE$$TIER$、$NICK$、$NAME$，"
 CHARACTER_FULL_NAME_NICKNAMED: "$TITLE$$TIER$、$NICK$、$NAME$·$HOUSE$"
 CHARACTER_FULL_NAME_NICKNAMED_PREFIX: "$TITLE$$TIER$、$NICK$、$NAME$·$HOUSE$"
 CHARACTER_FULL_NAME_UNLANDED_NICKNAMED: "$NICK$、$NAME$·$HOUSE$"
 CHARACTER_FULL_NAME_UNLANDED_NICKNAMED_PREFIX: "$NICK$、$NAME$·$HOUSE$"

 # 姓氏在前组(汉语姓名顺序)
 CHARACTER_FIRST_NAME_NICKNAMED_DYNASTY_ALWAYS_FIRST: "$NICK$、$DYNASTY$$NAME$"
 CHARACTER_FIRST_NAME_NICKNAMED_PREFIX_DYNASTY_ALWAYS_FIRST: "$NICK$、$DYNASTY$$NAME$"
